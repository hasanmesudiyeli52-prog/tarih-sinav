{"id":1039,"d":"diplomasi","u":3,"n":63,"q":"Osmanlı’nın kuruluş döneminde Orhan Gazi’nin büyük oğlu Süleyman Paşa, 1352 tarihinde Rumeli’deki hangi kaleyi savaşmak yerine diplomasiyle ele geçirme başarısı göstermiştir?","o":{"a":"Eğriboz Kalesi","b":"Plevne Kalesi","c":"Selanik Kalesi","d":"Atina Kalesi","e":"Çimpe Kalesi"},"c":"e","ex":"Cevap : E) Çimpe KalesiAçıklama : Süleyman Paşa, Bizans İmparatoru Kantakouzenos’a yardım etmesi karşılığında, Rumeli’ye geçiş üssü olan Çimpe Kalesi’ni diplomasi ve ittifak yoluyla almıştır."},
{"id":1040,"d":"diplomasi","u":3,"n":64,"q":"Sultan III. Selim döneminde ilk daimi elçi olarak 1793’te Avrupa’da Londra’ya gönderilen Yusuf Agâh Efendi maiyetindeki Türk kişizadelerden Mehmet Derviş Efendi ile Mehmet Tahir Efendi, hangi özellikleri ile diplomasi tarihine geçmişlerdir?","o":{"a":"İlk defa dil tahsili görmeleriyle","b":"İlk şifreli yazışmayı yazmalarıyla","c":"Fransa Kralı ile görüşmeleriyle","d":"Eşleriyle görev yapmalarıyla","e":"Tarikat mensubu olmalarıyla"},"c":"a","ex":"Cevap : A) İlk defa dil tahsili görmeleriyleAçıklama : Bu görevliler, Batı dillerini (özellikle Fransızca ve İngilizce) öğrenmek ve diplomasi mesleğinde yetişmek üzere gönderilen ilk Türk memurları temsil ederler."},
{"id":1041,"d":"diplomasi","u":3,"x":[5],"n":65,"q":"1815 Viyana Kongresi’nde oluşan ve günümüzde de Avrupa Birliği içerisinde güncelliğini koruyan “Avrupa uyumu” kavramı hangi anlayışa dayanmaktadır?","o":{"a":"Kapitülasyonlar","b":"Güçler dengesi","c":"Refah toplumu","d":"Ad Hoc","e":"Ahde vefa"},"c":"b","ex":"Cevap : B) Güçler dengesiAçıklama : Viyana Kongresi ile kurulan “Avrupa Uyumu” (Concert of Europe) sistemi, hiçbir devletin tek başına hakimiyet kuramaması üzerine kurulu “Güçler Dengesi” ilkesine dayanır."},
{"id":1042,"d":"diplomasi","u":3,"n":66,"q":"Osmanlı’da diplomasi teşkilatında ve uygulamalarında Divan-ı Hümayun tercümanları arasından en fazla dil bilen hangi statüyü elde ederdi?","o":{"a":"Mütercim","b":"Mukayyit","c":"Baştercüman","d":"Kocabaşı","e":"Başmüdür"},"c":"c","ex":"Cevap : C) BaştercümanAçıklama : Osmanlı’da Divan-ı Hümayun tercümanları arasında en fazla dil bilen ve en üst statüye ulaşan kişi Baştercüman olarak adlandırılırdı. Baştercüman, özellikle dış ilişkilerde ve diplomatik yazışmalarda önemli bir görev üstlenirdi."},
{"id":1043,"d":"diplomasi","u":3,"n":67,"q":"Aşağıdakilerden hangisi 17. yüzyılın ortalarından itibaren Osmanlı diplomasisinde tercümanlık görevinde bulunan Fenerli Rum ailelerinden biri değildir?","o":{"a":"Sarıbeyzade","b":"Noradunkyan","c":"Yanokizade","d":"Mavrokardatos","e":"İskerletzade"},"c":"b","ex":"Cevap : B) Noradunkyan Açıklama : 17. yüzyılın ortalarından itibaren Osmanlı diplomasisinde tercümanlık görevini üstlenen Fenerli Rum aileleri arasında şu aileler yer alır: -Mavrokardatos -Yanokizade -İskerletzade -Sarıbeyzade Noradunkyan ise Fenerli Rum değil, daha sonraki dönemlerde Osmanlı bürokrasisinde görev yapan Ermeni kökenli bir aileye aittir. Bu yüzden doğru seçenek B’dir."},
{"id":1044,"d":"diplomasi","u":4,"n":68,"q":"Aşağıdaki hangi gayrimüslim diplomat Osmanlı hariciyesinde görev yapmıştır?","o":{"a":"İstefenaki Vogorides","b":"Bedros Kuyumciyan","c":"Aleksandr Karateodori","d":"Avram Galanti","e":"Edouard Blacque"},"c":"c","ex":"Cevap : C) Aleksandr Karateodori Açıklama : Aleksandr Karateodori Paşa, Osmanlı Devleti’nin en üst düzey gayrimüslim bürokratlarından biri olup, özellikle Berlin Kongresi’nde Osmanlı heyetine başkanlık etmiş ve Hariciye Nazırlığı görevinde bulunmuştur."},
{"id":1045,"d":"diplomasi","u":4,"n":69,"q":"Osmanlı Devleti’nin Birinci Dünya Savaşı’na girmesi öncesinde Hariciye Nezareti’nin teşkilatına dair hazırlanan Şubat 1914 tarihli nizamnameye göre, Hariciye Nezareti’nin hangi birimleri arasında işlevsel bağ kurulmuştur?","o":{"a":"Sefir ve Kişizade","b":"Büyükelçilik ve Ortaelçilik","c":"Müdürlük ve Umum Müdürlük","d":"Mühimme ve Amedi","e":"Diplomat ve Kordiplomat"},"c":"c","ex":"Cevap : C) Müdürlük ve Umum Müdürlük Açıklama : 1914 tarihli Hariciye Nezareti nizamnamesi, teşkilatın daha verimli çalışması için idari birimleri yeniden düzenlemiştir. Bu düzenleme ile müdürlükler ve umum müdürlükler arasında koordinasyonu sağlayacak işlevsel ve hiyerarşik bağlar güçlendirilmiştir."},
{"id":1046,"d":"diplomasi","u":4,"n":70,"q":"İslamiyet öncesi dönemde yabancı elçiler Hun hakanının huzuruna nasıl çıkabilirlerdi?","o":{"a":"Yüzlerini örterek","b":"Sarık giyerek","c":"Rüşvet vererek","d":"Silah kullanarak","e":"Saçlarını keserek"},"c":"a","ex":"Cevap : A) Yüzlerini örterek Açıklama : İslamiyet öncesi Türk devletlerinde, özellikle Hunlar döneminde, elçilerin kabulünde belirli protokol kuralları uygulanırdı. Bazı kaynaklara göre yabancı elçilerin hakanın huzuruna çıkarken yüzlerini örtmeleri bir gelenek veya zorunluluk olarak uygulanmıştır."},
{"id":1047,"d":"diplomasi","u":4,"n":71,"q":"Türk Boğazlarının uluslararası statüsüne dair imzalanan 1841 Londra Boğazlar Antlaşması’na göre Boğazlar hakkında hangi tarihi karar kabul edilmiştir?","o":{"a":"Boğazlar'da mutlak Osmanlı hakimiyetinin kabulü","b":"Boğazlar'ın bütün gemilere kapatılması","c":"Boğazlar'da avcılığın yasaklanması","d":"Boğazlar'ın büyük devletler himayesine girmesi","e":"Boğazlar'da mutlak Rus hakimiyetinin onaylanıması"},"c":"d","ex":"Cevap : D) Boğazlar’ın büyük devletler himayesine girmesi Açıklama :"},
{"id":1048,"d":"diplomasi","u":4,"n":72,"q":"Osmanlı ve Avrupalı diplomatların uzun süre gündeminde kalan ve Akdeniz’i Kızıldeniz’e bağlayan Süveyş Kanalı hangi padişah döneminde açılmıştır?","o":{"a":"II. Abdülhamit","b":"Abdülaziz","c":"Mehmet Reşat","d":"Vahidettin","e":"V. Murat"},"c":"b","ex":"Cevap : B) AbdülazizAçıklama : Akdeniz ve Kızıldeniz’i birbirine bağlayan stratejik Süveyş Kanalı, Sultan Abdülaziz döneminde 1869 yılında büyük bir törenle hizmete açılmıştır. Kanalın açılması dünya ticaret yollarını kökten değiştirmiştir."},
{"id":1049,"d":"diplomasi","u":4,"n":73,"q":"19. yüzyılda Osmanlı Devleti’nin de dâhil olduğu uluslararası krizlerden biri olan “Mülteciler Meselesi” Avrupa’daki hangi gelişme sonrası ortaya çıkmıştır?","o":{"a":"1853 Kırım Harbi","b":"1789 Franszı İhtilali","c":"1830 İhtilalleri","d":"1815 Viyana Kongresi","e":"1848 İhtilalleri"},"c":"e","ex":"Cevap : E) 1848 İhtilalleri Açıklama : 1848 İhtilalleri sonrasında Macar ve Polonyalı milliyetçilerin Avusturya ve Rusya’ya karşı başarısız olup Osmanlı topraklarına sığınması büyük bir “Mülteciler Meselesi”ne yol açmıştır. Osmanlı Devleti, sığınmacıları iade etmeyerek bu durumu uluslararası bir onur meselesi haline getirmiştir."},
{"id":1050,"d":"diplomasi","u":4,"n":74,"q":"II. Abdülhamit döneminde “Elviye-i Selase” olarak adlandırılan Selanik-Manastır-Kosova vilayetlerindeki olaylar nedeniyle hangi uluslararası sorun ortaya çıkımıştır?","o":{"a":"Mülteciler","b":"Makedonya","c":"Rumeli","d":"Doğu","e":"Balkan"},"c":"b","ex":"Cevap : B) Makedonya Açıklama : Selanik, Manastır ve Kosova illerinden oluşan bölgede milliyetçi ayaklanmalar ve çete faaliyetleri sonucu ortaya çıkan karmaşa, diplomatik literatürde “Makedonya Sorunu” olarak adlandırılmış ve büyük devletlerin müdahalesine açık bir alan oluşturmuştur."},
{"id":1051,"d":"diplomasi","u":4,"n":75,"q":"II. Abdülhamit döneminde Balkan krizinin çözümü amacıyla 5 Nisan 1886’da hangi antlaşma imzalanmıştır?","o":{"a":"Tophane","b":"Berlin","c":"Balta Limanı","d":"Hünkar İskelesi","e":"Ayastefanos"},"c":"a","ex":"Cevap : A) Tophane Açıklama : Tophane Antlaşması, 1886 yılında Doğu Rumeli’nin Bulgaristan Prensliği ile birleşmesiyle ortaya çıkan krizi çözmek amacıyla imzalanmıştır. Bu antlaşma ile Osmanlı Devleti, Doğu Rumeli’nin yönetimini Bulgar prensine bırakmayı kabul etmiştir."},
{"id":1052,"d":"diplomasi","u":4,"n":76,"q":"III. Selim’in diplomasi reformları kapsamında 1797’de personel yapısını düzenlemek amacıyla hangi nizamname çıkarılmıştır?","o":{"a":"Kalem","b":"Pasaport","c":"Şehbender","d":"Tayinat","e":"Misafiret"},"c":"a","ex":"Cevap : A) KalemAçıklama : III. Selim döneminde devlet kurumlarını modernize etme çabaları kapsamında 1797’de çıkarılan “Kalem Nizamnamesi”, bürokraside çalışan personelin özlük haklarını ve çalışma düzenini standardize etmeyi amaçlamıştır."},
{"id":1053,"d":"diplomasi","u":4,"n":77,"q":"Aşağıdakilerden hangisi Osmanlı’nım son dönemlerinde merkez teşkilatından ayrı olarak teşrifat görevlisi bulunduran kurumlardan biridir?","o":{"a":"Maliye","b":"Bahriye","c":"İlmiye","d":"Tophane","e":"Darphane"},"c":"b","ex":"Cevap : B) Bahriye Açıklama :"},
{"id":1054,"d":"diplomasi","u":4,"n":78,"q":"Osmanlı’da Sultan II. Mahmut dönemi modern diplomasi adımlarından biri olan Babıâli Tercüme Odası’nın kurulması … sonrasında gerçekleşmiştir. Yukarıda verilen boşluğa aşağıdakilerden hangisi getirilmelidir?","o":{"a":"1826 Yeniçeri İsyanı","b":"1831 Kavalalı İsyanı","c":"1866 Girit İsyanı","d":"1821 Rum İsyanı","e":"1804 Sırp İsyanı"},"c":"d","ex":"Cevap : D) 1821 Rum İsyanı Açıklama : 1821 Rum İsyanı öncesinde tercümanlık hizmetleri ağırlıklı olarak Fenerli Rumlar tarafından yürütülüyordu. İsyan sonrası duyulan güven kaybı ve güvenlik endişeleri, Müslüman Türklerin yabancı dil öğrenerek bu görevi üstlenmesi amacıyla Babıali Tercüme Odası’nın kurulmasına yol açmıştır."},
{"id":1055,"d":"diplomasi","u":4,"n":79,"q":"Aşağıdakilerden hangisi 1648 Westphalia Antlaşması sonrası Avrupa’da uluslararası ilişkileri ve diplomasiyi etkileyen kavramlardan biri olmuştur?","o":{"a":"Ganimet paylaşımı","b":"Ahde vefa","c":"Kilise vesayeti","d":"Güç dengesi","e":"Feodal düzen"},"c":"d","ex":"Cevap : D) Güç dengesi Açıklama : 1648 Westphalia Barışı, modern uluslararası sistemin temeli sayılır. Bu antlaşma ile dini otoritenin yerini seküler devletler almış ve Avrupa siyasetinde devletlerin birbirini dengelediği “Güç Dengesi” (Balance of Power) kavramı diplomasinin merkezine yerleşmiştir."},
{"id":1056,"d":"diplomasi","u":4,"n":80,"q":"Sultan Abdülaziz döneminde hangi ülke ile ilişkiler geliştirilerek 1862 tarihli Ticaret Antlaşması yapılmıştır?","o":{"a":"Almanya","b":"Arjantin","c":"Amerika","d":"Rusya","e":"Japonya"},"c":"c","ex":"Cevap : C) AmerikaAçıklama : 1862 yılında Amerika Birleşik Devletleri ile Osmanlı Devleti arasında ticaret ve dostluk ilişkilerini güçlendiren kapsamlı bir Ticaret Antlaşması imzalanmıştır. Bu dönemde Osmanlı yönetimi, Batılı ülkelerle ticari hacmi artırmaya yönelik benzer antlaşmalar yapmıştır."},
{"id":1057,"d":"diplomasi","u":4,"n":81,"q":"Sultan II. Mahmut dönemi teşrifatında önemli değişimlerden biri elçi kabullerinde …… uygulamasının başlatılmasıdır. Yukarıda verilen boşluğa aşağıdakilerden hangisi getirilmelidir?","o":{"a":"yer öptürülmesi","b":"askeri geçit töreni","c":"itimatname teslimi","d":"marş söylenmesi","e":"silah aranması yapılması"},"c":"b","ex":"Cevap : B) askeri geçit töreni Açıklama :"},
{"id":1058,"d":"diplomasi","u":4,"n":82,"q":"Türkiye Lozan Antlaşması’nı 1923’te imzalayınca Osmanlı dönemindeki diplomatik temsilciliklerinin….. bağlanması süreci iki hafta içinde tamamlanmıştır. Yukarıda verilen boşluğa aşağıdakilerden hangisi getirilmelidir?","o":{"a":"Tedkik-i Tensikat Komisyonuna","b":"Hariciye Nezareti Siyasi Müdürlüğüne","c":"Hukuk-1 Muhtelita Müdiriyetine","d":"Dahiliye Vekaletine","e":"Türkiye Büyük Millet Meclisine"},"c":"e","ex":"Cevap : E) Türkiye Büyük Millet Meclisine Açıklama : Lozan Antlaşması’nın imzalanması ile birlikte yeni Türkiye Devleti uluslararası alanda tescil edilmiştir. Bu süreçte Osmanlı’dan kalan dış temsilciliklerin ve diplomatik varlıkların yönetimi, yeni rejimin temsilcisi olan Türkiye Büyük Millet Meclisi (TBMM) hükümetine devredilmiştir."},
{"id":1059,"d":"diplomasi","u":4,"n":83,"q":"Kanuni Sultan Süleyman 1536’da hangi ülkeye “ahidname” verip destekleyerek Avrupa’daki dengelere müdahale etmiştir?","o":{"a":"Venedik","b":"Avusturya","c":"Prusya","d":"Ceneviz","e":"Fransa"},"c":"e","ex":"Cevap : E) Fransa Açıklama : Kanuni Sultan Süleyman, Şarlken’in Avrupa’daki gücünü kırmak ve Hristiyan birliğini parçalamak amacıyla 1536’da Fransa’ya geniş ticari ve hukuki imtiyazlar içeren bir “ahidname” (kapitülasyon) vermiştir."},
{"id":1060,"d":"diplomasi","u":4,"n":84,"q":"Osmanlı diplomasi tarihi için önemli kaynaklardan biri, Osmanlı vatandaşı olup 1912-1913 yıllarında Hariciye nazırı görevinde bulunan Gabriel Noradunkyan Efendi tarafindan Fransızca kaleme alınan “Recueil D’Actes Internationaux de L’Empire Ottoman” adlı eserdir. Gabriel Noradunkyan Efendi, Osmanlı’daki hangi millete mensuptur?","o":{"a":"Süryani","b":"Sırp","c":"Ermeni","d":"Bulgar","e":"Yahudi"},"c":"c","ex":"Cevap : C) Ermeni Açıklama : Gabriel Noradunkyan Efendi, Osmanlı Devleti’nin son dönemlerinde Hariciye Nazırlığı yapmış önemli bir Ermeni devlet adamıdır. Kendisi aynı zamanda Osmanlı diplomasisi için temel kaynak sayılan Fransızca “Recueil D’Actes Internationaux de L’Empire Ottoman” eserinin yazarıdır."},
{"id":1061,"d":"diplomasi","u":4,"n":85,"q":"1811’de İran’a gönderilen ve maiyetindeki Bozoklu Osman Şakir Efendi’nin “Musavver İran Sefaretnâmesi”ni kaleme aldığı Osmanlı elçisi hangisidir?","o":{"a":"Abdurrahim Muhip Efendi","b":"Mehmet Halet Efendi","c":"Yusuf Agâh Efendi","d":"Moralı Esseyyit Ali Efendi","e":"Yasincizade Seyyit Abdülvehhap Efendi"},"c":"e","ex":"Cevap : E) Yasincizade Seyyit Abdülvehhap Efendi Açıklama : 1811’de İran şahının huzuruna gönderilen Yasincizade Seyyit Abdülvehhap Efendi’nin elçilik heyetinde bulunan Bozoklu Osman Şakir Efendi, bu seyahati çizimlerle destekleyerek “Musavver İran Sefaretnamesi” adıyla meşhur eseri oluşturmuştur."},
{"id":1062,"d":"diplomasi","u":4,"n":86,"q":"Osmanlı klasik döneminde Babıâli’de yabancı elçilikler ile olan görüşmelere hangi görevli katılırdı?","o":{"a":"Reisülküttap","b":"Şeyhülislam","c":"Çavuşbaşı","d":"Teşrifatçı","e":"Nakibüleşraf"},"c":"a","ex":"Cevap : A) ReisülküttapAçıklama : Klasik dönemde dış işlerinden sorumlu olan Reisülküttap, yabancı elçilerin kabullerinde ve Babıali’deki diplomatik görüşmelerde padişah ve sadrazam adına süreci yöneten temel görevliydi."},
{"id":1063,"d":"diplomasi","u":4,"n":87,"q":"Osmanlı klasik devrinde İran, Türkistan hanlıkları, Hindistan ve Fas gibi Müslüman ülkelere hangi sınıfa mensup elçiler gönderilmekteydi?","o":{"a":"Dahiliye","b":"Askeriye","c":"Kalemiye","d":"İlmiye","e":"Maliye"},"c":"d","ex":"Cevap : D) İlmiye Açıklama : Osmanlı Devleti, diğer Müslüman ülkelere gönderdiği elçileri genellikle dini ve hukuki bilgi birikimi yüksek olan İlmiye sınıfından seçerdi. Bu durum, ortak dini bağların ve fıkhi meselelerin diplomasi kanallarında daha rahat konuşulmasını sağlardı."},
{"id":1064,"d":"diplomasi","u":3,"n":88,"q":"İslam tarihinde Hz. Peygamber dönemi diplomasi uygulamasında mütekabiliyet anlayışı çerçevesinde elçilere ait mallar hakkında hangi uygulama gerçekleştirilmiştir?","o":{"a":"Gümrük vergisinden muaf olma","b":"Aşar vergisinden muaf olma","c":"Cizye vergisinden muaf olma","d":"Gelir vergisinden muaf olma","e":"Ağnam vergisinden muaf olma"},"c":"a","ex":"Cevap : A) Gümrük vergisinden muaf olmaAçıklama : İslam tarihinde, Hz. Peygamber dönemi diplomasi uygulamasında mütekabiliyet (karşılıklılık) ilkesi gereği, diğer devletlerden gelen elçilerin ve mallarının gümrük vergisinden muaf tutulması uygulaması gerçekleştirilmiştir."},
{"id":1065,"d":"diplomasi","u":3,"n":89,"q":"Sultan III. Murat’ın 1592 tarihinde ahidnâme vererek Osmanlı sularında ticari ayrıcalık tanıdığı İngiliz şirketi aşağıdakilerden hangisidir?","o":{"a":"East India Company","b":"Empire Interactive Company","c":"Levant Company","d":"International Contract Company","e":"Chamber of Commerce Company"},"c":"c","ex":"Cevap : C) Levant CompanyAçıklama : Levant Company (Levant Şirketi), 1592 yılında Sultan III. Murat tarafından verilen ahidnâme ile Osmanlı topraklarında ticari ayrıcalıklar elde eden İngiliz şirketidir."},
{"id":1066,"d":"diplomasi","u":3,"n":90,"q":"Osmanlı diplomasi uygulamasında “sefarethane” kavramı hangi manada kullanılmıştır?","o":{"a":"Elçi Hanı","b":"İkamet Elçiliği","c":"Elçi ağırlama","d":"Muayede Salonu","e":"Alay Köşkü"},"c":"b","ex":"Cevap : B) İkamet ElçiliğiAçıklama : Osmanlı diplomasi tarihinde “sefarethane” kavramı, özellikle 18. yüzyıl sonrası kurulan ve yabancı devlet elçilerinin sürekli olarak ikamet ettikleri, günümüzdeki büyükelçilikler gibi daimi misyonları ifade etmek için kullanılmıştır."},
{"id":1067,"d":"diplomasi","u":3,"n":91,"q":"Sultan III. Selim reformları kapsamında 1797’de Paris sefiri olarak atanan Morali Es-seyyit Ali Efendi’nin karşılaştığı diplomatik kriz aşağıdakilerden hangisidir?","o":{"a":"Kudüs Kutsal Yerler Sorunu","b":"Avrupa Vesayet Savaşları","c":"Kapitülasyonların yenilenmesi","d":"Süveyş Kanalı'nın açılması","e":"Fransa'nın Mısır'ı işgali"},"c":"e","ex":"Cevap : E) Fransa’nın Mısır’ı işgali Açıklama : Morali Es-seyyit Ali Efendi, Paris’teki görevi sırasında Fransa’nın 1798’de Osmanlı toprağı olan Mısır’ı işgal etmesiyle büyük bir diplomatik krizle karşı karşıya kalmıştır."},
{"id":1068,"d":"diplomasi","u":3,"n":92,"q":"Osmanlı Devleti, İstanbul suriçinde ve tarihi yarımadada yalnızca hangi ülkeye elçilik binası bulundurma izni vermiştir?","o":{"a":"İran","b":"İngiltere","c":"Avusturya","d":"Mısır","e":"Rusya"},"c":"a","ex":"Cevap : A) İranAçıklama : Osmanlı Devleti, genellikle Haliç’in ötesindeki Galata gibi bölgelerde elçilik binalarına izin verirken, sadece komşusu ve İslam devleti olması nedeniyle İran’a İstanbul suriçinde (tarihi yarımada) elçilik binası bulundurma izni vermiştir."},
{"id":1069,"d":"diplomasi","u":5,"n":93,"q":"1908’de II. Meşrutiyetin ilanı ile birlikte Osmanlı diplomatlarının aileleri hakkında hangi karar alınmıştır?","o":{"a":"Görevin babadan oğula geçmesi","b":"Boşanma davalarının kolaylaştırılması","c":"Eşlere tazminat verilmesi","d":"Çocukların ücretsiz eğitimi","e":"Eşlerin görev yerlerine götürülebilmesi"},"c":"e","ex":"Cevap : E) Eşlerin görev yerlerine götürülebilmesiAçıklama : II. Meşrutiyet döneminde yapılan modernleşme adımlarından biri olarak, Osmanlı diplomatlarına Avrupa’daki meslektaşları gibi ailelerini (eş ve çocuklarını) de görev yaptıkları yurt dışı temsilciliklere götürebilme izni verilmiştir."},
{"id":1070,"d":"diplomasi","u":5,"n":94,"q":"Aşağıdakilerden hangisi Sultan III. Selim döneminde modern Türk diplomasisinin kurulmasında büyük pay sahibi olan Mehmet Raşit Efendi’nin girişimleri ile uygulanmaya başlanan yeniliklerden biri değildir?","o":{"a":"Dış ilişkilerde güçler dengesine dikkat edilmesi","b":"İran ile ilişkilerin tamamen kesilmesi","c":"Dış ilişkilerde devletlerarası hukukun benimsenmesi","d":"Avrupalı ile ilişkilerde mütekabiliyet esasına uyulması","e":"Elçilere uygulanan tayınat usulünün kaldırılması"},"c":"b","ex":"Cevap : B) İran ile ilişkilerin tamamen kesilmesiAçıklama : Mehmet Raşit Efendi, Osmanlı diplomasisini modernleştirmeyi amaçlayan bir reformatördü. Onun yaklaşımı, ilişkileri kesmek üzerine değil, tam tersine mütekabiliyet (karşılıklılık) ve denge politikası gibi ilkelerle Avrupa ve diğer devletlerle ilişkileri düzenlemek üzerine kuruluydu."},
{"id":1071,"d":"diplomasi","u":5,"n":95,"q":"Rus Çarlığı ile 1774’te imzalanan Küçük Kaynarca Antlaşma’nın en önemli maddelerinden biri Kırım Hanlığı ile Osmanlı’nın bağının kopmasıydı. Bununla birlikte anlaşmaya göre Kırım Tatarlarının dini bakımdan ….. kurumuna bağlılıkları ve hutbenin Osmanlı Padişahı adına okunması kabul edilmişti. Yukarıda verilen boşluğa aşağıdakilerden hangisi getirilmelidir?","o":{"a":"Reisülküttap","b":"Hilafet","c":"Müşavir","d":"Sadaret","e":"Hidiv"},"c":"b","ex":"Cevap : B) Hilafet Açıklama : Osmanlı Devleti, Kırım’ın siyasi bağımsızlığını tanımak zorunda kalırken, bölgeyle olan bağını koparmamak için padişahın aynı zamanda tüm Müslümanların halifesi olduğunu vurgulamış ve Kırım Müslümanlarının dini olarak Halifeye (Hilafet kurumuna) bağlı kalmasını antlaşmaya bir madde olarak ekletmiştir."},
{"id":1072,"d":"diplomasi","u":5,"x":[3],"n":96,"q":"Aşağıdakilerden hangisi klasik dönemden itibaren Osmanlı diplomasi uygulamalarının beslendiği kaynaklardan biri değildir?","o":{"a":"İslam’ın siyasal mirası","b":"Ordunun kazandığı başarılar","c":"Rönesans ve Reform aydınlanma fikirleri","d":"Roma ve Bizans’ın siyasi mirası","e":"Türk cihan hâkimiyeti anlayışı"},"c":"c","ex":"Cevap : C) Rönesans ve Reform aydınlanma fikirleriAçıklama : Klasik dönem Osmanlı diplomasisi; İslam devlet geleneği, Türk hakimiyet anlayışı, Bizans’tan devralınan pratikler ve askeri güç gibi unsurlara dayanıyordu. Avrupa’daki Rönesans ve Reform hareketlerinin fikirleri, bu dönemin Osmanlı diplomasi anlayışını etkileyen bir kaynak olmamıştır."},
{"id":1073,"d":"diplomasi","u":5,"n":97,"q":"Osmanlı’da kurumsallaşmanın kısıtlı olduğu ilk dönemlerde fevkalade elçilerin seçiminde diplomatik deneyim ve tecrübe aranmamaktaydı. Bununla birlikte mümkün olduğunca elçilerin saray okulu ….. yetişmiş kişilerden seçilmesine dikkat edilirdi. Yukarıda verilen boşluğa aşağıdakilerden hangisi getirilmelidir?","o":{"a":"Enderun'dan","b":"Darülfünun'dan","c":"rüştiyeden","d":"medreseden","e":"Tıbbiye'den"},"c":"a","ex":"Cevap : A) Enderun’dan Açıklama : Enderun, Osmanlı Devleti’nin yönetici ve idareci kadrolarını yetiştiren saray okuluydu. Buradan mezun olanlar, devlet adabını ve protokolünü bildikleri için önemli diplomatik görevlere seçilirlerdi."},
{"id":1074,"d":"diplomasi","u":5,"x":[3],"n":98,"q":"Aşağıdakilerden hangisi Beylikçi Kaleminde muhafaza edilen Osmanlı diplomatik belge türleri arasında yer almamaktadır?","o":{"a":"Antlaşma","b":"Berat","c":"Ahidname","d":"Ferman","e":"Pasaport"},"c":"e","ex":"Cevap : E) PasaportAçıklama : Beylikçi Kalemi, Divan-ı Hümayun’un en önemli kalemlerinden biri olarak devletin en üst düzey belgelerini (uluslararası antlaşmalar, ahidnameler, padişah fermanları ve beratları) hazırlayıp arşivlerdi. Pasaport gibi daha rutin ve idari belgeler bu kalemin temel görev alanına girmezdi."},
{"id":1075,"d":"diplomasi","u":5,"n":99,"q":"Osmanlı diplomasi tarihi için önemli kaynaklardan biri, Osmanlı vatandaşı olup 1912-1913 yıllarında Hariciye Nazırı görevinde bulunan Gabriel Noradunkyan Efendi tarafından Fransızca kaleme alınan “Recueil D’Actes Internationaux de L’Empire Ottoman” adlı eserdir. Türk hariciyesinde hizmet gören Gabriel Noradunkyan Efendi, Osmanlı’daki hangi millete mensuptur?","o":{"a":"Süryani","b":"Ermeni","c":"Bulgar","d":"Yahudi","e":"Sırp"},"c":"b","ex":"Cevap : B) Ermeni Açıklama : Osmanlı Devleti’nde Hariciye Nazırlığı gibi çok önemli bir göreve yükselen ve Osmanlı antlaşmalarını derlediği eseriyle tanınan Gabriel Noradunkyan Efendi, Osmanlı Ermeni cemaatinin önde gelen üyelerindendi."},
{"id":1076,"d":"diplomasi","u":5,"n":100,"q":"Osmanlı ordusunun Baltacı Mehmet Paşa komutasında Ruslara karşı kesin zaferi sonrasında imzalanan, fakat savaş meydanındaki başarıyı gölgeleyen 23 Temmuz 1711 tarihli antlaşma aşağıdakilerden hangisidir?","o":{"a":"Küçük Kaynarca Antlaşması","b":"Edirne Antlaşması","c":"Saint Petersburg Antlaşması","d":"Prut Antlaşması","e":"Ayastefanos Antlaşması"},"c":"d","ex":"Cevap : D) Prut AntlaşmasıAçıklama : 1711 yılında Osmanlı ordusunun Rus ordusunu Prut Nehri kıyısında tamamen kuşatmasına rağmen, yeniçerilerin isteksizliği ve diğer etkenlerle imzalanan Prut Antlaşması, elde edilebilecek daha büyük kazanımları engellediği için eleştirilmiştir."},
{"id":1077,"d":"diplomasi","u":5,"x":[4],"n":101,"q":"Osmanlı diplomasi uygulamasında kara yolu ile gelip Osmanlı sınırından giren elçilik heyetlerini karşılamak üzere aşağıdaki görevlilerden hangisi tayin edilirdi?","o":{"a":"Kişizade","b":"Balyos","c":"Konsolos","d":"Mihmandar","e":"Beylikçi"},"c":"d","ex":"Cevap : D) MihmandarAçıklama : Mihmandar, Osmanlı Devleti’ne gelen yabancı elçileri sınırdan karşılayan, yolculukları boyunca onlara eşlik eden, konaklama ve iaşe gibi ihtiyaçlarını karşılayan ve başkente kadar rehberlik eden özel görevlidir."},
{"id":1078,"d":"diplomasi","u":5,"x":[4],"n":102,"q":"Osmanlı vatandaşı gayrimüslimlere yeni haklar veren 1856 Islahat Fermanı, Osmanlı ile hangi ülkelerin diplomatları tarafından müşterek olarak hazırlanmıştır?","o":{"a":"Rusya-Yunanistan","b":"Fransa-Avusturya","c":"Prusya-Rusya","d":"İngiltere-Fransa","e":"İngiltere-Rusya"},"c":"d","ex":"Cevap : D) İngiltere-FransaAçıklama : Kırım Savaşı’nda Osmanlı Devleti’nin müttefiki olan İngiltere ve Fransa, savaş sonrası yapılacak Paris Antlaşması öncesinde Osmanlı’ya baskı yaparak gayrimüslimlere yönelik reformları içeren Islahat Fermanı’nın metninin hazırlanmasında ve ilan edilmesinde belirleyici rol oynamışlardır."},
{"id":1079,"d":"diplomasi","u":5,"n":103,"q":"Aşağıdaki devletlerden hangisi 1878 Berlin Antlaşması sonrası Osmanlı Devleti’nden tam bağımsızlığını kazanmıştır?","o":{"a":"Arnavutluk","b":"Sırbistan","c":"Cezayir","d":"Yunanistan","e":"Irak"},"c":"b","ex":"Cevap : B) SırbistanAçıklama : 1878 Berlin Antlaşması ile Sırbistan, Karadağ ve Romanya’nın Osmanlı Devleti’nden tam bağımsızlıkları uluslararası alanda tanınmıştır."},
{"id":1080,"d":"diplomasi","u":5,"n":104,"q":"Sultan II. Abdülhamit’in 1876’da diplomasi kurumlarında yaptığı düzenleme sonrası yeni teşrifat ve protokol birimi aşağıdakilerden hangisi olmuştur?","o":{"a":"Teşrifat-ı Umumiye Nezareti","b":"Hariciye Teşrifatçılığı","c":"Teşrifat-ı Umumiye Dairesi","d":"Hariciye Tahrirat Müdürlüğü","e":"Umur-ı Hariciye Nezareti"},"c":"a","ex":"Cevap : A) Teşrifat-ı Umumiye NezaretiAçıklama : Sultan II. Abdülhamit, devlet protokolünü merkezileştirmek ve modernize etmek amacıyla 1876’da tüm teşrifat işlerini tek bir çatı altında toplayan Teşrifat-ı Umumiye Nezareti’ni (Genel Teşrifat Bakanlığı) kurmuştur."},
{"id":1081,"d":"diplomasi","u":5,"n":105,"q":"1853­-1856 Kırım Harbi sürecinde Osmanlı diplomatları hangi yeni yazışma türü ile ilk defa olarak tanışmışlardır?","o":{"a":"Posta","b":"Şifre","c":"Daktilo","d":"Telefon","e":"Telgraf"},"c":"e","ex":"Cevap : E) Telgraf Açıklama : Kırım Savaşı, telgraf hattının askeri ve diplomatik haberleşmede yaygın olarak kullanıldığı ilk büyük savaşlardan biridir. Bu sayede cephe ile başkentler arasındaki iletişim o güne dek görülmemiş bir hıza ulaşmıştır."},
{"id":1082,"d":"diplomasi","u":5,"n":106,"q":"Osmanlı’nın tek taraflı diplomasi uygulamalarında zirve dönemini yaşadığı Kanuni Sultan Süleyman devrinde, Sultanın Avrupa’daki denge siyasetinde ve diplomasi anlayışında, aşağıdaki hangi ülkeye 1536’da kapitülasyon (ahidnâme) verilerek destek sağlanmıştır?","o":{"a":"Yunanistan","b":"Lehistan","c":"Fransa","d":"Rusya","e":"İngiltere"},"c":"c","ex":"Cevap : C) FransaAçıklama : Kanuni Sultan Süleyman, Avrupa’daki en büyük rakibi olan Kutsal Roma-Germen İmparatoru Şarlken’e karşı bir denge unsuru oluşturmak amacıyla, Şarlken’in rakibi olan Fransa Kralı I. François ile ittifak kurmuş ve bu ittifak çerçevesinde Fransa’ya geniş ticari imtiyazlar (kapitülasyonlar) vermiştir."},
{"id":1083,"d":"diplomasi","u":5,"n":107,"q":"Yunanistan’a bağımsızlığını veren 3 Şubat 1830 tarihli Londra Antlaşması’na “kurucu devletler (protecting power)” statüsünde imza atan Avrupa ülkeleri hangileridir?","o":{"a":"İngiltere-Prusya-Rusya","b":"İngiltere-Fransa-Prusya","c":"İngiltere-Avusturya-Rusya","d":"İngiltere-Rusya-Venedik","e":"İngiltere-Fransa-Rusya"},"c":"e","ex":"Cevap : E) İngiltere-Fransa-RusyaAçıklama : 1827’deki Navarin baskınında Osmanlı donanmasını yakan ve Yunan isyanını destekleyen üç büyük güç olan İngiltere, Fransa ve Rusya, bağımsız Yunanistan Krallığı’nın kuruluşunu ve garantörlüğünü üstlenen devletler olmuşlardır."},
{"id":1084,"d":"diplomasi","u":5,"x":[3],"n":108,"q":"Bütün İslâm devletlerinde dış ilişkiler ve diplomasi anlayışında kullanılan hukuki ve fıkhi bir terim olan “Darülharp” kavramı hangi anlamı taşımaktadır?","o":{"a":"Müslüman olmayan ülkelerin toprakları","b":"Barış görüşmesi yapılan topraklar","c":"Harp edilmesi yasak topraklar","d":"Müslüman olan ülkelerin toprakları","e":"Kutsal topraklar"},"c":"a","ex":"Cevap : A) Müslüman olmayan ülkelerin topraklarıAçıklama : Klasik İslam devletler hukukunda dünya, Darülislam (İslam egemenliğindeki topraklar) ve Darülharp (İslam egemenliğinde olmayan, potansiyel savaş durumu bulunan topraklar) olarak ikiye ayrılırdı."},
{"id":1085,"d":"diplomasi","u":3,"n":109,"q":"Osmanlı klasik döneminde yurt dışına görevlendirilen elçilere paye verilmekteydi. Aşağıdakilerden hangisi elçilere verilen bu payelerden biri değildir?","o":{"a":"Nişancılık","b":"Defterdarlık","c":"Rumeli Beylerbeyliği","d":"Anadolu Beylerbeyliği","e":"Hıdivlik"},"c":"e","ex":"Cevap: E) Hıdivlik Açıklama: Hıdivlik, Mısır valiliği anlamına gelir ve elçilere verilen payelerden biri değildir."},
{"id":1086,"d":"diplomasi","u":3,"n":110,"q":"Osmanlı klasik döneminde Topkapı Sarayı’ndaki Alay Köşkü hangi diplomatik amaç için kullanılmaktaydı?","o":{"a":"Yabancı elçilerin ikameti","b":"Konsolosluk işlemlerinin yürütülmesi","c":"Osmanlı elçilerinin eğitimi","d":"Elçilere Name-i Hümayun takdimi","e":"Sultanın elçilik heyetlerini izlemesi"},"c":"e","ex":"Cevap: E) Sultanın elçilik heyetlerini izlemesi Açıklama: Alay Köşkü, sultanın elçilik heyetlerini izlediği mekandır."},
{"id":1087,"d":"diplomasi","u":3,"n":111,"q":"Sultan IV. Murat döneminde İran ile imzalanan ve Doğu sınırlarının belirlendiği 1639 tarihli antlaşma hangisidir?","o":{"a":"Amasya Antlaşması","b":"Erzurum Antlaşması","c":"Ahmet Paşa Antlaşması","d":"Kasr-ı Şirin Antlaşması","e":"Türkmençay Antlaşması"},"c":"d","ex":"Cevap: D) Kasr-ı Şirin Antlaşması Açıklama: Kasr-ı Şirin Antlaşması, Osmanlı Devleti ile İran arasında 1639 yılında imzalanmıştır ve Doğu sınırlarını belirlemiştir."},
{"id":1088,"d":"diplomasi","u":3,"n":112,"q":"Diplomaside en çok vurgu yapılan kavramlardan biri ……. vermektir. Bu uygulama, genellikle dışişleri örgütünün bir yabancı temsilciliğe veya yabancı temsilciliğin dışişlerine veya diğer temsilciliklere resmî bir bildirim yapmasıyla ortaya çıkmıştır. Yukarıda verilen boşluğa aşağıdakilerden hangisi getirilmelidir?","o":{"a":"ültimatom","b":"berat","c":"tayinat","d":"ferman","e":"nota"},"c":"e","ex":"Cevap: E) nota Açıklama: Diplomaside “nota“ verme işlemi, bir ülkenin resmi bildirimidir."},
{"id":1089,"d":"diplomasi","u":3,"n":113,"q":"Sultan III. Selim devrinde Avusturya’ya karşı 31 Ocak 1790 tarihinde imzalanan Osmanlı-Prusya İttifak Antlaşması, aşağıdaki hangi prosedürden sonra yürürlük kazanmıştır?","o":{"a":"Sadrazam imzası","b":"Nişancı tuğrası","c":"Meclis-i Mebusan onayı","d":"Şeyhülislam fetvası","e":"Reisülküttap maruzatı"},"c":"d","ex":"Cevap: D) Şeyhülislam fetvası"},
{"id":1090,"d":"diplomasi","u":3,"n":114,"q":"Sultan III. Selim reformları kapsamında sürekli diplomasiye geçiş ardından aşağıdaki hangi Avrupa başkentine daimi elçi gönderilmemiştir?","o":{"a":"Londra","b":"Viyana","c":"Berlin","d":"Atina","e":"Paris"},"c":"d","ex":"Cevap: D) Atina Açıklama: III. Selim döneminde Atina’ya daimi elçi gönderilmemiştir, diğer başkentlere ise gönderilmiştir."},
{"id":1091,"d":"diplomasi","u":3,"n":115,"q":"Osmanlı Devleti’nin İstanbul’u fethi sonrası ilk elçilik, 1454 tarihinde hangi ülke tarafından açılmıştır?","o":{"a":"Portekiz","b":"Venedik","c":"İspanyol","d":"Ceneviz","e":"Amerika"},"c":"b","ex":"Cevap: B) Venedik Açıklama: Osmanlı İmparatorluğu’nda İstanbul’un fethinden sonra ilk elçilik Venedik tarafından açılmıştır."},

{"id":1166,"d":"diplomasi","u":4,"n":190,"q":"1856 Paris Antlaşması’nda Mehmet Emin Ali Paşa’nın 25 Mart’ta gündeme getirdiği ve reddedilen ekonomik talep nedir?","o":{"a":"Askeri yardım","b":"Kapitülasyonlar","c":"Sınır düzenlenmesi","d":"Kredi talebi"},"c":"b","ex":"Cevap : B) Kapitülasyonlar Paris Antlaşması sonucunda Osmanlı Devleti kâğıt üzerinde Avrupa devletler sisteminin eşit bir üyesi olarak kabul edildi ve Avrupa hukukundan istifadesi sağlandı. Osmanlı ilk defa böyle büyük bir Avrupa kongresine katılıyordu. Bu tespit önemli olmakla birlikte, aslında bunun pek de pratiği olmamıştır. Görüşmeler sırasında müttefik devletler arasındaki ittifak bozulmuş ve herkes kendi menfaatine göre hareket etmiştir. Bu durum, Osmanlı delegasyonunu olumsuz etkilemiştir. Nitekim Mehmet Emin Ali Paşa’nın 25 Mart’ta gündeme getirmiş olduğu ve birtakım destek vaatleri almakla yetinmek zorunda kaldığı kapitülasyonlar kaldırılamamıştır."},
{"id":1167,"d":"diplomasi","u":4,"n":191,"q":"Kavalalı Mehmet Ali Paşa nedeniyle yaşanan Mısır Meselesinden sonra Osmanlıyı en çok uğraştıran sorun aşağıdakilerden hangisidir?","o":{"a":"Cebel-i Lübnan","b":"Boğazlar Meselesi","c":"Mülteciler meselesi","d":"Kutsal yerler meselesi"},"c":"b","ex":"Cevap : B) Boğazlar MeselesiB Mısır sorunu çözüldüğünden Avrupa diplomasisi tekrar Boğazlar meselesine odaklandı. Müzakereler sonucunda 10-13 Temmuz 1841 tarihlerinde Babıâli ile beş büyük devlet arasında Londra Boğazlar Protokol ve Antlaşması imzalandı."},
{"id":1168,"d":"diplomasi","u":4,"n":192,"q":"Tanzimat Dönemi Diplomatlarından Mehmet Emin Ali Paşa, denge politikası gütmekle beraber hangi ülkenin siyasetine daha yakın olmuştur?","o":{"a":"Fransa","b":"İngiltere","c":"Hollanda","d":"Rusya","e":"Avusturya"},"c":"a","ex":"Cevap : A) Fransa Ali Paşa, yakın mesai arkadaşı Fuat Paşa’nın ölümü üzerine (1869), Hariciye Nezareti’ni de üzerine aldı. Bu tarihten itibaren tek söz sahibi olarak hükümet idaresini ölünceye kadar sıkı bir şekilde elinde tuttu. Dış politikada İngiliz siyasetinden ayrılmayan Reşit Paşa’nın aksine Fransız politikası taraftarı idi. Bu devletin 1870 Alman savaşıyla ağır bir yenilgiye uğramasının Avrupa’da hüküm süren kuvvet dengesini bozacağını ve Osmanlı Devleti için de önemli sonuçlar doğuracağını görmüştü."},

{"id":1171,"d":"diplomasi","u":4,"n":195,"q":"1818 Aix-la Chapelle Kongresi’nde diplomasi sınıflarının temsilcileri ve protokol yöntemleri belirlenmiştir. Aşağıdaki sınıflardan hangisi bu kongrede belirlenmiştir?","o":{"a":"Orta elçi","b":"Çavuş","c":"Şehbender","d":"Reisülküttab","e":"Balyos"},"c":"a","ex":"Cevap : A) Orta elçi Diplomasi temsilcilerinin sınıfları ve protokol yöntemleri, Viyana’da düzenlenen ve 1818’de Aix-la Chapelle Kongresi’nde yazılı olarak tanımlanan hukuk kuralları olarak düzenlenmiş ve zamanımıza kadar gelmiştir. Aix-La Chappelle Protokolü ile belirlenen diplomatik temsilciler ise aşağıdaki gibi dört grupta sınıflandırılmıştı: – Büyük Elçiler ve Legalar – Ortaelçiler – Mukim Elçiler – Maslahatgüzarlar"},

{"id":1174,"d":"diplomasi","u":4,"n":198,"q":"Elçi maiyetinin içerisinde aşağıdakilerden hangisi yoktur?","o":{"a":"Aşçı","b":"Berber","c":"Telgraf Memuru","d":"Katip","e":"Mektupçu"},"c":"c","ex":"Cevap : C) Telgraf Memuru Osmanlıya gelen elçilik heyetlerinin maiyetleri hakkında da bazı bilgiler mevcuttur. Buna göre heyette tercümanlar, kâtipler, mektupçu, tabip, cerrah, dini temsilci, berber, aşçı ve çeşitli hizmetkârlar yer alabiliyordu. Ayrıca bunların yanında bazen bir kısmı kendi isteğiyle ve masraflarını kendileri karşılamak suretiyle heyete katılan ressam, seyyah, âlim ve tüccar da bulunuyordu."},

{"id":1178,"d":"diplomasi","u":4,"n":202,"q":"Tarihin bilinen ilk yazılı barış anlaşması Kadeş Antlaşması hangi dilde yazılmıştır?","o":{"a":"Hitit Dili","b":"Akad Dili","c":"Mısır Dili","d":"Urartu Dili","e":"Sanskritçe"},"c":"b","ex":"Cevap : B) Akad Dili Tarihin bilinen ilk yazılı barış anlaşması Hititler (MÖ. 1650-MÖ. 1180) devrine aittir. Hititler ve eski Mısırlılar (MÖ. 3000-MÖ. 670) arasındaki savaşı sona erdiren Kadeş Antlaşması, diplomasi tarihinin bilinen ilk belgesi olma özelliğini korumaktadır. MÖ. 1280 tarihini taşıyan ve Akadca kaleme alınan bu antlaşma, kil bir tablete yazılıdır ve bir kopyası 1906 yılında Hitit İmparatorluğu’nun başşehri Hattuşa’da keşfedilmiştir."},
{"id":1179,"d":"diplomasi","u":4,"n":203,"q":"93 Harbi diye bilinen 1877-78 Osmanlı- Rus Savaşı sonunda imzalanan ilk antlaşma aşağıdakilerden hangisi olmuştur?","o":{"a":"Plevne Antlaşması","b":"Ayastefanos Antlaşması","c":"Kars Antlaşması","d":"Tuna Antlaşması","e":"Edirne Mütarekesi"},"c":"e","ex":"Cevap : E) Edirne Mütarekesi 24 Aralık 1877’de İngiltere’ye müracaat edilerek savaşın sona ermesi için aracılık yapması rica edildi. Rusya ise, Babıâli’nin savaşı bitirmek için doğrudan Rus Ordusu’nun Başkomutanlığına müracaat etmesini istedi. Bunun üzerine 8 Ocak 1878 Rus Başkomutanlığından ateşkes istenmiş ve ardından Edirne’de 31 Ocak 1878’de 10 maddelik bir ateşkes antlaşması imzalanmıştır."},
{"id":1180,"d":"diplomasi","u":4,"n":204,"q":"Klasik Dönemde yabancı elçilerl e yapılan resmi görüşmelerin kayıtlarının tutulduğu defterlere ne ad verilirdi?","o":{"a":"Mukaleme mazbatası","b":"Ruusname","c":"Teşrifat Yevmiye Defterleri","d":"Mufassal Defterler","e":"Müteferrik defterler"},"c":"a","ex":"Cevap : A) Mukaleme mazbatası Amedi Kaleminin hariciye ile alakalı bir görevi de yabancı elçilerle yapılan resmi görüşmeleri, elçilikler tarafından görevlendirilen tercümanların Reisülküttap ile yaptıkları görüşmeleri zabta geçirmekti. Mükâleme Mazbatası adı verilen bu zabıtlar daha sonra Amedi Kalemi’nde temize çekilerek Sadrazama, talebi halinde Padişaha sunulurdu. Gerek Osmanlı elçileriyle, gerek diğer elçiler ile olan yazışmalar, gerekse mükâleme mazbataları Amedi Odası’nda bulunan defterlere (ceridelere) kaydedilirlerdi."},

{"id":1313,"d":"iktisat","u":5,"n":94,"q":"Aşağıdakilerden hangisi başdefterdarın yardımcılarından biri değildir?","o":{"a":"Sergi Nazırı","b":"Hazinedarbaşı","c":"Veznedarbaşı","d":"Cizye Başbakikulu","e":"Başbakikulu"},"c":"b","ex":"Cevap : B) Hazinedarbaşı Açıklama : Başdefterdar “Birun” (Dış Saray/Bab-ı Ali) bürokrasisinin başıdır. “Hazinedarbaşı” ise Padişahın şahsi hazinesinden sorumlu olan “Enderun” (İç Saray) görevlisidir ve Başdefterdarın yardımcısı statüsünde değildir."},
{"id":1314,"d":"iktisat","u":5,"n":95,"q":"Dış ticarette söz sahibi ahidnameli devlet tüccarına Osmanlı Devleti’nin verdiği ad aşağıdakilerden hangisidir?","o":{"a":"Avrupa tüccarı","b":"Muaccele","c":"Müstecir","d":"Müstemen","e":"Hayriye"},"c":"d","ex":"Cevap : D) MüstemenAçıklama : Osmanlı topraklarında ticaret yapmasına izin verilen, can ve mal güvenliği ahidnamelerle garanti altına alınmış yabancı ülke vatandaşı tüccarlara “Müstemen” denir."},

{"id":1317,"d":"iktisat","u":5,"n":98,"q":"Mukataaların ömür boyu satılmak yerine hisselere bölünerek sehm denilen hisse senetlerine göre satılması ve satın alanlara kâr payının dağıtılması yöntemine verilen ad aşağıdakilerden hangisidir?","o":{"a":"Esham","b":"İltizam","c":"Malikane","d":"Kaime","e":"Emanet"},"c":"a","ex":"Cevap : A) Esham Açıklama : “Sehm” kelimesinin çoğulu olan “Esham”, iç borçlanma amacıyla mukataa gelirlerinin paylara bölünerek satılması sistemidir (1775)."},

{"id":1320,"d":"iktisat","u":5,"n":101,"q":"Osmanlı Devleti’nde 1857 yılında çıkartılan hangi nizamname ile malların rayice bırakılan kara gümrüklerinin ödenmesinden sonra getirildikleri liman gümrüklerinde rayiç fiyatın yüksek olması durumunda aradaki farkın tüccardan tahsil edilmesi karar altına alınmıştır?","o":{"a":"Ticaret Nizamnamesi","b":"Gümrük Nizamnamesi","c":"Mahreç Nizamnamesi","d":"Kara Gümrüğü Kanunu","e":"Emval Nizamnamesi"},"c":"c","ex":"Cevap : C) Mahreç Nizamnamesi Açıklama : 1857 tarihli “Mahreç Nizamnamesi”, iç gümrük uygulamalarında malın çıkış yerindeki (mahreç) ve varış yerindeki fiyat farklarından doğan vergi kayıplarını düzenlemeyi amaçlamıştır."},
{"id":1321,"d":"iktisat","u":5,"n":102,"q":"Osmanlı başkenti İstanbul’a zeytin, zeytinyağı ve kuru meyveler gemilerle genellikle nereden getirilirdi?","o":{"a":"Karadeniz","b":"Akdeniz","c":"Cezayir","d":"Ege","e":"Kıbrıs"},"c":"d","ex":"Cevap : D) Ege Açıklama : İstanbul’un iaşesinde zeytinyağı, sabun ve kuru meyve (incir, üzüm) ihtiyacı büyük ölçüde Ege Bölgesi (İzmir ve çevresi) ile adalardan sağlanırdı."},

{"id":1323,"d":"iktisat","u":5,"n":104,"q":"Tanzimat sonrası bütün örfi vergiler yerine ve herkesin gelirine göre toplanan verginin adı aşağıdakilerden hangisidir?","o":{"a":"Emlak vergisi","b":"Cihadiye vergisi","c":"Kazanç vergisi","d":"Vergi-yi mahsusa","e":"Şahsi vergi"},"c":"d","ex":"Cevap : D) Vergi-yi mahsusa Açıklama : Tanzimat Fermanı sonrası, halktan toplanan çeşitli örfi vergileri (tekalif-i örfiye) kaldırmak ve bunların yerine herkesin gelirine göre alınan tek bir vergi (Vergi-yi Mahsusa / An-cemaatin) koymak hedeflenmiştir. (Not: Daha sonra bu uygulama Temettü vergisine evrilmiştir, ancak “bütün örfi vergiler yerine” ifadesi genellikle bu ilk birleştirme çabasını tanımlar)."},

{"id":1625,"d":"osm-1789","u":4,"n":201,"q":"Sultan Abdülaziz döneminde, 1863 tarihinde kurulan ilk banka hangisidir?","o":{"a":"Osmanlı Bankası","b":"Selanik Bankası","c":"Ziraat Bankası","d":"Midilli Bankası","e":"Nafia Bankası"},"c":"a","ex":"Cevap : A) Osmanlı BankasıAçıklama : 1856’da kurulan Bank-ı Osmani, 1863 yılında İngiliz ve Fransız sermayesiyle yeniden yapılandırılarak devlet bankası yetkileriyle donatılmış ve “Bank-ı Osmanî-i Şahane” (İmparatorluk Osmanlı Bankası) adını almıştır."},
{"id":1626,"d":"osm-1789","u":4,"n":202,"q":"Sultan II. Abdülhamit’in tahta çıkışı sonrası ilan edilen ilk Osmanlı anayasası hangi adla anılmaktadır?","o":{"a":"Kanun-ı Kadim","b":"Senet-i İttifak","c":"Kanun-ı Esasi","d":"Kanunname-i Hümayun","e":"Teşkilat-ı Esasiye"},"c":"c","ex":"Cevap : C) Kanun-ı EsasiAçıklama : Türk tarihinin ilk anayasası olan ve 23 Aralık 1876’da ilan edilen anayasa, “Temel Kanun” anlamına gelen “Kanun-ı Esasi” adını taşımaktadır."},
{"id":1627,"d":"osm-1789","u":4,"n":203,"q":"Aşağıdakilerden hangisi Sultan Abdülaziz’in tahttan indirildiği 1876 askerî darbesini planlayan “dörtlü cunta” içinde yer alan devlet adamlarından biridir?","o":{"a":"Deli Fuat Paşa","b":"Ahmet Cevdet Paşa","c":"Hüseyin Avni Paşa","d":"Yusuf Kamil Paşa","e":"Gazi Osman Paşa"},"c":"c","ex":"Cevap : C) Hüseyin Avni PaşaAçıklama : Sultan Abdülaziz’in hal’ edilmesini organize eden cunta; Serasker (Genelkurmay Başkanı) Hüseyin Avni Paşa, Sadrazam Mütercim Rüştü Paşa, Mithat Paşa ve Şeyhülislam Hasan Hayrullah Efendi’den oluşuyordu."},
{"id":1628,"d":"osm-1789","u":4,"n":204,"q":"Sultan II. Abdülhamit, Berlin Antlaşması’nın imzalanmasından iki gün sonra Kıbrıs’a dair İngiltere ile yapılan antlaşmayı “hukuk-1 şahaneye asla halel gelmemek şartıyla” tasdik etti (15 Temmuz 1878). Sultan bu kararı ile saltanatı boyunca dış politikada takip edeceği hangi siyasetin ilk örneğini vermiş oldu?","o":{"a":"Maslahatçı siyaset","b":"Denge siyaseti","c":"Saldırgan siyaset","d":"İçe kapanma siyaseti","e":"Maceracı siyaset"},"c":"b","ex":"Cevap : B) Denge siyaseti Açıklama : II. Abdülhamit, Rus tehdidine karşı İngiltere’nin desteğini almak amacıyla Kıbrıs’ın idaresini geçici olarak İngiltere’ye bırakmıştır. Bu, bir büyük devlete karşı başka bir büyük devletin desteğini alarak devleti korumayı amaçlayan “denge siyaseti”nin tipik bir örneğidir."},
{"id":1629,"d":"osm-1789","u":4,"n":205,"q":"Osmanlı’da büyük kaosların yaşandığı 1876 yılı içinde hangi üç padişah sırasıyla tahta çıkmıştır?","o":{"a":"Abdülaziz - V. Murat - II. Abdülhamit","b":"II. Mahmut - Abdülmecit - Abdülaziz","c":"Abdülmecit - Abdülaziz - II. Abdülhamit","d":"Abdülaziz - II. Abdülhamit - Mehmet Reşat","e":"Abdülaziz - II. Abdülhamit - Mehmet Vahidettin"},"c":"a","ex":"Cevap : A) Abdülaziz – V. Murat – II. AbdülhamitAçıklama : 1876 yılında önce Sultan Abdülaziz tahttan indirilmiş, yerine V. Murat geçmiştir. Ancak akli dengesinin bozulması nedeniyle 93 gün sonra o da tahttan indirilmiş ve yerine II. Abdülhamit padişah olmuştur."},
{"id":1630,"d":"osm-1789","u":4,"n":206,"q":"1881 yılında kurulan Yıldız Mahkemesi hangi olayı soruşturmuştur?","o":{"a":"II. Abdülhamit'e suikast","b":"Kuleli Vakası","c":"Çırağan Vakası","d":"V. Murat'ın borçları","e":"Abdülaziz'in ölümü"},"c":"e","ex":"Cevap : E) Abdülaziz’in ölümüAçıklama : Yıldız Sarayı’nda kurulan özel mahkeme, 1876’da resmen intihar ettiği açıklanan Sultan Abdülaziz’in ölümünün aslında bir cinayet olduğu iddiasını soruşturmak ve aralarında Mithat Paşa’nın da bulunduğu dönemin önde gelen devlet adamlarını yargılamak amacıyla kurulmuştur."},
{"id":1631,"d":"osm-1789","u":4,"n":207,"q":"Osmanlı’da ilköğretim eğitimi hangi padişah döneminde zorunlu hâle getirilmiştir?","o":{"a":"IV. Mustafa","b":"II. Mahmut","c":"III. Selim","d":"III. Mustafa","e":"I. Abdülhamit"},"c":"b","ex":"Cevap : B) II. MahmutAçıklama : Modernleşme reformları çerçevesinde Sultan II. Mahmut, 1824 yılında yayınladığı bir fermanla İstanbul’da ilköğretimi (sıbyan mektepleri) zorunlu hale getirerek bu alanda bir ilki gerçekleştirmiştir."},
{"id":1632,"d":"osm-1789","u":4,"n":208,"q":"Sultan II. Abdülhamit’in dış ilişkilerde büyük Avrupa devletleri arasındaki bloklaşmalardan uzak durma politkası hangi gerekçeye dayanıyordu?","o":{"a":"Yeterli diplomatik tecrübeye sahip olmama","b":"Muhafazakâr kişiliği nedeniyle","c":"Yabancı dil bilmeme","d":"Devleti başka bir gücün etkisi altına sokmama","e":"Devleti dış dünyaya kapatma isteği"},"c":"d","ex":"Cevap : D) Devleti başka bir gücün etkisi altına sokmamaAçıklama : Sultan II. Abdülhamit’in temel dış politika prensibi, Osmanlı Devleti’nin zayıf olduğu bir dönemde herhangi bir Avrupa bloğuna dahil olarak o bloğun çıkarları doğrultusunda hareket etmek zorunda kalmasını engellemek ve devletin bağımsız hareket etme kabiliyetini korumaktı."},
{"id":1633,"d":"osm-1789","u":4,"n":209,"q":"Sultan Abdülmecit, Osmanlı ordusunun Mısır birlikleri karşısında hangi ağır yenilgisi gölgesinde tahta çıkmıştır?","o":{"a":"Fokşan","b":"Kütahya","c":"Navarin","d":"Akka","e":"Nizip"},"c":"e","ex":"Cevap : E) NizipAçıklama : Sultan Abdülmecit, babası II. Mahmut’un vefatı üzerine 1839’da tahta çıktığında, Osmanlı ordusu Mısır Valisi Kavalalı Mehmet Ali Paşa’nın ordusuna karşı Nizip’te çok ağır bir yenilgi almış durumdaydı."},
{"id":1634,"d":"osm-1789","u":4,"n":210,"q":"İngiltere, 1815 Viyana Kongresi sürecinde Akdeniz’de hâkim olduğu hangi adaları 1864 yılında Yunanistan’a devretmiştir?","o":{"a":"Saruhan Adaları","b":"Killat Adaları","c":"Yedi Ada","d":"Boğazönü Adaları","e":"Oniki Ada"},"c":"c","ex":"Cevap : C) Yedi AdaAçıklama : İngiltere’nin himayesinde bulunan ve Korfu, Zanta, Kefalonya gibi adalardan oluşan “Yedi Ada Cumhuriyeti” (İyon Adaları), 1864 yılında İngiltere tarafından Yunanistan’a hediye edilmiştir."},
{"id":1635,"d":"osm-1789","u":4,"n":211,"q":"1878 Berlin Antlaşması sonrası Rusya ile 8 Şubat 1879 tarihinde imzalanan ve savaş tazminatı ile esirlere dair olan antlaşma aşağıdakilerden hangisidir?","o":{"a":"Edirne Antlaşması","b":"Hünkar İskelesi Antlaşması","c":"Peterburg Antlaşması","d":"Ayastefanos Antlaşması","e":"İstanbul Antlaşması"},"c":"e","ex":"Cevap : E) İstanbul AntlaşmasıAçıklama : Berlin Kongresi’nde genel hatları çizilen barışın ardından, 1877-78 Osmanlı-Rus Savaşı’nı nihai olarak bitiren, savaş tazminatı gibi teknik konuları düzenleyen antlaşma, 8 Şubat 1879’da İstanbul’da imzalanmıştır."},
{"id":1636,"d":"osm-1789","u":4,"n":212,"q":"Türk Tarih Kurumu tarafından çıkarılmaya başlanıp günümüzde de yayını devam eden uluslararası bilimsel dergi aşağıdakilerden hangisidir?","o":{"a":"OTAM","b":"Tarih İncelemeleri","c":"Resimli Tarih","d":"Belleten","e":"Türk Yurdu"},"c":"d","ex":"Cevap : D) BelletenAçıklama : Atatürk’ün talimatıyla 1937’de yayın hayatına başlayan “Belleten”, Türk Tarih Kurumu’nun en prestijli ve kesintisiz olarak yayınını sürdüren hakemli akademik dergisidir."},
{"id":1637,"d":"osm-1789","u":4,"n":213,"q":"Osmanlı’da “millet-i sadıka” tabiri hangi gayrimüslim vatandaşlar için kullanılmıştır?","o":{"a":"Süryaniler","b":"Ermeniler","c":"Yahudiler","d":"Rumlar","e":"Latinler"},"c":"b","ex":"Cevap : B) ErmenilerAçıklama : Osmanlı Devleti’ne ve toplumsal yaşama uyumları ve sadakatleri nedeniyle Ermeni toplumu için yüzyıllar boyunca “sadık millet” anlamına gelen “millet-i sadıka” tabiri kullanılmıştır."},
{"id":1638,"d":"osm-1789","u":4,"n":214,"q":"I. Ermeni tehciri uygulanacak. II. Vergi verenler mebus olabilecek. III. Ekonomide iltizam usulü kaldırılacak. IV. Herkesin can ve namus güvenliği sağlanacak. V. Gayrimüslimler kadı ve naip olabilecek. Yukarıdakilerden hangisi ya da hangileri 1839 Tanzimat Fermanı içeriğinde yer almamıştır?","o":{"a":"I ve V","b":"Yalnız I","c":"II ve V","d":"I, III ve V","e":"I, IV ve V"},"c":"a","ex":"Cevap : A) I ve V Açıklama : Tanzimat Fermanı; can ve mal güvenliği (IV) ve iltizam usulünün kaldırılması (III) gibi konuları içermiştir. Ancak Ermeni tehciri (I), mebusluk (II) ve gayrimüslimlerin kadı olması (V) gibi konular bu fermanın içeriğinde yer almaz. Şıklara göre en doğru cevap, kesinlikle fermanda yer almayan I ve V’i içeren A şıkkıdır."},
{"id":1639,"d":"osm-1789","u":4,"n":215,"q":"III. Selim dönemi askerî reformları kapsamında 1803’te ahşap olarak inşa edilen Selimiye Kışlası, günümüzde İstanbul’un hangi semtinde bulunmaktadır?","o":{"a":"Zeytinburnu","b":"Üsküdar","c":"Tophane","d":"Rami","e":"Ümraniye"},"c":"b","ex":"Cevap : B) ÜsküdarAçıklama : Nizam-ı Cedit ordusu için inşa edilen ve günümüzdeki 1. Ordu Komutanlığı’na ev sahipliği yapan anıtsal Selimiye Kışlası, İstanbul’un Üsküdar ilçesinde yer almaktadır."},
{"id":1640,"d":"osm-1789","u":4,"n":216,"q":"Aşağıdakilerden hangisi 1856 Islahat Fermanı ile gayrimüslimlere tanman haklardan biridir?","o":{"a":"Ücretsiz tedavi olma","b":"Gümrük vergisinden muaf olma","c":"Vizesiz yurt dışına çıkma","d":"Sınavsız Enderun'a girme","e":"Bedelli askerlik yapma"},"c":"e","ex":"Cevap : E) Bedelli askerlik yapmaAçıklama : Islahat Fermanı ile cizye vergisi kaldırılarak gayrimüslimlere de askerlik yapma yükümlülüğü getirilmiştir. Ancak ferman, aynı zamanda “bedel-i askeri” adı altında bir vergi ödeyerek bu yükümlülükten muaf olma hakkını da tanımıştır."},
{"id":1641,"d":"osm-1789","u":4,"n":217,"q":"Sultan II. Abdülhamit döneminde faal olan hafiyeler hangi amaçla kullanılmışlardır?","o":{"a":"Muhaberat","b":"Muhasebe","c":"Matbuat","d":"İstihbarat","e":"Kavaslık"},"c":"d","ex":"Cevap : D) İstihbaratAçıklama : “Hafiye”, gizli araştırma yapan, bilgi toplayan kişi demektir. II. Abdülhamit dönemindeki “hafiye teşkilatı”, padişaha karşı oluşabilecek her türlü muhalefeti ve komploları önceden haber almak için geniş bir “istihbarat” ağı kurmuştur."},
{"id":1642,"d":"osm-1789","u":4,"n":218,"q":"Osmanlı tarihinin 1774’ten başlayarak Yeniçeri Ocağı’nın kaldırıldığı 1826’ya kadar olan dönem olaylarını akıcı bir üslupla, ilmî ve edebî olarak toplam 12 ciltte aktaran meşhur vakanüvis ve devlet adamı hangisidir?","o":{"a":"Mütercim Asım Efendi","b":"Mustafa Naima Efendi","c":"Ahmet Vasıf Efendi","d":"Ahmet Cevdet Paşa","e":"Yusuf Kamil Paşa"},"c":"d","ex":"Cevap : D) Ahmet Cevdet PaşaAçıklama : 19. yüzyılın en büyük Osmanlı tarihçilerinden ve devlet adamlarından olan Ahmet Cevdet Paşa’nın “Tarih-i Cevdet” adlı eseri, 1774-1826 yılları arasını kapsayan dönemin en önemli ve en kapsamlı kaynağıdır."},
{"id":1643,"d":"osm-1789","u":3,"x":[4],"n":219,"q":"Osmanlı Devleti, 1821 Rum İsyanına katılan Girit Adası’nın yönetimini hangi paşaya vermiştir?","o":{"a":"Keçecizade Fuat Paşa","b":"Hüsrev Mehmet Paşa","c":"Mehmet Emin Ali Paşa","d":"Koca Yusuf Paşa","e":"Kavalalı Mehmet Ali Paşa"},"c":"e","ex":"Cevap: E) Kavalalı Mehmet Ali Paşa Açıklama: Osmanlı Devleti, 1821 Rum İsyanı sırasında Girit Adası’nda denetimi sağlamak amacıyla yönetimi Kavalalı Mehmet Ali Paşa’ya vermiştir. Mehmet Ali Paşa, Mısır valisiydi ve Osmanlı Devleti’ne bağlıydı. Osmanlı’nın Girit’teki isyanı bastırmak için Mısır’dan yardım istemesi üzerine Mehmet Ali Paşa, bu görevi üstlenmiş ve oğlu İbrahim Paşa’yı adaya göndererek isyanı bastırmada önemli bir rol oynamıştır. Bu olay, Mehmet Ali Paşa’nın Osmanlı üzerindeki etkisini daha da artırmıştır."},
{"id":1644,"d":"osm-1789","u":3,"x":[4],"n":220,"q":"Aşağıdakilerden hangisi 1804’te başlayan Sırp İsyanının sebeplerinden biri değildir?","o":{"a":"Demiryolu yatırımı yapılmaması","b":"Milliyetçilik akımı","c":"Yöneticilerin haksız tutumları","d":"Avusturya ile yapılan mücadeleler","e":"Devlet otoritesinin zayıflaması"},"c":"a","ex":"Cevap: A) Demiryolu yatırımı yapılmaması Açıklama: Sırp İsyanı, demiryolu yatırımları gibi sebeplerden değil, Osmanlı yönetimine karşı milliyetçilik akımı ve yönetim hatalarından kaynaklanmıştır."},
{"id":1645,"d":"osm-1789","u":7,"n":221,"q":"Nizamı Cedit reformlarını destekleyen ve Sultan II. Mahmut’un tahta çıkmasında önemli rol oynayan Rusçuk ayanı aşağıdakilerden hangisidir?","o":{"a":"Mustafa Reşit Paşa","b":"Tepedelenli Ali Paşa","c":"Rawalalı Mehmet Ali Paşa","d":"Alemdar Mustafa Paşa","e":"Aga Huseyin Paşa"},"c":"d"},

{"id":1649,"d":"osm-1789","u":7,"n":225,"q":"Sultan Abdülaziz döneminde Osmanlı bütçesi 1875 yılında 5 milyon altin lira açık verdi ve artık iç ve dış borçlanma imkânı kalmadi. Bu durumda Sadrazam Mahmut Nedim Paşa, Rus Elçisi General Ignatyev’in tavsiyesine uyarak bütün Avrupa’nın tepkisini çeken aşağıdaki hangi tedbire başvurdu?","o":{"a":"Varlık vergisi çıkardı","b":"Avrupa malli satışına kısıtlama getirildi","c":"Bundan boyle devler Kağıdı tesham) senetlerinin geçersiz olacağı ilan edildi","d":"Muharrem Kararnamesi çıkarıldı ve borç ödemelerinde kesintiye gidildi","e":"Duyuni Umumiye lağvedildi ve butun borç ödemeleri durduruldu"},"c":"d"},

{"id":1652,"d":"osm-1789","u":7,"n":228,"q":"Aşağıdakilerden hangisi Sultan II. Abdülhamit’in kişisel özelliklerinden biri degildir?","o":{"a":"Jimnastiğe meraklı kılıç kullanma ve tabanca atmada mahirdi","b":"İradesi kuvvetli fikir ve kararlarında ısrarlı","c":"Batı müziğinden opera ve tiyatrodan hoşlanmak","d":"Eğlenceye ve seyahate düşkün olmak","e":"Çalışmayı sevmek ve duzenli bir program uygulamak"},"c":"d"},

{"id":1906,"d":"teskilat","u":4,"n":125,"q":"Medrese sisteminde eğitimini tamamladıktan sonra icazet alarak devletin eğitim, hukuk, merkezî bürokrasi, müftülük ve diğer dinî hizmetlerinde görev yapan Müslümanların oluşturduğu meslek grubuna verilen ad aşağıdakilerden hangisidir?","o":{"a":"İlmiye","b":"Seyfiye","c":"Kalemiye","d":"Ehl-i hiref","e":"Örfiye"},"c":"a","ex":"Cevap : A) İlmiyeAçıklama : Osmanlı toplumunda medrese eğitimi almış alimler sınıfına “İlmiye” denirdi. Bu sınıf, kazaskerler, kadılar, müderrisler ve müftüler gibi adalet, eğitim ve din hizmetlerinden sorumlu görevlileri kapsardı."},

{"id":1909,"d":"teskilat","u":4,"n":128,"q":"Aşağıdakilerden hangisi Osmanlı Devleti’nde Divan-ı Hümayun’a ait özelliklerden biri değildir?","o":{"a":"Orhan Gazi zamanından itibaren Divan-1 Hümayun'un varlığının biliniyor olması","b":"Osmanlıların Selçuklu, İlhanlı ve diğer Türk devletlerindeki divan teşkilatından etkilenmiş olması","c":"Divan-1 Hümayun'a kadıların başkanlık etmesi","d":"Birinci derecede, önemli devlet işlerinin görüşüldüğü yer olması","e":"II. Mehmed'e kadar Divan-1 Hümayun'a padişahların başkanlık yapması"},"c":"c","ex":"Cevap : C) Divan-1 Hümayun’a kadıların başkanlık etmesiAçıklama : Divan-ı Hümayun’a Fatih Sultan Mehmed’e kadar doğrudan padişah, sonrasında ise padişah adına Sadrazam başkanlık etmiştir. Kadılar (veya kazaskerler) divanın asli üyeleri olsalar da divana başkanlık yapmamışlardır."},
{"id":1910,"d":"teskilat","u":4,"n":129,"q":"Padişahların erkek çocuklarının sünnet, kızlarının veya kız kardeşlerinin evlenme düğünlerinde yapılan törenlere verilen ad aşağıdakilerden hangisidir?","o":{"a":"Göç-i Hümayun","b":"Sur-ı Hümayun","c":"Veladet-i Hümayun","d":"Biniş-i Hümayun","e":"Beşik Alayı"},"c":"b","ex":"Cevap : B) Sur-ı HümayunAçıklama : Osmanlı sarayında şehzadelerin sünnet düğünleri ile sultanların (padişah kızları veya kız kardeşleri) evlilik törenleri için düzenlenen ve günlerce süren büyük, şenlikli ve görkemli törenlere “Sur-ı Hümayun” (İmparatorluk Şenliği) adı verilirdi."},
{"id":1911,"d":"teskilat","u":4,"n":130,"q":"Nakibüleşrafların seyyid ve şerifleri tespit ederek onlara tanınan ayrıcalıklardan istifade etmeleri için düzenledikleri belgeye verilen ad aşağıdakilerden hangisidir?","o":{"a":"Tahrirat","b":"Kaime","c":"Kassam berati","d":"Siyadet hücceti","e":"Muafiyet fermanı"},"c":"d","ex":"Cevap : D) Siyadet hüccetiAçıklama : Nakibüleşraf, Hz. Peygamber’in soyundan gelen seyyid ve şeriflerin kayıtlarını tutar ve onların bu soydan geldiğini teyit eden, kendilerine vergi muafiyeti gibi ayrıcalıklar sağlayan “siyadet hücceti” adı verilen resmi bir belge düzenlerdi."},
{"id":1912,"d":"teskilat","u":4,"n":131,"q":"Siyakat yazısı Osmanlı Devleti’nde hangi tür evraklarda kullanılmıştır?","o":{"a":"Telhis-Takrir","b":"Tapu-Maliye","c":"İrade-Hatt-1 Hümayun","d":"Divan-1 Hümayun","e":"Kaime-Şukka"},"c":"b","ex":"Cevap : B) Tapu-MaliyeAçıklama : Siyakat, okunması zor, şifreli bir yazı türü olup sahtekarlığı önlemek amacıyla özellikle mali kayıtların, tahrir defterlerinin ve tapu kayıtlarının tutulduğu defterlerde kullanılmıştır."},
{"id":1913,"d":"teskilat","u":4,"n":132,"q":"Aşağıdakilerden hangisi Osmanlı hareminde padişahın en yakın hizmetini gören kadın görevlilerden biri değildir?","o":{"a":"Çamaşırcı Usta","b":"Hazinedar Usta","c":"Hastalar Ustası","d":"Kilerci Usta","e":"Çaşnigir Usta"},"c":"c","ex":"Cevap : C) Hastalar Ustası Açıklama :"},
{"id":1914,"d":"teskilat","u":4,"n":133,"q":"Kılıç kuşanma merasiminin yapılması için hayırlı gün ve saati tespit eden görevliye verilen ad aşağıdakilerden hangisidir?","o":{"a":"Müneccimbaşı","b":"Müsahib","c":"Nakibüleşraf","d":"Muvakkit","e":"Darüssaade Ağası"},"c":"a","ex":"Cevap : A) MüneccimbaşıAçıklama : Müneccimbaşı, sarayın baş müneccimi (astrolog) olup, padişahın tahta çıkışı, kılıç alayı, sefere çıkış gibi önemli devlet olayları için gök cisimlerinin konumuna bakarak en uygun ve hayırlı zamanı (eşref saati) belirlemekle görevliydi."},
{"id":1915,"d":"teskilat","u":4,"n":134,"q":"Resmî olarak ilk surre gönderimi hangi padişah döneminde başlamıştır?","o":{"a":"II. Murad","b":"Yavuz Sultan Selim","c":"Kanuni Sultan Süleyman","d":"Fatih Sultan Mehmed","e":"II. Mustafa"},"c":"b","ex":"Cevap : B) Yavuz Sultan SelimAçıklama : Mısır’ın fethi ve kutsal toprakların Osmanlı yönetimine girmesiyle birlikte, Yavuz Sultan Selim “Hâdimü’l-Haremeyni’ş-Şerîfeyn” (İki Kutsal Beldenin Hizmetkârı) unvanını almış ve Mekke ile Medine’ye her yıl hediye ve para gönderilen Surre Alayı’nı bir devlet geleneği olarak kurumsallaştırmıştır."},
{"id":1916,"d":"teskilat","u":4,"n":135,"q":"Aşağıdakilerden hangisi Osmanlı Devleti’nde yazma eserler dışında tezhip kullanılan yerlerden biri değildir?","o":{"a":"Minyatürler","b":"Ok ve yaylar","c":"Tılsımlı gömlekler","d":"Kubur ve kutular","e":"Gravürler"},"c":"e","ex":"Cevap : E) GravürlerAçıklama : Tezhip, altın yaldız ve boya ile yapılan bir süsleme sanatıdır ve genellikle el yazması kitaplar, minyatürler, ahşap ve deri eşyalar gibi yüzeylere uygulanırdı. Gravür ise Batı kökenli bir baskı tekniğidir ve üzerine tezhip yapılmaz."},
{"id":1917,"d":"teskilat","u":4,"n":136,"q":"Başlangıçta seferlerde orduyu komuta eden Osmanlı padişahları daha sonraları vekil olarak hangi devlet görevlisini “serdar-1 ekrem” sıfatıyla görevlendirmişlerdir?","o":{"a":"Sadrazam","b":"Beylerbeyi","c":"Çavuşbaşı","d":"Vezir","e":"Kazasker"},"c":"a","ex":"Cevap : A) SadrazamAçıklama : Padişahın sefere bizzat katılmadığı durumlarda, ordunun başkomutanı olarak onun mutlak vekil tayin ettiği en üst düzey devlet adamı olan Sadrazam, “Serdar-ı Ekrem” unvanıyla orduyu komuta ederdi."},
{"id":1918,"d":"teskilat","u":4,"n":137,"q":"Osmanlı Devleti’nde Surre-i Hümayun töreninin düzenleyicisi hangi görevlidir?","o":{"a":"Hasodabaşı","b":"Mabeyn Başkatibi","c":"Sadrazam","d":"Darüssaade Ağası","e":"Babüssaade Ağası"},"c":"d","ex":"Cevap : D) Darüssaade AğasıAçıklama : Haremeyn (Mekke ve Medine) vakıflarının idaresinden sorumlu olan Darüssaade Ağası, her yıl bu kutsal topraklara gönderilen hediye ve para konvoyu olan Surre-i Hümayun’un hazırlanması ve yola çıkarılması törenlerini düzenlerdi."},
{"id":1919,"d":"teskilat","u":4,"n":138,"q":"Osmanlı Devleti’nde XVIII. yüzyıldan itibaren sık sık uygulanmaya başlayan padişah ve hareminin farklı saraylarda yaz aylarını geçirmelerine verilen ad aşağıdakilerden hangisidir?","o":{"a":"Cuma selamlığı","b":"Huzur mürafaası","c":"Biniş-i Hümayun","d":"Göç-i Hümayun","e":"Ceyb-i Hümayun"},"c":"d","ex":"Cevap : D) Göç-i HümayunAçıklama : Padişahın ve saray halkının, özellikle yaz aylarında Topkapı Sarayı’ndan Boğaz’daki veya başka yerlerdeki sahil saraylarına ve kasırlara mevsimlik olarak taşınmasına “Göç-i Hümayun” (İmparatorluk Göçü) denirdi."},
{"id":1920,"d":"teskilat","u":4,"n":139,"q":"XVI. asrın ikinci yarısından itibaren ortaya çıkan, minyatürde sade zemin ve anlatımla gerçekçiliğin yansıtıldığı klasik üslubun en önemli ustası kimdir?","o":{"a":"Şiblizade Ahmet","b":"Sinan Bey","c":"Abdullah Nakkaş","d":"Matrakçı Nasuh","e":"Nakkaş Osman"},"c":"e","ex":"Cevap : E) Nakkaş OsmanAçıklama : Nakkaş Osman ve atölyesi, 16. yüzyılın ikinci yarısında Osmanlı minyatür sanatında klasik üslubu zirveye taşıyan, özellikle “Surnâme-i Hümâyun” gibi eserlerle tanınan en önemli sanatçıdır."},
{"id":1921,"d":"teskilat","u":4,"n":140,"q":"Kara Harp Okulu’nun başlangıcı olarak kabul edilen Mühendishane-i Berri-i Hümayun kalıcı olarak hangi tarihte faaliyete geçmiştir?","o":{"a":"1795","b":"1789","c":"1775","d":"1768","e":"1810"},"c":"a","ex":"Cevap : A) 1795Açıklama : Sultan III. Selim’in Nizam-ı Cedid reformları çerçevesinde, modern topçu ve istihkam subayları yetiştirmek amacıyla kurulan Mühendishâne-i Berrî-i Hümâyun (İmparatorluk Kara Mühendishanesi), 1795 yılında kalıcı olarak faaliyete geçmiştir."},
{"id":1922,"d":"teskilat","u":5,"n":141,"q":"Osmanlı hareminde çalışan ve yaşayanların maaşları hangi hazineden ödenirdi?","o":{"a":"Ceyb-i Hümayun","b":"Çilhane","c":"Raht","d":"Hazine-i Amire","e":"Mansure"},"c":"a","ex":"Cevap: A) Ceyb-i Hümayun Açıklama: Padişahın saraydaki ailesini barındıran harem teşkilatındaki kadınların, cariyelerin, kalfaların ve diğer özel hizmetlilerin maaş ve masrafları, devletin genel hazinesi olan Hazine-i Amire’den değil, bizzat padişahın şahsi iç hazinesi olan “Ceyb-i Hümayun”dan (Cep Hazinesi) karşılanırdı."},
{"id":1923,"d":"teskilat","u":5,"n":142,"q":"Osmanlı Devletinde taşra teşkilatının ve ordusunun temelini oluşturan, dirlik sahibinin tahsil ettiği vergi geliri karşılığında devlete asker yetiştirmesi ve bölgenin güvenliğini sağlaması üzerine kurulan sistem aşağıdakilerden hangisidir?","o":{"a":"İltizam sistemi","b":"Malikane sistemi","c":"Tımar sistemi","d":"Devşirme sistemi","e":"Vakıf sistemi"},"c":"c","ex":"Cevap: C) Tımar sistemi Açıklama: Tımar sistemi, devletin araziden alacağı vergileri doğrudan memuru ve askeri konumundaki sipahilere tahsis ettiği, karşılığında onlardan bölgenin güvenliğini sağlamasını ve devlete cebinden masrafsız “Cebelü” adlı zırhlı askerler yetiştirmesini beklediği klasik Osmanlı sosyo-ekonomik sistemidir."},
{"id":1924,"d":"teskilat","u":5,"n":143,"q":"Osmanlı Devleti’nde “hanedanın en yaşlı ve aklı başında üyesinin tahta çıkması” usulü hangi tarihten itibaren uygulanmaya başlanmıştır?","o":{"a":"1453","b":"1586","c":"1717","d":"1617","e":"1685"},"c":"d","ex":"Cevap: D) 1617 Açıklama: Padişah I. Ahmet’in 1617 yılında genç yaşta vefat etmesi üzerine kardeş katlini önlemek amacıyla veraset sisteminde köklü bir değişikliğe gidilmiş, hanedanın en yaşlı ve olgun üyesinin tahta geçmesini öngören “Ekber ve Erşed” sistemi fiilen uygulanarak kardeşi I. Mustafa tahta çıkarılmıştır."},
{"id":1925,"d":"teskilat","u":5,"n":144,"q":"Osmanlı ordusunun en kalabalık ve vurucu yaya gücünü oluşturan, savaş zamanı padişahın etrafında merkezde konumlanan ve devletten üç ayda bir düzenli nakit maaş (ulufe) alan kapıkulu askerlerine ne ad verilir?","o":{"a":"Akıncılar","b":"Azaplar","c":"Leventler","d":"Tımarlı Sipahiler","e":"Yeniçeriler"},"c":"e","ex":"Cevap: E) Yeniçeriler Açıklama: Devşirme sistemiyle ocağa alınıp yetiştirilen Yeniçeriler, Kapıkulu Ocaklarının piyade (yaya) kısmını oluşturur. Başkentte padişahı koruyan, savaşta merkezde yer alan ve her üç ayda bir “Ulufe” adıyla devlet hazinesinden doğrudan nakit maaş alan vurucu birliklerdir."},
{"id":1926,"d":"teskilat","u":5,"n":145,"q":"Topkapı Sarayı’nda padişahın günlük yaşamını geçirdiği, en güvenilir içoğlanlarının hizmet ettiği ve Hz. Muhammed’e ait Kutsal Emanetler’in muhafaza edildiği Hırka-i Saadet dairesini de içinde barındıran saray bölümü hangisidir?","o":{"a":"Hasoda","b":"Arz Odası","c":"Babüssaade","d":"Birun","e":"Darphane"},"c":"a","ex":"Cevap: A) Hasoda Açıklama: Enderun teşkilatının en üst ve prestijli dairesi olan Hasoda, bizzat padişahın mahrem alanlarından biridir. Hasodabaşı’nın yönettiği bu mekân, padişahın hizmetinin görüldüğü ve Yavuz Sultan Selim’den itibaren Kutsal Emanetler’in saygıyla korunduğu dairedir."},
{"id":1927,"d":"teskilat","u":5,"n":146,"q":"Divan toplantılarının yapılmasının ardından alınan kararların padişaha sunulduğu mekâna verilen isim aşağıdakilerden hangisidir?","o":{"a":"Hırka-i Saadet Dairesi","b":"Babüssaade","c":"Arz Odası","d":"Hasoda","e":"Bağdat Köşkü"},"c":"c","ex":"Cevap: C) Arz OdasıAçıklama: Divan-ı Hümayun toplantıları sonrasında sadrazam ve vezirlerin padişahın huzuruna çıkarak devlet meselelerini ve alınan kararları (arzları) sundukları resmi mekân Topkapı Sarayı’ndaki Arz Odası’dır."},
{"id":1928,"d":"teskilat","u":5,"n":147,"q":"Osmanlı Devleti’nde protokol gereği yapılan bütün merasimlerin ve harcamalarının kayıt edildiği defterlere verilen ad aşağıdakilerden hangisidir?","o":{"a":"Temettuat","b":"Kanunname","c":"Ahkam","d":"Mühimme","e":"Teşrifat"},"c":"e","ex":"Cevap: E) Teşrifat Açıklama: Padişahın cülusu, bayramlaşma törenleri, yabancı elçilerin kabulü, kılıç kuşanma gibi devletin ve sarayın protokol kurallarının titizlikle işlendiği ve bu törenler sırasında yapılan ihsan ve harcamaların kaydedildiği resmi belgelere “Teşrifat Defterleri” denilirdi."},
{"id":1929,"d":"teskilat","u":5,"n":148,"q":"Osmanlı Devleti’nde Şeyhülislâmlığın merkezdeki teşkilatına verilen ad aşağıdakilerden hangisidir?","o":{"a":"Bab- Meşihat","b":"Bab-1 Ali","c":"Mevali","d":"Bab-1 Seraskeri","e":"Babüssaade"},"c":"a","ex":"Cevap: A) Bab- Meşihat Açıklama: Dini konuların, fetva işlemlerinin ve ilmiye sınıfı idaresinin başı olan Şeyhülislamlık makamının ve bu makama bağlı çalışan bürokratik teşkilatın bulunduğu resmi devlet dairesine “Bab-ı Meşihat” (Meşihat Kapısı) adı verilmiştir."},
{"id":1930,"d":"teskilat","u":5,"n":149,"q":"Aşağıdakilerden hangisi Osmanlı Devleti’nde kapıkulu askeri yetiştirmek üzere uygulanan Devşirme Kanununu açıklayan ifadedir?","o":{"a":"Osmanlı tebaası Müslüman halktan toplanan neferlerdir,","b":"Osmanlı tebaası Hristiyan çocuklarından toplanırdı.","c":"Bütün Osmanlı tebaasından asker toplama usulüydü.","d":"Yabancı tebaadan temin edilirdi","e":"Savaş esirleri arasından beşte bir oranında toplanırlardı."},"c":"b","ex":"Cevap: B) Osmanlı tebaası Hristiyan çocuklarından toplanırdı. Açıklama: Devşirme sistemi, sadece Osmanlı sınırları içerisinde yaşayan Hristiyan tebaanın zeki, sağlıklı ve yetenekli çocuklarının devlet kurallarına (kanuna) uygun olarak toplanıp Türk-İslam terbiyesiyle sadık birer kapıkulu askeri veya devlet adamı olarak yetiştirilmesidir."},
{"id":1931,"d":"teskilat","u":5,"n":150,"q":"Aşağıdakilerden hangisi tezhip sanatının kullanıldığı alanlardan biri değildir?","o":{"a":"Minyatür","b":"Ferman","c":"Tılsımlı gömlek","d":"Yazma eser","e":"Gravür"},"c":"e","ex":"Cevap: E) Gravür Açıklama: Tezhip sanatı, ezilmiş altın kullanılarak yapılan geleneksel bir İslam süsleme sanatıdır. El yazması eserlerde, Kuran-ı Kerimlerde, padişah fermanlarında ve tılsımlı gömleklerde sıkça kullanılmışken; “Gravür” Batı menşeli, metal veya taş levhalara kazıma yoluyla yapılan bir baskı sanatıdır ve geleneksel tezhip kullanım alanına girmez."},
{"id":1932,"d":"teskilat","u":5,"n":151,"q":"Padişahın mutlak vekili olarak devlet işlerini idare eden Veziriazamın makamına, resmî çalışma dairesine ve hükümetin merkezine 18. yüzyıldan itibaren verilen isim aşağıdakilerden hangisidir?","o":{"a":"Bab-ı Seraskeri","b":"Bab-ı Meşihat","c":"Bab-ı Hümayun","d":"Babıali (Bâb-ı Âli)","e":"Enderun"},"c":"d","ex":"Cevap: D) Babıali (Bâb-ı Âli) Açıklama: Önceleri “Paşa Kapısı” olarak adlandırılan sadrazam konağı, 18. yüzyılın ikinci yarısından itibaren devlet işlerinin Topkapı Sarayı’ndan (Divan-ı Hümayun) sadrazamın sarayına kaymasıyla “Yüce Kapı” anlamına gelen Bâb-ı Âli adını almış ve Osmanlı Hükümetinin merkezi olmuştur."},
{"id":1933,"d":"teskilat","u":5,"n":152,"q":"Tımarı sipahilerin her türlü masrafı kendilerine ait olmak üzere yetiştirmek zorunda oldukları askerlere verilen ad aşağıdakilerden hangisidir?","o":{"a":"Garib","b":"Müsellem","c":"Azeb","d":"Eşkinci","e":"Cebelü"},"c":"e","ex":"Cevap: E) Cebelü Açıklama: Tımarlı sipahiler, dirlik gelirlerinin belirli bir kısmını (kılıç tımarı) kendilerine ayırdıktan sonra, artan her 3000 akçelik dilim için devlete atlı, zırhlı ve savaşa her an hazır bir asker yetiştirmek zorundaydı. Bütün donanım ve masrafları sipahiye ait olan bu yardımcı askerlere “Cebelü” denirdi."},
{"id":1934,"d":"teskilat","u":5,"n":153,"q":"Divan-ı Hümayun’da padişah ve devlet adına alınan en üst düzey siyasi, askeri, hukuki kararların ve taşraya gönderilecek ferman emirlerinin Nişancı kontrolünde titizlikle yazıya döküldüğü ve devletin en gizli resmi kayıtlarının tutulduğu ana defterlere ne ad verilir?","o":{"a":"Mühimme Defterleri","b":"Şer'iyye Sicilleri","c":"Tahrir Defterleri","d":"Ruznamçe","e":"Tereke Defterleri"},"c":"a","ex":"Cevap: A) Mühimme Defterleri Açıklama: “Mühim” (önemli) meseleler anlamına gelen Mühimme Defterleri; Divan-ı Hümayun’da karara bağlanan ve uygulanan her türlü emrin, beratın ve devletin dış/iç politikalarını ilgilendiren kararların tarih sırasıyla günü gününe kaydedildiği, Osmanlı bürokrasisinin en kritik arşiv kayıtlarıdır."},
{"id":1935,"d":"teskilat","u":7,"n":154,"q":"Gureba bölüklerinin başlica görevi aşağıdakilerden hangisidir?","o":{"a":"Savaşta sancak-ı şerifi ve padişah sancaklarını muhafaza etmek","b":"Seferde cephanenin muhafazasından sorumlu olmak","c":"Mehterhane-i Amire'nin bütün malzemesini korumak","d":"Padişahı bizzat koruyan atlı birlik sınıfını oluşturmak","e":"Hazine'nin korunmasını sağlamak"},"c":"a","ex":"Cevap : A) Savaşta sancak-ı şerifi ve padişah sancaklarını muhafaza etmek"},
{"id":1936,"d":"teskilat","u":7,"n":155,"q":"Aşağıdakilerden hangisi Eşkinci Ocağı için doğru bir ifade değildir?","o":{"a":"Neferleri Yeniçeri Ocağı bölüklerinden seçiliyordu","b":"Silah olarak tüfek ve kilıç kullanırlardı.","c":"Ulufeleri ve bazi Ocak giderleri Ağakapisi'nda oluşturulan sandiktan verilirdi.","d":"Başlıca görevi, yeni savaş taktik ve tekniklerini öğrenmekti.","e":"Sultan III. Selim zamanında kurulmuştur."},"c":"e","ex":"Cevap : E) Sultan III. Selim zamanında kurulmuştur."},
{"id":1937,"d":"teskilat","u":7,"n":156,"q":"II. Murad’ın Molla Fenarînin evladına verdiği daha sonra bütün ulemâ çocuklarına tanınan bir ayrıcalık olan uygulama aşağıdakilerden hangisidir?","o":{"a":"Gedik","b":"Ulema teșviki","c":"Mülazemet","d":"Mevalizade Kanunu","e":"Veled-i kiram"},"c":"d","ex":"Cevap : D) Mevalizade Kanunu"},
{"id":1938,"d":"teskilat","u":7,"n":157,"q":"Aşağıdakilerden hangisi sancağın temel idari birim olarak esas alınmasının gerekçelerinden değildir?","o":{"a":"Sipahinin genellike tımarınin bulundugu sancakta oturma mükellefiyetinin bulurması","b":"Kanunnamelerin sancağı esas alması","c":"Sancak taksimatında hiç değişiklik görülmemesi","d":"Tahrir defterlerinin sancak esas alinarak duzenlemesi","e":"Relaya suç işlediginde kendi sancağında yargılanması ve cezalandırılması"},"c":"c","ex":"Cevap : C) Sancak taksimatında hiç değişiklik görülmemesi"},
{"id":1939,"d":"teskilat","u":7,"n":158,"q":"Osmanlı Devleti’nde veziriazamların seferde bulundukları zaman, merkezdeki işlerin yürütülmesini sağlamak üzere yerlerine bıraktıkları vekil aşağıdakilerden hangisidir?","o":{"a":"Kapı Kethüdasi","b":"Seyhülislam","c":"Sadaret Kaymakamı","d":"Kazasker","e":"Kaptan-ı Derya"},"c":"c","ex":"Cevap : C) Sadaret Kaymakamı"},
{"id":1940,"d":"teskilat","u":7,"n":159,"q":"Osmanlı Devletinde, yeniçerilere silah sağlamak, bunları muhafaza etmek, sefer sırasında silahları nakletmek yeniçerilere dağıtmak ve onarmak aşağıdaki hangi askeri sınıfın görevidir?","o":{"a":"Kapıkulu süvarisi","b":"Humbaracı","c":"Cebeci","d":"Lagımcı","e":"Topçu"},"c":"c","ex":"Cevap : C) Cebeci"},
{"id":1941,"d":"teskilat","u":7,"n":160,"q":"Kazaskerlerin ilmiye sınifi mensuplarının hizmet içi eğitimleri, tayin, azil, terfi, görev yerleri ve değişikliği gibi hususlarını günü gününe tuttukları defterlere verilen ad aşağıdakilerden hangisidir?","o":{"a":"Siyasetnâme","b":"Selimnâme","c":"Ruzname","d":"Seyahatnâme","e":"Sikayetnâme"},"c":"c","ex":"Cevap : C) Ruzname"},

{"id":2103,"d":"somurgecilik","u":4,"x":[7],"n":66,"q":"1860'da Zengibar'dan James Augustus Grant ile yola çıkan John Hanning Speke, yaşadıklarını anlattığı Nil'in Kaynağının Keşfi (The Discovery of the Source of the Nile, London 1863) adlı eserinde Orta Afrika'daki birçok kabile mensubunun yabancıları gördüğünde kaçtığından veya silaha sarıldığından bahsediyor. Yabancılara karşı bu büyük güvensizliğin sebebi ise dışarıdan gelen herkesin potansiyel köle avcısı olarak görülmesidir. Yukarıda bahsedilen yerlilerin güven problemini aşmak ve onlara barışçıl emellerini göstermek üzere, bölgeye seyahat edenler çoğunlukla hangi yönteme başvurmuşlardır?","o":{"a":"Seyahatlerini nehirler üzerinden gerçekleştirmişlerdir.","b":"Seyahat boyunca çok az mola vermişlerdir.","c":"Seyahatlerinde yerli rehberler kullanmışlardır.","d":"Seyahatleri sırasında yerlilere hediyeler dağıtmışlardır.","e":"Seyahatlerini büyük askerî birlikler eşliğinde yapmışlardır."},"c":"d"},
