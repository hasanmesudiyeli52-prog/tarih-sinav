<style>

  .course::after{content:"▾";position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:14px;pointer-events:none;}

  .tabs button{flex:1;border:0;background:transparent;font-family:inherit;font-weight:700;font-size:13px;color:var(--muted);padding:9px 4px;border-radius:10px;cursor:pointer;transition:.2s;}
  .tabs button.on{background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 4px 12px -6px rgba(27,36,64,.6);}
  .units{display:flex;gap:5px;overflow-x:auto;padding:2px 0 4px;-ms-overflow-style:none;scrollbar-width:none;}
  .units::-webkit-scrollbar{display:none;}
  .units button{flex:none;border:1px solid var(--line);background:var(--card);font-family:inherit;font-weight:700;font-size:12px;color:var(--ink-soft);padding:7px 13px;border-radius:99px;cursor:pointer;transition:.2s;white-space:nowrap;}
  .units button.on{background:var(--gold);color:#fff;border-color:var(--gold);}
  .screen{animation:fade .35s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .pbar-wrap{margin:12px 0 4px;display:flex;align-items:center;gap:10px;}
  .pbar{flex:1;height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden;border:1px solid var(--line);}
  .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#caa24b);transition:width .35s cubic-bezier(.2,.8,.2,1);}
  .pcount{font-size:12px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .qmeta{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px;gap:8px;}
  .qnum{font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--gold);font-weight:600;}
  .utag{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);padding:3px 9px;border-radius:99px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:19px 17px;box-shadow:var(--shadow);}
  .qtext{font-family:'Fraunces',serif;font-weight:500;font-size:18.5px;line-height:1.34;letter-spacing:-.01em;margin:0 0 15px;}
  .opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;font-family:inherit;font-size:14px;line-height:1.3;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .2s,background .2s;}
  .opt:active{transform:scale(.985);}
  .opt .lab{flex:none;width:24px;height:24px;border-radius:8px;background:var(--paper-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--ink-soft);text-transform:uppercase;transition:.2s;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.correct .lab{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.wrong .lab{background:var(--red);color:#fff;border-color:var(--red);}
  .opt.dim{opacity:.5;}
  .opt[disabled]{cursor:default;}
  .explain{margin-top:4px;border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.5;animation:fade .3s both;}
  .explain.ok{background:var(--green-bg);border:1px solid var(--ok-line);}
  .explain.no{background:var(--red-bg);border:1px solid var(--no-line);}
  .explain b{font-weight:800;}
  .explain .head{display:flex;align-items:center;gap:7px;font-weight:800;margin-bottom:3px;font-size:12.5px;}
  .explain.ok .head{color:var(--green);}.explain.no .head{color:var(--red);}
  .nav{display:flex;gap:10px;margin-top:15px;}
  .nav.sticky{position:sticky;bottom:0;z-index:5;margin:15px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 72%,transparent);}
  .btn{flex:1;border:0;font-family:inherit;font-weight:800;font-size:15px;padding:14px;border-radius:13px;cursor:pointer;transition:transform .12s,opacity .2s;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--btn-bg);color:var(--btn-fg);box-shadow:var(--shadow);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);flex:none;width:52px;}
  .btn:disabled{opacity:.35;cursor:default;}
  .result{text-align:center;padding:26px 20px;}
  .ring{width:148px;height:148px;margin:4px auto 16px;position:relative;}
  .ring svg{transform:rotate(-90deg);}
  .ring .score{position:absolute;inset:0;display:grid;place-content:center;}
  .ring .score b{font-family:'Fraunces',serif;font-size:40px;font-weight:600;line-height:1;}
  .ring .score span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
  .verdict{font-family:'Fraunces',serif;font-style:italic;font-size:21px;margin:4px 0 6px;}
  .rdetail{color:var(--muted);font-size:14px;font-weight:500;margin-bottom:20px;}
  .rstats{display:flex;gap:9px;margin-bottom:20px;}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 6px;}
  .stat b{display:block;font-family:'Fraunces',serif;font-size:25px;line-height:1;}
  .stat span{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .stat.g b{color:var(--green);}.stat.r b{color:var(--red);}
  .study-item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:10px;}
  .study-item .qn{font-family:'Fraunces',serif;font-style:italic;color:var(--gold);font-size:12.5px;font-weight:600;margin-bottom:5px;}
  .study-item .q{font-family:'Fraunces',serif;font-weight:500;font-size:15.5px;line-height:1.32;margin-bottom:10px;}

  .study-item .a .lab{flex:none;width:21px;height:21px;border-radius:6px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px;text-transform:uppercase;}
  .study-item .ex{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-top:8px;padding-left:2px;}
  .clearw{display:block;margin:4px auto 14px;border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);font-family:inherit;font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:99px;cursor:pointer;}
  .gate{position:fixed;inset:0;z-index:50;background:var(--paper);display:grid;place-items:center;padding:24px 16px;}
  .gate[hidden]{display:none;}
  .gate form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow);text-align:center;}
  .gate h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;margin:6px 0 4px;}
  .gate h2 em{color:var(--gold);}
  .gate p{color:var(--muted);font-size:13px;margin:0 0 16px;}
  .gate input{width:100%;font-family:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);margin-bottom:10px;text-align:center;}
  .gate input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .gate .err{color:var(--red);font-size:12.5px;font-weight:700;min-height:18px;margin-bottom:6px;}
  .gate button{width:100%;}
  .empty{text-align:center;color:var(--muted);padding:46px 20px;}
  .empty .big{font-family:'Fraunces',serif;font-size:38px;color:var(--gold-soft);}

{"id":342,"d":"hacli","u":4,"n":101,"q":"Bernard de Clairvaux’nun vaazlarında Haçlı Seferi’ni ekonomik bir fırsat olarak tanımlarken kullandığı söylem aşağıdakilerden hangisidir?","o":{"a":"\"Tanrı sizleri zengin edecektir.\"","b":"\"Bu yol cennete açılan kapıdır.\"","c":"\"Günahların affı en büyük zenginliktir.\"","d":"\"Kudüs'ü almak dünyadaki en büyük fırsattır.\"","e":"\"Akıllı bir tüccarsanız bu fırsatı kaçırmayın.\""},"c":"e","ex":"Cevap : E) “Akıllı bir tüccarsanız bu fırsatı kaçırmayın.” Açıklama : İkinci Haçlı Seferi’nin (1147) baş vaizi olan **Bernard de Clairvaux**, Haçlı Seferi’ne katılanlara hem ruhani (günah affı) hem de dünyevi (ekonomik kazanç) faydalar vadederken, bu eylemi bir **ticari fırsat** olarak nitelendirmiştir."},
{"id":343,"d":"hacli","u":4,"n":102,"q":"I. Bizans Devleti’nin Venedik’i tehdit etmesi II. Haçlı Seferi’ne beklenenden az sayıda kişinin katılması III. Haçlıların Venedik’e nakliye parasını ödeyememesi Yukarıdakilerden hangisi ya da hangileri IV. Haçlı Seferi’nin Venedik’in kontrolüne geçmesinde etkili olmuştur?","o":{"a":"I ve III","b":"II ve III","c":"Yalnız II","d":"I ve II","e":"Yalnız I"},"c":"b","ex":"Cevap : B) II ve III Açıklama : Dördüncü Haçlı Seferi’ne **beklenenden az sayıda kişinin katılması** (II) ve bu nedenle **Venedik’e nakliye ücretini ödeyememeleri** (III), Venedik’in Haçlıları Zara’ya (IV. seferin ilk hedefi) ve ardından İstanbul’a yönlendirmesine ve seferi kontrol etmesine neden olan temel ekonomik ve lojistik faktörlerdir. Bizans’ın Venedik’i tehdit etmesi (I) ise Venedik’in Bizans’a karşı zaten düşmanca bir tavır takınmasına katkıda bulunmuştur, ancak seferin Venedik kontrolüne geçmesinde II ve III doğrudan etkili olmuştur."},
{"id":344,"d":"hacli","u":4,"n":103,"q":"Aforoz edilmiş bir lider olarak VI. Haçlı Seferi’ne kumanda eden hükümdar kimdir?","o":{"a":"Kral VII. Louis","b":"Kral Konrad","c":"İmparator II. Friedrich","d":"Dük Leopold","e":"Kral IX. Louis"},"c":"c","ex":"Cevap : C) İmparator II. Friedrich Açıklama : Kutsal Roma İmparatoru **II. Friedrich** (Hohenstaufen), Papa IX. Gregorius tarafından defalarca **aforoz edilmesine** rağmen 1228 yılında Altıncı Haçlı Seferi’ne liderlik etmiş ve diplomatik yollarla Kudüs’ü ele geçirmiştir."},
{"id":345,"d":"hacli","u":4,"n":104,"q":"I. Kudüs’ün Latin hâkimiyetine geçmesi II. Kral IX. Louis’nin Tunus’ta ölmesi III. Kral IX. Louis’nin esir düşmesi Yukarıdakilerden hangisi ya da hangileri VII. Haçlı Seferi’yle ilgili değildir?","o":{"a":"Yalnız I","b":"II ve III","c":"Yalnız II","d":"I ve II","e":"I ve III"},"c":"d","ex":"Cevap : D) I ve II Açıklama : VII. Haçlı Seferi (1248–1254) Fransa Kralı IX. Louis tarafından Mısır’a düzenlenmiştir. I. Kudüs’ün Latin hâkimiyetine geçmesi → I. Haçlı Seferi ile ilgilidir, VII. seferle ilgili değildir. II. Kral IX. Louis’nin Tunus’ta ölmesi → VIII. Haçlı Seferi sırasında olmuştur, VII. seferle ilgili değildir. III. Kral IX. Louis’nin esir düşmesi → VII. Haçlı Seferi’nde yaşanmıştır. Dolayısıyla VII. Haçlı Seferi ile ilgili olmayanlar I ve II’dir. Doğru cevap: D) I ve II"},
{"id":346,"d":"hacli","u":4,"n":105,"q":"I. Macar şehri Zara’nın Latinler tarafından işgali II. İstanbul’da Latin hâkimiyeti kurulması III. Seferin Venedik tarafından Mısır’a yönlendirilmesi Yukarıdaki bilgilerden hangisi ya da hangileri Dördüncü Haçlı Seferi’yle ilgilidir?","o":{"a":"Yalnız I","b":"I ve II","c":"II ve III","d":"Yalnız III","e":"Yalnız II"},"c":"b","ex":"Cevap : B) I ve II Açıklama : Dördüncü Haçlı Seferi (1202-1204), başlangıçta Mısır’a yönlendirilmek istense de (III yanlış), Venedik’in baskısıyla öncelikle **Zara** (I) ve ardından **İstanbul’un işgali ve Latin İmparatorluğu’nun kurulmasıyla** (II) sonuçlanmıştır."},
{"id":347,"d":"hacli","u":4,"n":106,"q":"I. Suriye’deki Eyyubi hâkimleri Mısır ordusunu desteklemişlerdir. II. Savaş, Baybars kumandasındaki Harizmliler ve Mısır ordusunun zaferiyle sonuçlanmıştır. III. Franklar daha önce diplomasi yoluyla elde edilmiş olan bütün kazanımları kaybetmişlerdir. Yukarıda verilen bilgilerden hangisi ya da hangileri 1244 Gazze Savaşı’yla ilgilidir?","o":{"a":"Yalnız I","b":"I ve III","c":"II ve III","d":"I ve II","e":"Yalnız II"},"c":"c","ex":"Cevap : C) II ve III Açıklama : 1244 **Gazze Savaşı** (La Forbie), Eyyubî Sultanı **es-Salih Eyyûb**’un (Baybars daha sonra Mısır Sultanı oldu, bu savaşta komutası tartışmalıdır) desteklediği **Hârizm** kuvvetleri ve Mısır ordusunun (II) Frank-Suriye ittifakını ezici bir yenilgiye uğrattığı savaştır. Bu yenilgi sonucunda Franklar, Altıncı Haçlı Seferi’nde (II. Friedrich) diplomasi yoluyla elde ettikleri **bütün kazanımları kaybetmişlerdir** (III). Suriye’deki Eyyubi hâkimleri (Halep Zengîleri) bu dönemde Mısır’a karşıydı (I yanlıştır)."},
{"id":348,"d":"hacli","u":4,"n":107,"q":"Sekizinci Haçlı Seferi (1270)’nin hedefi aşağıdakilerden hangisi olmuştur?","o":{"a":"Mısır","b":"Anadolu","c":"Suriye","d":"İstanbul","e":"Tunus"},"c":"e","ex":"Cevap : E) Tunus Açıklama : 1270 yılında Fransa Kralı **IX. Louis** tarafından düzenlenen Sekizinci Haçlı Seferi’nin asıl hedefi, kardeşi Charles d’Anjou’nun etkisiyle, Kuzey Afrika’daki **Tunus** olmuştur."},
{"id":349,"d":"hacli","u":4,"n":108,"q":"Haçlı Seferi’nin öncüleri sayılabilecek olan ilk Haçlı grubu kimin idaresindeydi?","o":{"a":"Pierre l'Ermite","b":"Baudouin","c":"Etienne de Blois","d":"Bohemund","e":"Godefroi de Bouillon"},"c":"a","ex":"Cevap : A) Pierre l’Ermite Açıklama : Birinci Haçlı Seferi’nin **öncüleri** olarak kabul edilen ve düzenli ordudan önce yola çıkan, çoğunlukla yoksul ve silahsız kişilerden oluşan grup, **Keşiş Pierre l’Ermite** (Peter the Hermit) idaresindeydi."},
{"id":350,"d":"hacli","u":4,"n":109,"q":"I. Balıkesir-Alaşehir-Denizli-Antalya II. İznik-Gölpazarı-Nallıhan-Ankara-Çankırı III. Eskişehir-Akşehir-Konya-Ereğli Yukarıdakilerden hangisi ya da hangileri 1101 Yılı Haçlı Seferleri sırasında Frankların kullandığı güzergâhlardan biri değildir?","o":{"a":"Yalnız I","b":"I ve II","c":"Yalnız III","d":"Yalnız II","e":"II ve III"},"c":"a","ex":"Cevap : A) Yalnız I Açıklama : 1101 yılındaki Haçlı Seferleri sırasında Franklar, Anadolu’da farklı güzergâhlar kullanmıştır. II. (Kuzey yol) ve III. (orta yol) güzergâhları bu seferlerde kullanılmıştır. Ancak I. (Batı Anadolu’nun derinliklerine inen) güzergâhı, bu seferlerin ana güzergâhlarından biri **değildir**."},
{"id":351,"d":"hacli","u":4,"n":110,"q":"I. Antakya’nın Haçlılardan alınması II. Mısır’da hilafetin tesis edilmesi III. Hittin Savaşı ve Kudüs’ün fethi Yukarıdakilerden hangisi ya da hangileri Sultan Baybars’ın hükümdarlığı dönemindeki önemli gelişmelerdendir?","o":{"a":"Yalnız III","b":"Yalnız II","c":"I ve II","d":"II ve III","e":"Yalnız I"},"c":"c","ex":"Cevap : C) I ve II Açıklama : Sultan Baybars (1260–1277) döneminde gerçekleşen önemli olaylar: I. Antakya’nın Haçlılardan alınması (1268) → Baybars döneminde gerçekleşmiştir. II. Mısır’da hilafetin tesis edilmesi (1258 sonrası Abbasi halifesinin Mısır’a getirilmesi) → Baybars döneminde gerçekleşmiştir. III. Hittin Savaşı ve Kudüs’ün fethi (1187) → Selahaddin Eyyubi döneminde gerçekleşmiştir, Baybars dönemi değildir. Dolayısıyla Baybars dönemindeki gelişmeler: I ve II"},
{"id":352,"d":"hacli","u":4,"n":111,"q":"Haçlı Seferleri arifesinde, Kudüs’ün siyasi durumu hakkında aşağıdakilerden hangisi doğrudur?","o":{"a":"Kudüs, Haçlılar Doğu'ya hareket ettiğinde Selçuklular adına Artuklular tarafından idare ediliyordu.","b":"Kudüs, Haçlı Seferleri başladığı sırada Fâtımilerin eline geçmişti.","c":"Kudüs, Haçlı Seferleri arifesinde Bizans İmparatorluğu'nun kontrolü altındaydı.","d":"Kudüs, Haçlı Seferleri öncesinde tamamen bağımsız bir şehir devleti olarak varlığını sürdürüyordu.","e":"Kudüs, Haçlı Seferi çağrısı yapıldığında Selçuklu ailesinden Tutuş tarafından yönetiliyordu."},"c":"a","ex":"Cevap : A) Kudüs, Haçlılar Doğu’ya hareket ettiğinde Selçuklular adına Artuklular tarafından idare ediliyordu.Açıklama :"},
{"id":353,"d":"hacli","u":4,"n":112,"q":"I. Mısır-Suriye Hakimi Nûreddin Mahmud II. Bizans İmparatoru II. Isaakios Angelos III. Selçuklu Sultanı I. Mesud Yukarıdakilerden hangisi ya da hangileri Alman İmparatoru Friedrich Barbarossa’nın III. Haçlı Seferi öncesinde diplomatik temaslarda bulunduğu hükümdarlar arasındadır?","o":{"a":"II ve III","b":"Yalnız II","c":"Yalnız I","d":"I ve II","e":"Yalnız III"},"c":"b","ex":"Cevap : B) Yalnız II Açıklama :"},
{"id":354,"d":"hacli","u":4,"n":113,"q":"Haçlı Seferleri sırasında Bizans’ın büyük zarar görmesi …. Yukarıdaki cümleyi doğru şekilde tamamlayan ifade aşağıdakilerden hangisidir?","o":{"a":"bölgede büyük bir etki yaratmamıştır.","b":"Türklerin işine yaramamıştır.","c":"Türklerin Batı'ya ilerlemelerine yardımcı olmuştur.","d":"Alman imparatorunun otoritesini güçlendirmiştir","e":"Papa'nın nüfuzunun artmasını sağlamıştır."},"c":"c","ex":"Cevap : C) Türklerin Batı’ya ilerlemelerine yardımcı olmuştur. Açıklama : Haçlı Seferleri, Bizans İmparatorluğu’nun hem topraklarını kaybetmesine hem de askeri ve ekonomik olarak yıpranmasına, özellikle de **IV. Haçlı Seferi** sonrasında ciddi zarar görmesine neden olmuştur. Bu durum, Bizans’ın bölgedeki gücünü azaltarak **Türklerin Anadolu ve Batı yönündeki ilerleyişini kolaylaştırmıştır**."},
{"id":355,"d":"hacli","u":4,"n":114,"q":"Aşağıdaki gelişmelerden hangisi Haçlı Seferlerinin Avrupa toplumu üzerindeki sosyal etkilerinden biridir?","o":{"a":"Protestan Kilisesi'nin kuruluşu","b":"Reform hareketinin doğuşu","c":"Papalığın itibarının azalması","d":"Doğu-Batı ticaretinin gelişmesi","e":"Toplumda tacir ve işçi sınıfının ortaya çıkışı"},"c":"e","ex":"Cevap : E) Toplumda tacir ve işçi sınıfının ortaya çıkışı Açıklama : Haçlı Seferleri, Doğu ile Batı arasındaki ticareti artırarak (D) ve feodal sistemin zayıflamasına katkıda bulunarak, kentlerin büyümesini ve **tacir (burjuva) ve işçi sınıfının** (E) Avrupa toplumunda ekonomik ve sosyal bir güç olarak ortaya çıkışını hızlandırmıştır. (C ve D ekonomik ve dini sonuçlardır; A ve B çok daha sonraki gelişmelerdir)."},
{"id":356,"d":"hacli","u":4,"n":115,"q":"Aşağıdakilerden hangisi Haçlı Seferlerinden etkilenen devletlerden biri değildir?","o":{"a":"Danişmendliler","b":"Türkiye Selçuklu Devleti","c":"Eyyübiler","d":"Karahanlılar","e":"Zengîler"},"c":"d","ex":"Cevap : D) Karahanlılar Açıklama : **Karahanlılar Devleti**, Orta Asya’da faaliyet gösterdiği için, Haçlı Seferlerinin doğrudan askeri veya siyasi etkilerinden **uzakta** kalmıştır. Danişmendliler, Türkiye Selçukluları, Eyyübiler ve Zengîler ise Haçlılarla doğrudan mücadele eden veya onlardan etkilenen devletlerdir."},
{"id":357,"d":"hacli","u":4,"n":116,"q":"1097’deki Dorylaion Savaşı’ndan önce gerçekleşen hangi durum savaşın kaderini etkilemiştir?","o":{"a":"Türk ordusunda anlaşmazlık çıkması","b":"Etienne de Blois'nın ülkesine geri dönmesi","c":"Bohemund'un imparatora ihaneti","d":"Haçlı ordusunun ikiye ayrılmış olması","e":"Bizans ordusunun yardıma gelmesi"},"c":"d","ex":"Cevap : D) Haçlı ordusunun ikiye ayrılmış olması Açıklama : Dorylaion Savaşı (1097) sırasında, Selçuklu ordusu Haçlıların **öncü** birliklerine (Bohemund ve Robert komutasındaki) saldırmıştır. **Haçlı ordusunun ikiye ayrılmış** (D) olması, Selçuklu Sultanı I. Kılıç Arslan’ın Haçlıları kolay lokma sanmasına ve öncü birliği tuzağa düşürme girişimine yol açmış, ancak ana kuvvetin zamanında yetişmesiyle savaşın seyri değişmiştir."},
{"id":358,"d":"hacli","u":4,"n":117,"q":"Selahaddin Eyyubî, Nûreddin Mahmud’un ölümünden sonra İslam dünyasında birliği tekrar sağlamak için hangi bölgeleri kendi hâkimiyeti altına almıştır?","o":{"a":"Kahire ve Taberiye","b":"Halep ve Musul","c":"Kudüs ve Trablus","d":"İskenderiye ve Bağdat","e":"Halep ve Bağdat"},"c":"b","ex":"Cevap : B) Halep ve Musul Açıklama : Selahaddin Eyyubî, Mısır’a hâkim olduktan sonra (Kahire) ve Nûreddin Mahmud’un ölümünden (1174) sonra, Haçlılara karşı güçlü bir cephe oluşturmak için Nûreddin’in mirasçılarıyla mücadele ederek **Halep** ve **Musul**’u (Zengî merkezleri) kendi hâkimiyeti altına almıştır."},
{"id":359,"d":"hacli","u":4,"n":118,"q":"Aşağıdakilerden hangisi Kudüs Haçlı Krallığı’nın yıkılış sürecinde rol oynayan şahsiyetlerdendir?","o":{"a":"Melisende","b":"Aice","c":"Baudouin du Bourd","d":"Raymond de St. Gilles","e":"Renaud de Châtillon"},"c":"e","ex":"Cevap : E) Renaud de Châtillon Açıklama : **Renaud de Châtillon**, Selahaddin Eyyubi ile yapılan barış anlaşmasını sürekli ihlal eden saldırılarıyla (özellikle Müslüman kervanlarına saldırması), **Hittin Savaşı**’na (1187) ve dolayısıyla Kudüs Krallığı’nın yıkılış sürecine neden olan en önemli provokatör şahsiyettir."},
{"id":360,"d":"hacli","u":4,"n":119,"q":"İmparator II. Friedrich’in Haçlı Seferi’ne katılma nedeni aşağıdakilerden hangisidir?","o":{"a":"Siyasi hedeflerini gerçekleştirmek","b":"Dini görevini yerine getirmek","c":"Kendi halkına hizmet etmek","d":"Müslümanlarla savaşmak","e":"Bizans'a yardım sağlamak"},"c":"a","ex":"Cevap : A) Siyasi hedeflerini gerçekleştirmek Açıklama : İmparator **II. Friedrich**, Papa tarafından aforoz edilmiş olmasına rağmen Haçlı Seferi’ne katılmıştır. Buradaki asıl amacı, **siyasi otoritesini ve itibarını** güçlendirmek, Doğu Akdeniz’de **siyasi hedeflerini** (özellikle Sicilya Krallığı üzerindeki haklarını genişletmek) gerçekleştirmek ve Papa’nın baskısından kurtulmaktı."},

{"id":512,"d":"ilk-turk-islam","u":3,"x":[6],"n":69,"q":"İslam’ı kabul eden Bulgar hükümdarı (ilteber) Almuş Abbasi halifesi Muktedir-Billah’a bir elçilik heyeti göndererek kendisine islam dininin tebliğ edecek din bilginleri (fakihler) cami ve kale yapımına yardımcı olacak ustalar istemiştir. Halife Muktedir de bu isteği memnuniyetle kabul edip Mart-Nisan 921 tarihinde istenen din adamları, usta ve parayı hakana göndermiştir. Buna göre aşağıdaki değerlendirmelerden hangisi yanlıştır?","o":{"a":"Bulgar devletinin 950’de Müslüman olmadığı anlaşılıyor.","b":"Abbasi Halifesi, Bulgar hükümdarına olumlu cevap vermiştir.","c":"Bulgar devleti Abbasi Halifesinden yardım istemiştir.","d":"Bir Türk hükümdarı İslamiyet’i kabul etmiştir.","e":"Bulgar devleti ile Abbasi Devleti arasında diplomatik temas sağlanmıştır"},"c":"a","ex":"Cevap : A) Bulgar devletinin 950’de Müslüman olmadığı anlaşılıyor."},
{"id":513,"d":"ilk-turk-islam","u":3,"n":70,"q":"Türklerle Araplar arasındaki ilişkiler Cahiliye Devrine kadar uzanır. Cahiliye devri arap şiir ve darbı mesellerinde (atasözleri) Türklerden bahsedilmesi de kahramanlıkları üzerinde durmuşlardır .Meşhur Arap müellifi el-Cahız, Feza’il- Etrak adlı eserinde Türklerin askeri kabiliyetlerini ısrarla belirtmektedir. Yukarıdaki açıklamalara bakarak aşağıdakilerden hangi sonuca varılabilir?","o":{"a":"Türklerle arapların arası her zaman iyi olmuştur.","b":"Türklerle Arapların ilişkileri, Abbasiler devrine kadar gitmektedir.","c":"Türklerin en iyi bildiği iş şairliktir.","d":"Türkler Cahiliye devrinde Araplarla savaşıyorlardı","e":"Arap kaynakları Türklerin cesaret, kahramanlık ve askeri yeteneklerinden bahsederler."},"c":"e","ex":"Cevap : E) Arap kaynakları Türklerin cesaret, kahramanlık ve askeri yeteneklerinden bahsederler."},

{"id":530,"d":"ilk-turk-islam","u":4,"n":87,"q":"Aşağıdakilerden hangisi Sultan Mahmud devri anıtlarının en ünlüsüdür?","o":{"a":"Gazne Camii","b":"Somnat Mabedi","c":"Sebük Tegin'‎in Mezarı","d":"Gazne Kalesi","e":"Sultan Mahmud Türbesi"},"c":"a","ex":"Cevap : A) Gazne Camii Açıklama : Sultan Mahmud’un en ünlü mimari eseri ve anıtı, Gazne’de inşa ettirdiği ve döneminin en görkemli yapılarından biri olan **Gazne Camii** (Arusü’l-Felek Camii) ve yanındaki saraylardır."},
{"id":531,"d":"ilk-turk-islam","u":4,"n":88,"q":"Aşağıdakilerden hangisi Batı Karahanlı Devleti döneminde gerçekleşen olaylardan değildir?","o":{"a":"Balasagunlu Yusuf Has Hacib'in Kutadgu Bilig adlı eserini Kaşgar kentinde yazması","b":"Sultan Alp Arslan'‎ın 1072 tarihinde Mâverâünnehr'‎e sefer düzenlemesi","c":"449 (1057-1058) tarihinde Buhara'da çok şiddetli bir veba salgınının meydana gelmesi","d":"Hârizmşahlar'‎ın 1212 yılında Batı Karahanlı Devletine son vermesi","e":"Melikşah'‎ın Buhara ve Semerkandı zapt ederek Ahmed Han'‎ı esir alıp Isfahan'‎a götürmesi"},"c":"a","ex":"Cevap : A) Balasagunlu Yusuf Has Hacib’in Kutadgu Bilig adlı eserini Kaşgar kentinde yazması Açıklama : **Kutadgu Bilig**, Karahanlı Devleti’nin henüz doğu ve batı olarak ayrılmadığı ve Yusuf Has Hacib’in Karahanlı Hükümdarı **Uluğ Kara Buğra Han’a** sunduğu bir eserdir. Bu eser, Karahanlıların **birleşik** döneminde (1069-1070) yazılmıştır. Batı Karahanlı Devleti’nin kurulmasından sonraki dönemde gerçekleşen olaylardan değildir."},
{"id":532,"d":"ilk-turk-islam","u":4,"n":89,"q":"Karahanlılar döneminde kullanılan edebî dil aşağıdakilerden hangisidir?","o":{"a":"Farsça","b":"Türkçe","c":"Soğdca","d":"Çince","e":"Arapça"},"c":"b","ex":"Cevap : B) Türkçe Açıklama : Karahanlılar Devleti, Türk tarihinde İslâmiyet’i kabul eden ilk büyük Türk devletidir. Bu dönemde Balasagunlu Yusuf Has Hacib’in **Kutadgu Bilig** ve Kaşgarlı Mahmud’un **Divanü Lugati’t-Türk** gibi eserleri, Karahanlıların resmî ve edebî dilinin **Türkçe** (Hakanî Türkçesi) olduğunu gösterir."},
{"id":533,"d":"ilk-turk-islam","u":4,"n":90,"q":"İtil Bulgarları bir cenazeleri olduğunda ölüyü hangi yöntemle uğurlarlardı?","o":{"a":"Irmağa atma","b":"Ağacın tepesine asma","c":"Toprağa gömme","d":"Denize atma","e":"Yakma"},"c":"c","ex":"Cevap : C) Toprağa gömme Açıklama : İtil Bulgarları, İslâmiyet’i kabul ettikten sonra, cenazeleri için eski Türk geleneklerini bırakarak, **İslâm usullerine uygun olarak ölüyü toprağa gömme** yöntemini uygulamaya başlamışlardır (İbn Fadlan’ın notlarında yer alır)."},
{"id":534,"d":"ilk-turk-islam","u":4,"n":91,"q":"“Bulgar Türkleri arasında 5.000 kadın ve erkekten müteşekkil ‘Barancer’ adıyla bilinen bir aile topluca İslâmiyet’‎e girdiler ve namaz kılmak için kendilerine ahşaptan bir cami yaptılar.” Bu ifade, aşağıdaki seyyahlardan hangisine aittir?","o":{"a":"İbn Hurdazbih","b":"İstahri","c":"Süleyman el-Tâcir","d":"Ebü'l-Fida","e":"İbn Fadlan"},"c":"e","ex":"Cevap : E) İbn Fadlan Açıklama : Bulgar Türklerinin İslâmiyet’i kabulü ve yaşamlarına dair detaylı bilgiler veren ve bizzat bu bölgelere seyahat eden ünlü Arap seyyah ve yazar **İbn Fadlan**’dır. Söz konusu ifade onun seyahatnamesinden alınmıştır."},
{"id":535,"d":"ilk-turk-islam","u":4,"n":92,"q":"Karahanlılar Devleti hangi hükümdar zamanında tamamen Müslüman bir karakter kazanmıştır?","o":{"a":"Bilge Kül Kadır Han","b":"Ebu'‎l-Hasan Ali","c":"Satuk Buğra Han","d":"Musa (Baytaş) b. Abdülkerim","e":"Kılıç Buğra Han"},"c":"d","ex":"Cevap : D) Musa (Baytaş) b. Abdülkerim Açıklama :"},
{"id":536,"d":"ilk-turk-islam","u":4,"n":93,"q":"Tolunoğulları ülkesinin zenginleşmesiyle isim yapmış şairlerin sayısı da bir hayli artmıştır. Tolunoğulları ilim adamları ve şairlere büyük ihsanlarda bulundukları için bu dönemde çok sayıda şair ön plana çıkmıştır. Bunlar arasında en meşhur olanı aşağıdakilerden hangisidir?","o":{"a":"Ahmed b. Yusuf b. İbrahim","b":"İbnü'd-Dâye","c":"Ahmed b. Cafer et-Dineverî","d":"el-Hüseyin b. Abdüsselâm","e":"el-Velid b. Muhammed et-Temîmî"},"c":"d","ex":"Cevap : D) el-Hüseyin b. Abdüsselâm Açıklama :"},
{"id":537,"d":"ilk-turk-islam","u":4,"n":94,"q":"Aşağıdakilerden hangisi Tolunoğlu Ahmed Camii’‎nde bulunuyordu?","o":{"a":"Çay ocağı","b":"Doktor","c":"Dershane","d":"Bakkal","e":"Han"},"c":"b","ex":"Cevap : B) Doktor Açıklama : Tolunoğlu Ahmed Camii, sadece bir ibadet yeri değil, aynı zamanda etrafında şifahaneler (hastaneler) ve ilim merkezleri de barındıran kompleks bir yapıydı. Bu yapının içinde hastalara bakan ve muayene yapan bir **Doktor** (tabip) bulunuyordu."},
{"id":538,"d":"ilk-turk-islam","u":4,"n":95,"q":"I. Abbâsî halifesi el-Kadir-Billâh adına hutbe okuttu. II. Horasan’‎a sahip oldu. III. Sistan, Cüzcan, Çağaniyan, Huttal ve Harizm’‎i hâkimiyeti altına aldı. IV. Gur bölgesini kontrol altına almaya çalıştı. V. 1032 yılında vefat etti. Yukarıda Gazneli Sultan Mahmud hakkında verilen bilgilerden hangisi yanlıştır?","o":{"a":"Yalnız IV","b":"Yalnız II","c":"Yalnız I","d":"Yalnız III","e":"Yalnız V"},"c":"e","ex":"Cevap : E) Yalnız V Açıklama : Gazneli Sultan Mahmud, 1030 yılında vefat etmiştir[cite: 614]. 1032 yılında vefat ettiği bilgisi (V) **yanlıştır**."},
{"id":539,"d":"ilk-turk-islam","u":4,"n":96,"q":"Aşağıdakilerden hangisi Gazneliler hükümdarı değildir?","o":{"a":"Şirzad","b":"III. Mesud","c":"H&amp;uuml;srevş&amp;acirc;h","d":"Ferruhş&amp;acirc;h","e":"Abd&amp;uuml;rreşid"},"c":"d","ex":"Cevap : D) FerruhşâhAçıklama :"},
{"id":540,"d":"ilk-turk-islam","u":4,"n":97,"q":"Sultan Mahmud 1030 yılında vefat ettiğinde Gazneliler Devleti batıda Azerbaycan sınırlarında, doğuda Hindistan’ın Yukarı Ganj Vadisi’ne, Orta Asya’da Hârizm’den Hint Okyanusu sahillerine kadar uzanan çok geniş bir sahayı kapsıyordu. Bu bilgilere göre aşağıdakilerden hangisine varılamaz?","o":{"a":"Sultan Mahmud'un ölüm tarihi bellidir.","b":"Gaznelilerin sınırı doğuda Hindistan toprakları içindedir.","c":"Gazneliler Devleti sınırları Hint Okyanusu kıyılarına uzanır.","d":"Gazneliler Devleti sınırları çok geniş bir yüz ölçümüne sahiptir.","e":"Azerbaycan, Gazneliler Devleti hâkimiyeti altındadır."},"c":"e","ex":"Cevap : E) Azerbaycan, Gazneliler Devleti hâkimiyeti altındadır. Açıklama : Verilen metinde, Gazneliler Devleti’nin sınırının batıda **Azerbaycan sınırlarına kadar uzandığı** belirtilmektedir. Bu ifade, sınırın Azerbaycan’da **sona erdiğini** gösterir ancak Azerbaycan’ın **tamamının veya bir kısmının** Gazneliler hâkimiyeti **altında** olduğu sonucuna net bir şekilde varılamaz. Diğer şıklar (Ölüm tarihi, genişlik, coğrafi sınırlar) metinden doğrudan anlaşılmaktadır."},
{"id":541,"d":"ilk-turk-islam","u":4,"n":98,"q":"Gazneli Sultan İbrahim ile Selçuklular arasında yapılan antlaşmaya göre Gazneliler ile Selçuklular arasındaki sınırı aşağıdakilerden hangisi oluşturmaktaydı?","o":{"a":"Nesa Ovası","b":"Ceyhun Irmağı","c":"Hindikuş Dağları","d":"Sistan Bölgesi","e":"Seyhun Irmağı"},"c":"c","ex":"Cevap : C) Hindikuş Dağları Açıklama : Gazneli Sultan İbrahim ile Selçuklular arasında yapılan antlaşmaya göre, iki devlet arasındaki sınırın **Hindikuş Dağları** olduğu kabul edilmiştir. Bu, Gaznelilerin Hindistan’a, Selçukluların ise Horasan ve batıya odaklanmasını sağlamıştır."},
{"id":542,"d":"ilk-turk-islam","u":4,"n":99,"q":"Bâbek İsyanı’‎nı bastırmayı başaran Türk kumandanı Afşin’‎i bu iş için hangi Abbâsî halifesi görevlendirmiştir?","o":{"a":"el-Kaim","b":"el-Mansûr","c":"Mu'tasım","d":"Me'‎mun","e":"el-Mütevekkil"},"c":"c","ex":"Cevap : C) Mu’tasım Açıklama : **Bâbek İsyanı**, 837 yılında, Abbâsî halifesi **Mu’tasım** döneminde, Türk kumandanı **Afşin Haydar b. Kâvûs** tarafından kesin olarak bastırılmıştır."},
{"id":543,"d":"ilk-turk-islam","u":4,"n":100,"q":"Tolunoğulları Devleti’‎nin kurucusu Ahmed b. Tolun’‎un asıl mesleği aşağıdakilerden hangisidir?","o":{"a":"Vezirlik","b":"Askerlik","c":"Demircilik","d":"Kâtiplik","e":"Muallimlik"},"c":"b","ex":"Cevap : B) Askerlik Açıklama : Tolunoğlu Ahmed, babası Tolun gibi Abbasi ordusunda görev yapan bir **asker** (Türk kumandanı) idi. Asıl mesleği askerliktir ve valiliğe bu askeri kimliğiyle yükselmiştir."},

{"id":547,"d":"ilk-turk-islam","u":4,"n":104,"q":"“Hazarlar bölgesinde yapılan kazılarda atlara ait mezarlar ve bu mezarların içinde at iskeletlerinin yanında üzengiler, at koşum takımlarına ait halka ve gemler bulunmuştur.” Yukarıda verilen bilgiye göre Hazarlar hakkında hangisi söylenebilir?","o":{"a":"Hazarlar ölen yakınlarını at koşumları ve üzengiler ile birlikte gömerlerdi.","b":"Hazarlar at iskeletinden üzengi yaparlardı.","c":"Hazarlarda atın çok önemli bir yeri vardı.","d":"Hazarlar at kişnemesini uğurlu sayarlardı.","e":"Hazarlar ölülerini toprağa gömerlerdi."},"c":"c","ex":"Cevap : C) Hazarlarda atın çok önemli bir yeri vardı."},

{"id":549,"d":"ilk-turk-islam","u":4,"n":106,"q":"Sultan Melikşah 1090 yılında çıktığı II. Mâverâünnehr seferinde Ahmed Han’ı ülkesine iade etti. Ancak ulemâ onu katletti. Artık bu tarihten sonra Batı Karahanlı tahtına çıkacak olan hükümdarları Büyük Selçuklular tayin etmeye başladılar. Yukarıda verilen bilgilere göre aşağıdakilerden hangisine ulaşılamaz?","o":{"a":"Batı Karahanlıların Selçuklulara bağlı olduğu","b":"Batı Karahanlı ulemâsı ile hükümdar arasında anlaşmazlık olduğu","c":"Selçukluların, Batı Karahanlılara tahakküm ettiği","d":"Batı Karahanlı ulemâsının hükümdar seçiminde etkili olduğu","e":"Sultan Melikşâh'ın, II. Mâverâünnehr seferinin hangi tarihte yapıldığı"},"c":"d","ex":"Cevap : D) Batı Karahanlı ulemâsının hükümdar seçiminde etkili olduğu"},

{"id":555,"d":"ilk-turk-islam","u":4,"n":112,"q":"Ebu’l-Misk Kâfûr dönemi ile ilgili aşağıdaki bilgilerden hangisi yanlıştır?","o":{"a":"Kâfûr döneminde Fâtımîler Mısır'ı işgal edip bu devlete son verdi.","b":"Ebu'l-Hasan Ali, 966'da ölünce Kâfûr kendisini Mısır'ın hâkimi ilân etti.","c":"Kâfûr, Ûnûcûr'un ölümünden sonra yerine geçen kardeşi döneminde de nâibliğini korudu.","d":"Bu dönemde Suriye yeniden İhşîdiler'in hâkimiyeti altına girdi.","e":"Kâfur'un Mısır'daki yönetimine Abbâsî Halîfesi el-Mutî onay verdi."},"c":"a","ex":"Cevap : A) Kâfûr döneminde Fâtımîler Mısır’ı işgal edip bu devlete son verdi."},
{"id":556,"d":"ilk-turk-islam","u":4,"n":113,"q":"I. Satuk Buğra Han’ın oğludur. II. Karahanlılar Devleti’nin tamamının Müslüman olmasını sağlamıştır. III. Baytaş olarak da bilinir. IV. Ebu’l Hasan Ali, onun oğludur. V. Gazneli Sultan Mahmud ile bir antlaşma yapmıştır. Yukarıda Musa b. Abdülkerim hakkında verilen bilgilerden hangisi yanlıştır?","o":{"a":"Yalnız III","b":"Yalnız V","c":"Yalnız IV","d":"Yalnız II","e":"Yalnız I"},"c":"b","ex":"Cevap : B) Yalnız V"},

{"id":559,"d":"ilk-turk-islam","u":4,"n":116,"q":"Aşağıdakilerden hangisi Tolunoğlu Ahmed’in uyguladığı malî politikalar arasında yer almaz?","o":{"a":"Hazinenin gelirlerini arttırmak için toprak üzerindeki üretimden, hayvancılıktan ve ticaretten ağır vergiler topladı.","b":"872 yılında bastırdığı bakır para yanında ayrıca 880 yılında, ağırlık ve ayar olarak daha sağlam \"ed- Dinâru't-Tolûnî\" diye bilinen parayı kestirtti.","c":"Yolsuzluk yapan memurları görevden alarak maliyeyi çok güvenilir dürüst kimselerin eline bıraktı.","d":"Sulama kanallarını onarttı ve eskilerinin yanında yeni su kanalları ve kemerleri yaptırarak tarımdan elde edilen gelirin artmasını sağladı.","e":"Nil Nehri'nin taşıdığı su miktarını tespit etmek ve kuraklığın önüne geçmek gayesiyle er-Ravza Adası'ndaki Mikyâs'ı yeniden yaptırdı."},"c":"a","ex":"Cevap : A) Hazinenin gelirlerini arttırmak için toprak üzerindeki üretimden, hayvancılıktan ve ticaretten ağır vergiler topladı."},

{"id":561,"d":"ilk-turk-islam","u":4,"n":118,"q":"Bulgar Türklerinin yaşadığı ülkede bir çadıra yıldırım düşerse o çadıra yaklaşılmaz, içinde bulunan insan, eşya ve diğer şeyler terk edilirdi. Bu durumun sebebi aşağıdakilerden hangisidir?","o":{"a":"Hükümdarın çadıra yaklaşmayı yasaklaması","b":"Toplumun bu tür doğal afetlerden korkması","c":"Çadırın içinde yaşayan kimselerin Allah’ın gazâbına uğradıklarının düşünülmesi","d":"Çadırın kullanışsız hâle gelmesi","e":"İtil Bulgarlarının yağmur yağarken dışarı çıkmamaları"},"c":"c","ex":"Cevap : C) Çadırın içinde yaşayan kimselerin Allah’ın gazâbına uğradıklarının düşünülmesi"},

{"id":572,"d":"ilk-turk-islam","u":6,"n":129,"q":"“Türklerle Araplar arasındaki ilişkiler Câhiliye Devri’ne kadar uzanır. Câhiliye Devri Arap şiir ve darb-ı mesellerinde (atasözleri) Türklerden bahsedilmesi de bunu göstermektedir. Câhiliye Devri Arap şâirlerinden Nâbığatü’z-Zübyânî, Hasan b. Hanzala, Şemmah b. Dırar şiirlerinde Türklerin cesaret ve kahramanlıkları üzerinde durmuşlardır. Meşhur Arap müellifi el-Câhız, Fezâ’il-Etrak adlı eserinde Türklerin askerî kaabiliyetlerini ısrarla belirtmektedir.” Yukarıdaki açıklamalara bakarak aşağıdakilerden hangi sonuca varılabilir?","o":{"a":"Türklerin en iyi bildiği iş şâirliktir.","b":"Türklerle Arabların arası her zaman iyi olmuştur.","c":"Türklerle Arapların ilişkileri, Abbasîler devrine kadar gitmektedir.","d":"Arap Kaynakları Türklerin cesaret, kahramanlık ve askerî yeteneklerinden bahsederler.","e":"Türkler, Cahiliye Devri’nde Araplarla savaşıyorlardı."},"c":"d"},

{"id":574,"d":"ilk-turk-islam","u":6,"n":131,"q":"“Hz. Ömer Horasan’ın fethi üzerine önce kumandanı Ahnef b. Kays’ın kazandığı zaferlerden duyduğu memnuniyeti dile getirmiş ancak daha sonra “keşke Horasan’a ordu göndermeseydim, keşke Horasan ile aramızda ateşten bir deniz olsaydı”demiş ve Ceyhun nehrini geçerek fetihlere devam etmek isteyen Ahnef’e “Sakın nehrin karşı tarafına geçmeyiniz, bulunduğunuz yerde kalınız”diye haber göndermiştir.” Hz. Ömer’in bu sözleri söylemesinin altında hangi neden yatmaktadır?","o":{"a":"Türklerle dostça ilişkiler kurmak istiyordu.","b":"Komutanına pek fazla güvenmiyordu.","c":"Türklerden korkuyordu.","d":"Hz. Muhammed ona Türklerden uzak durmasını söylemişti.","e":"Türklerle karşı karşıya gelecek olan ordusunun kayıp vermesinden endişe etmekteydi."},"c":"e"},

{"id":577,"d":"ilk-turk-islam","u":6,"n":134,"q":"Türkler ölüm ve hayatın Tanrı’nın iradesine bağlı olduğuna insanın fâni, Tanrı’nın ise ebedî olduğuna inanırlardı. Tanrı kelimesi Başkırtça hariç bütün Türk lehçelerinde ortak olarak kullanılan bir kelimedir. Yukarıda verilen bilgiden hareketle Türklerdeki Tanrı kelimesinin İslâmiyet’teki karşılığı ne olmalıdır?","o":{"a":"Evliya","b":"Şaman","c":"Peygamber","d":"Şehid","e":"Allah"},"c":"e"},
{"id":578,"d":"ilk-turk-islam","u":6,"n":135,"q":"Yahudiliği benimsemiş olan Hazarların ve Hıristiyanlığı benimsemiş olan Macarların ve Bulgarların bugün Türklüklerinden bahsedilmemektedir. Bu bilgiye bakılarak aşağıdakilerden hangisi söylenilebilir?","o":{"a":"İslâmiyet dışındaki dinler Türklerin asimile olmalarına neden olmuştur","b":"Din değiştirmek Türkleri pek etkilememiştir","c":"Türklerin Yahudîliği benimsemeleri onları daha da başarılı kılmıştır","d":"Macar ve Bulgarların Hristiyanlığı kabul etmeleri onların hayatta kalmasını sağlamıştır","e":"Türklerin eski dinlerini bırakmaları onların pek yararına olmamıştır"},"c":"a"},
{"id":579,"d":"ilk-turk-islam","u":6,"n":136,"q":"Eski Türkler tabiatta bir takım gizli kuvvetlere inanıyorlardı. Ayrıca ölmüş büyüklere tazim ve onlara kurban kesmek şeklinde beliren “atalar kültü” Bozkır Türk inançları arasında yer alıyordu. Yukarıda verilen bilgide Türklerin bu özellikleri İslâmiyet’teki hangi kurala benzerlik gösterir?","o":{"a":"Oruç tutmak","b":"Namaz kılmak","c":"Kurban kesmek","d":"Anne-baba ve diğer aile büyüklerine saygı göstermek","e":"İslâm’ın miras anlayışına benzer"},"c":"d"},
{"id":580,"d":"ilk-turk-islam","u":6,"n":137,"q":"Eski Türk Hükümdarları, kendilerinin Tanrı tarafından tahta çıkarıldığını, zaferleri Gök Tanrı’nın yardımıyla kazandıklarını, çeşitli hile ve tuzaklardan Gök Tanrı’nın yardımıyla kurtulduklarına inanırlardı. Yukarıda verilen bu bilgi İslâm Tarihi’nde hangisiyle benzerlik gösterir?","o":{"a":"Emevîler, halkın efendisi olduklarını düşünürler","b":"Abbâsîler yeryüzünde Allah’ın gölgesi olduklarını düşünürler","c":"Gazneli Mahmud, kendisinin Allah’ın sığınağı olduğunu düşünür","d":"Tuğrul Bey, doğunun ve batının sultanı olduğunu düşünür","e":"Hz. Ömer, Allah adına hüküm verdiğini düşünür"},"c":"b"},

{"id":583,"d":"ilk-turk-islam","u":6,"n":140,"q":"Aşağıdakilerden hangisi Emevîlerin Türklere karşı başarılı olup Mâverâünnehr ve Horasan’daki Türk topraklarını fethetmelerini sağlayan nedenlerden biri değildir?","o":{"a":"Türkler arasında tam anlamıyla birlik yoktu.","b":"Emevîlerin Haccâc gibi çok güçlü ve taviz vermeyen bir genel valiyi göreve getirmiş olması.","c":"Horasan Valisi Kuteybe b. Müslim’in askerî dehası.","d":"Emevîlerin siyasî ve askerî bakımdan çok güçlü olması.","e":"Türklerin henüz Müslüman olmamaları."},"c":"e"},
{"id":584,"d":"ilk-turk-islam","u":6,"n":141,"q":"Aşağıdakilerden hangisi Emevîler Devri’nde İslâmiyet’in Türkler arasında hızla yayılmasını engelleyen sebeplerden biri değildir.","o":{"a":"İslâmiyeti kabul etmiş olan fakat Arap olmayan unsurlar devletin gelirlerini arttırmak gayesiyle her türlü vergiyi ödemekle mükelleftiler.","b":"Türklerin seferlere piyade olarak katılıyor olmaları","c":"Müslüman-Arap süvarilerinden daha az maaş alıyor olmaları","d":"Ganimetten daha az pay alıyor olmaları","e":"Türklerin eski dinlerine aşırı derecede bağımlı olmaları"},"c":"e"},

{"id":590,"d":"ilk-turk-islam","u":6,"n":147,"q":"I. Her vesileyle Türkler ve Türkistan toprakları üzerinde nüfuz kurmak isteyen Çinliler 751 yılındaki bu feci bozgundan sonra Batı Türkistan üzerindeki emellerinden vazgeçmek zorunda kalmış ve böylece Çin artık Batı Türkistan için bir tehdit unsuru olmaktan çıkmıştır. II. Savaştan önceki yıllarda Batı Türkistan’da sarsılmış olan Türk nüfuzu Talas Savaşı’ndan sonra yeniden tesis edilmiş ve 766’da Karluk Türkleri müstakil bir devlet kurmuşlardır. III. Hz.Ömer devrindeki fetihler sırasında başlayan Türk-Arap mücadelesi uzun süre devam etmiş ve bundan dolayı da İslâmiyet Türkler arasında yayılma imkânı bulamamıştı. Talas Savaşı’ndan sonra bu mücadele yerini barış ve dostluğa bırakmıştır. Bu sayede İslâmiyet Türkler arasında yayılmaya başlamıştır. IV. Talas Savaşı dünya kültür tarihi üzerinde de önemli rol oynamış ve esir alınan Çinliler vasıtasıyla Semerkand’da da keten ve kenevirden kağıt imal edilmeye başlanmış ve kağıtçılık çok geçmeden İslâm ülkelerinde yaygınlaşmıştır. V. Türkler bu savaş sonrasında Çinlilerden matbaayı öğrenerek kendi ülkelerinde bunu kullanıp Araplara da öğretmişlerdir. Bu dönemde Türkistan’da üç matbaa birden kurulmuştur. Yukarıda verilen bilgilerden hangisi Talas Savaşı’nın sonuçlarından biri değildir?","o":{"a":"I","b":"II","c":"III","d":"IV","e":"V"},"c":"e"},
{"id":591,"d":"ilk-turk-islam","u":6,"n":148,"q":"Aşağıdakilerden hangisi Türklerin İslâmiyet’i benimsemesinde bir dönüm noktası sayılır?","o":{"a":"Emevîlerin çöküşü","b":"Kuteybe b. Müslim’in ölümü","c":"Talas Savaşı","d":"Dandanakan Savaşı","e":"Malazgirt Savaşı"},"c":"c"},
{"id":592,"d":"ilk-turk-islam","u":6,"n":149,"q":"Aşağıdakilerden hangisi Talas Savaşı’nın gerçek sebebidir?","o":{"a":"Arapların Türklerden yardım istemesi","b":"Çinlilerin Batı Türkistan’ı istilaya kalkışması","c":"Çinlilerin Araplardan yardım istemesi","d":"Emevîlerin yıkılması","e":"Doğu Türkistan’ın Çin egemenliğine geçmesi"},"c":"b"},
{"id":593,"d":"ilk-turk-islam","u":6,"n":150,"q":"Emevîler Arap milliyetçiliğine dayalı bir siyaset takip ediyorlar, Arapların dışındaki Müslüman halka ikinci sınıf insan muamelesi yapıyorlardı. Abbasî ihtilal hareketi “mevâlî” dediğimiz Arap olmayan unsurların yoğun olarak yaşadığı Horasan bölgesinde gelişme imkânı buldu. Oradan da diğer eyaletlere doğru yayıldı. Abbasî ihtilalinin başarıya ulaşmasında İranlılar kadar Horasan bölgesinde yaşayan Türklerin de önemli rolü olmuştur. Aşağıdakilerden hangisi bu Türklerden biridir?","o":{"a":"İshak b. Kundacık","b":"Ahmed b. Tolun","c":"Muhammed b. Sûl","d":"Rutbil","e":"Amâcur et-Türkî"},"c":"c"},
{"id":594,"d":"ilk-turk-islam","u":6,"n":151,"q":"Aşağıdakilerden hangisi Hazarlar ile Müslümanlar arasındaki ticarî ilişkileri sağlayan başlıca yollardan biridir?","o":{"a":"Bağdad-Horasan yolu","b":"Şam-Haleb yolu","c":"Şam-Anadolu-Karadeniz-Kırım yolu","d":") Hârezm’den Hazarlar’a ve Bulgarlara giden yol","e":"Semerkant’dan İran’a giden yol"},"c":"d"},
{"id":595,"d":"ilk-turk-islam","u":6,"n":152,"q":"Abbasîlerin işbaşına gelmelerinden sonra Türk-Arap ilişkilerinde aşağıdakilerden hangisi gerçekleşmemiştir.","o":{"a":"Türklerle Araplar arasındaki ilişkiler düzelmiştir.","b":"Türklerin İslâmiyet’i benimsemeleri daha kolay olmuştur.","c":"Abbasî Devleti’nde Türk kumandanlar önemli mevkilere getirilmişlerdir.","d":"Türklere yine yeterince maaş verilmemiştir.","e":"Türklere eşit muamele gösterilmiştir."},"c":"d"},
{"id":596,"d":"ilk-turk-islam","u":6,"n":153,"q":"Abbasî Halifeleri, Türkleri daha çok hangi alanda istihdam etmişlerdir?","o":{"a":"Siyasî","b":"Askerî","c":"Malî","d":"Saray hizmetleri","e":"İdarî"},"c":"b"},
{"id":597,"d":"ilk-turk-islam","u":6,"n":154,"q":"I. Emevî Kumandanı Müslim Taşkent üzerine yürüdü fakat Türgeş hakanı Su-lu’nun direnç göstermesi karşısında geri çekilmek zorunda kaldı. II. Onları takip eden Türk askerleri Seyhun nehri kıyısında Emevî ordusuna yetişti ve Arap ordusuyla savaştı III. Müslüman Araplar ağır kayıplar verdiler ve Hucend’e geri çekildiler. IV. Bu olaylar Mâverâünnehr’deki Müslüman hâkimiyetini oldukça sarstı. Türkler kaybettikleri toprakları geri almak için seferber oldular. Yukarıda verilen bilgiler bizi Türklerle Araplar arasında yapılan hangi savaşa götürmelidir?","o":{"a":"Talas","b":"Nihavend","c":"Yevmü’l-Atş","d":"Kadisiye","e":"Yermük"},"c":"c"},
{"id":598,"d":"ilk-turk-islam","u":6,"n":155,"q":"Türlerle Araplar arasındaki savaşlar son bulduğunda iki taraf arasındaki ilişkiler hangi alanda gelişme göstermiştir?","o":{"a":"Ticaret","b":"Askerlik","c":"Siyaset","d":"Ziraat","e":"Turizm"},"c":"a"},
{"id":599,"d":"ilk-turk-islam","u":6,"n":156,"q":"Mu’tasım’ın halifeliği döneminde Araplar ve İranlılar yönetimdeki nüfuzlarını büyük ölçüde kaybetmişler, orduda egemen unsur olan Türkler devletin mukadderâtına tesir edecek seviyeye gelmişlerdi. Kaynaklar Mu’tasım devrinde Türk ordusunun sayısı hakkında 18.000 ile 70.000 arasında farklı rakamlar vermektedir. Bununla beraber hilâfet ordusunda görev alan Türklerin sayısının 20-25.000 civarında olduğu aileleriyle beraber 70.000’e yaklaştığı tahmin edilebilir. Aşağıdakilerden hangisi yukarıda verilen bu bilgiyle ilgili olamaz","o":{"a":"Abbâsîlerin Türklere değer verdiği anlaşılıyor","b":"Türklerin Bağdâd’ta kalabalık olması Araplar arasında huzursuzluğa yol açıyor","c":"Bu yüzden Türkler için Samarrâ kenti kuruluyor","d":"Bu tarihlerden itibaren Türkler Abbâsîler devleti yönetimini ele geçirmeye başlıyorlar","e":"Türklerin sayısı iyice artınca Abbâsî Halifeleri onları Suriye’ye sürgün ettiler"},"c":"e"},
{"id":600,"d":"ilk-turk-islam","u":6,"n":157,"q":"Aşağıdakilerden hangisi Abbâsî Devleti’nde Türklerin sayılarının artması ve en etkili makamları ellerinde bulundurmalarına karşı alınan tedbirlerden biri olamaz?","o":{"a":"Türk Devlet adamları hile ile katledildi","b":"Türkleri destekleyen Mu’tasım tahtından indirilmeye çalışıldı","c":"Türklere karşı kamuoyu oluşturularak nüfuzları kırılmaya çalışıldı","d":"Bazı Türk kumandanları uzak eyaletlere görevlendirilerek merkezden uzaklaştırılmaya çalışıldı","e":"Arap halkı Türklere karşı ayaklanma başlattı"},"c":"e"},
{"id":601,"d":"ilk-turk-islam","u":6,"n":158,"q":"Halife Mütevekkil, Türkler aleyhinde faaliyetlerde bulunarak onları muhafız birliklerinden uzaklaştırmaya, sayılarını azaltmaya ve hatta onların yerine orduya başka unsurlar almaya başladı. Mütevekkil’in kendileri aleyhindeki bu faaliyetlerinden rahatsız olan Türkler onu öldürmeye kalktılar ancak yine bir Türk olan Boğa el- Kebir’in müdahalesiyle başarısız oldular. Ancak daha sonra Boğa es-Sağir, Musa b. Boğa el-Kebir, Hârun b. Suvartegin, Bagir et-Türkî gibi Türk kumandanlar 861 yılında Halife Mütevekkil’i katlettiler. Yukarıda anlatılan bu olaydan çıkarılabilecek en doğru sonuç hangi şıkta verilmiştir?","o":{"a":"Bu olay Türkler’in Abbasî Halifeliği’nde iktidarı tamamen ele geçirdiklerini ve kendilerine mâni olacak bir gücün bulunmadığını gösterir.","b":"Türkler arasında birlik olmadığını gösterir","c":"Türklerin henüz Abbâsîlere tam olarak nüfuz edemediklerini gösterir","d":"Türklerin kural tanımadıklarını gösterir","e":"Abbâsî iktidarından memnun olmadıklarını gösterir"},"c":"a"},
{"id":602,"d":"ilk-turk-islam","u":6,"n":159,"q":"Aşağıdakilerden hangisi Türklerin Abbâsî Devleti’ndeki nüfuzlarının zayıflamasına neden oldu?","o":{"a":"Sâmarrâ şehrinin kurulması","b":"Bağdâd şehrinin kurulması","c":"Harun er-Reşid’i halife olması","d":"Başkentin 889/890 yılında Sâmarrâ’dan Bağdâd’a nakledilmesi","e":"Mu’tasım’ın Halifeliği’nin son bulması"},"c":"d"},
{"id":603,"d":"ilk-turk-islam","u":6,"n":160,"q":"Halife Radî-Billah, İbn Râik el-Hazârî’yi geniş yetkilerle emîrü’l-ümerâ tayin edince Türk nüfuzu yeniden kuvvetlendi. Bu durum Beckem ve Tüzün’ün emîrül-ümerâ olduğu dönemde de devam etti. 945 yılında Bağdad Şiî Büveyhîler tarafından işgal edildi. Abbasî Halifeliği yıkılışın eşiğine geldi. Bu asırda Abbâsîleri yıkılışın eşiğinden kimler kurtardı?","o":{"a":"Gazneliler","b":"Selçuklular","c":"Karahanlılar","d":"Türk Kumandanlar","e":"İranlılar"},"c":"b"},
{"id":604,"d":"ilk-turk-islam","u":6,"n":161,"q":"Türklerin Emevîler Devleti’ne hizmetleri daha çok hangi alanda olmuştur?","o":{"a":"Siyasî","b":"Ekonomik","c":"Askerî","d":"Sanat","e":"Zanaat"},"c":"c"},
{"id":605,"d":"ilk-turk-islam","u":6,"n":162,"q":"Türkler Abbâsîler Devleti’nde aşağıdaki alanlardan hangisinde hizmet vermediler?","o":{"a":"Dîvân Teşkilatı’nda","b":"İsyanların bastırılmasında","c":"Askerî alanda","d":"Devlet içinde çıkan karışıklıkların önlenmesinde","e":"Sanat alanında"},"c":"e"},
{"id":606,"d":"ilk-turk-islam","u":6,"n":163,"q":"Abbâsî Halifesi Mu‛tasım devrinde, Eşnâs et-Türkî Mısır valiliğinde bulundu. Eşnâs’ın ölümü üzerine İnak et-Türkî Mısır valiliğine getirildi. Mütevekkil devrinde İnak Yemen valisi iken Kûfe ve Hicaz valilikleri de onun uhdesine verildi. Mütevekkil devrinde yine bir Türk olan Feth b. Hakan Mısır valiliğine getirildi. Müzahim b. Hakan Uzcur et-Türkî de Mısır valiliği görevinde bulunmuştur. Yukarıda verilen bilgiden hangi sonuç çıkarılabilir?","o":{"a":"Türklerin siyasî alanda Abbâsî Devleti’ne hizmette bulunduğu","b":"Türklerin askerî alanda Abbâsî Devleti’ne hizmette bulunduğu","c":"Türklerin idareci özelliklerinin bulunmadığı","d":"Abbâsîlerin Türk devlet adamlarına güvenmediği","e":"Türklerin askerlikten başka bir alanda faaliyet gösteremediği"},"c":"a"},
{"id":607,"d":"ilk-turk-islam","u":6,"n":164,"q":"Aşağıdakilerden hangisi Türklerin İslâmiyet’i benimsemelerinin sonuçlarından biri sayılamaz?","o":{"a":"Türklerin millî bünyesine, ruh ve karakterine uyan İslâm dinini kabul etmeleri onlara yeni bir atılım gücü kazandırdı","b":"Millî varlıklarını muhafaza etmelerinde önemli rol oynamıştır.","c":"Türkler bu yeni dinden aldıkları enerji ile Asya steplerinden Avrupa içlerine kadar çok geniş bir alanda hâkimiyet kurmayı başarmışlardır.","d":"Türklerin İslâmiyet’i kabulü sadece Türk ve İslâm tarihinde değil aynı zamanda dünya tarihinde de bir dönüm noktası teşkil eder. Türklerin İslâmiyeti kabulü kavimler göçü ve Haçlı seferleriyle birlikte Ortaçağ’ı karakterize eden üç büyük olaydan biridir.","e":"Türklerin İslâmiyet’i kabulü diğer dinlerin zayıflamasına yol açmıştır"},"c":"e"},
{"id":608,"d":"ilk-turk-islam","u":6,"n":165,"q":"Emevîlerin başlangıçtan beri takip ettiği politika Türkleri ve diğer kavimleri İslâmiyet’e ısındırmak şöyle dursun nefret ettiriyordu. Aşağıdakilerden hangisi Emevîler zamanında Türklerin İslâmiyet’i benimsemeleri önündeki engellerden biri olamaz?","o":{"a":"Gayr-i Arap Müslüman ahâli Müslüman oldukları halde kendilerinden vergi alınmaya devam ediliyordu","b":"Arap olmayan Müslüman süvarilere, Arap süvarilerinden daha az maaş ödeniyordu","c":"Arap olmayan Müslümanlara ganimetten daha az pay veriliyordu","d":"Emevîler, Arap olmayan müslüman unsurlara devlet kademelerinde pek fazla yer vermiyorlardı","e":"Emevî valisi Kuteybe b. Müslim, camiye gelen Türklere çeşitli hediyeler veriyordu"},"c":"e"},
{"id":609,"d":"ilk-turk-islam","u":6,"n":166,"q":"Ömer b. Abdülaziz’in Emevî halifeleri arasında farklı ve seçkin bir yeri vardır. O Emevîler’in umûmî politikasına yani Arap milliyetçiliğine dayanan siyasetine karşı çıkmış ve bütün tebaya eşit muamele eden bir siyaset takip etmiştir. Onun takip ettiği siyaset bütün İslâm ülkelerinde müspet sonuçlar doğurmuştur. Çünkü o valilere gönderdiği mektuplarda bütün insanlara iyi davranılmasını, Müslüman olanlardan asla vergi alınmamasını istiyordu. Bu sayede özellikle Mâverâünnehir bölgesindeki Türkler arasında İslâmiyet daha büyük bir hızla yayılmaya başladı. Ömer b. Abdülaziz’in 720 yılında ölümü üzerine aşağıdaki durumlardan hangisi gerçekleşmiştir?","o":{"a":"Emevî Devleti Ömer b. Abdülaziz’den önce uyguladığı eski politikasına döndü.","b":"Emevî Devleti yıkıldı.","c":"Emevî Devleti bir daha eski politikasına geri dönmedi.","d":"Abbâsîler isyan ettiler.","e":"Türkler Emevî Devleti’nde etkin olmaya başladılar."},"c":"a"},
{"id":610,"d":"ilk-turk-islam","u":6,"n":167,"q":"I.Mevâliye karşı izlenen sert politikanın değişmesi II.Gayri Arap halka iyi davranmaya başlaması III. Horasan ve Mâverâünnehir’de İslâmiyet’in hızla yayılması IV. Ebû Ca’fer el-Mansûr’un İslâmiyet’i kabul edenlerden asla cizye alınmamasını istemesi V.751 yılında meydana gelen Talas Savaşı’nda Türkler’le Müslümanların yakınlaşmasına ve İslâmiyet’i benimsemelerine uygun bir ortam hazırlanması Yukarıda maddeler halinde verilen bilgiler hangi dönemde gerçekleşti?","o":{"a":"Emevîler Devri’nde","b":"Abbâsîler Devri’nde","c":"Dört Büyük Halife Devri’nde","d":"Selçuklular Devri’nde","e":"Karahanlılar Devri’nde"},"c":"b"},

{"id":612,"d":"ilk-turk-islam","u":6,"n":169,"q":"Yeni bir dinin kabulü milletlerin hayatını olumlu ya da olumsuz yönde etkileyen önemli faktörlerden biri kabul edilmektedir. Milletler kabul ettikleri bu yeni din sayesinde ya varlıklarına güç katarak dünyanın sayılı milletlerinden biri olma vasfını kazanmakta ya da millî benliklerini kaybetmektedirler. Bunun en belirgin örneğini Türk milletinin tarihinde bulmaktayız. Türkler tarih boyunca milli dinlerini terk ederek Budizm, Maniheizm, Yahudilik ve Hristiyanlık gibi dinleri benimsemişlerdir. Aşağıdakilerden hangisi bu durumun sonucunu göstermektedir?","o":{"a":"Bu dinlerin yapısı Türklerin millî bünyesine ve karakterine uymadığı için onların benliklerini ve Türklüklerini kaybetmesine sebep olmuştur.","b":"Bu dinleri benimseyen Türkler tarihte uzun ömürlü devletler kurdular","c":"Bu dinlere giren Türkler asla benliklerini ve kimliklerini kaybetmediler","d":"Bu dinleri benimseyen Türklerin pek azı kimliklerini kaybettiler","e":"Bu dinleri benimseyen Türkler her zaman başarılı oldular"},"c":"a"},

{"id":806,"d":"denizcilik","u":3,"n":107,"q":"II. Murad dönemi Osmanlı-Venedik Savaşları sürecine dair verilen bilgilerden hangisi yanlıştır?","o":{"a":"Osmanlılar Eğriboz Adası'nı ele geçirmiştir.","b":"Venedik donanmasına Andrea Mocenigo kumandanlık etmiştir.","c":"Osmanlılar Selanik şehrini ele geçirmiştir.","d":"1423-1430 yılları arasında cereyan etmiştir.","e":"Venedik Cumhuriyeti daha ziyade Gelibolu'yu hedef almıştır."},"c":"a","ex":"Cevap: A) Osmanlılar Eğriboz Adası’nı ele geçirmiştir. Açıklama: Eğriboz Adası Osmanlılar tarafından II. Murad döneminde değil, daha sonraki süreçte ele geçirilmiştir."},
{"id":807,"d":"denizcilik","u":3,"n":108,"q":"II. Mehmed kara kuşatmasını başlattığı ilk günden itibaren donanmasını da İstanbul sahillerine yerleştirmişti. …… idaresindeki Osmanlı donanması bugün………… diye bilinen yerde demirlemişti. Böylece boğaz geçişi tamamen kontrol altında alındı. Yukarıdaki boşluklara sırasıyla aşağıdaki ifadelerden hangisi getirilmelidir?","o":{"a":"Kara Hoca Kapudan - Karaköy","b":"Çalı Bey - Baba Burnu","c":"Karıştıran Süleyman Bey - Galata","d":"Baltaoğlu Süleyman Bey - Balta Limanı","e":"Çaka Bey - Çanakkale"},"c":"d","ex":"Cevap: D) Baltaoğlu Süleyman Bey – Balta Limanı Açıklama: II. Mehmed döneminde İstanbul kuşatmasında Osmanlı donanması Balta Limanı’na yerleşmişti ve Baltaoğlu Süleyman Bey komutanlık yapmıştır."},
{"id":808,"d":"denizcilik","u":4,"n":109,"q":"Karadeniz kıyısında yer alan aşağıdaki şehirlerden hangisi II. Mehmed döneminde feth edilmiştir?","o":{"a":"Trabzon","b":"Vize","c":"Kili","d":"Samsun","e":"Akkirman"},"c":"a","ex":"Cevap : A) Trabzon Açıklama : II. Mehmed (Fatih), 1461 yılında Trabzon Rum İmparatorluğu’na son vererek Trabzon’u Osmanlı topraklarına katmıştır. Bu fetih, Karadeniz’in bir Türk gölü haline gelmesi yolundaki en önemli adımlardan biridir."},
{"id":809,"d":"denizcilik","u":4,"n":110,"q":"1503 Ahidnamesi’ne göre Venedikliler Kefalonya kendilerinde kalmak şartıyla….. şehrini Osmanlılara bırakıyordu. Yukarıdaki boşluğa aşağıdaki ifadelerden hangisi getirilemez?","o":{"a":"Modon","b":"İnebahtı","c":"Midilli","d":"Koron","e":"Drça"},"c":"c","ex":"Cevap : C) Midilli Açıklama : 1503 Ahidnamesi, Mora ve çevresindeki kale şehirlerini (Modon, Koron, İnebahtı ve Drça/Navarin) kapsıyordu. Midilli ise bu tarihten çok önce, II. Mehmed döneminde bizzat fethedilmiş olup bu antlaşmanın konusu olan bırakılan şehirler arasında değildir."},
{"id":810,"d":"denizcilik","u":4,"n":111,"q":"Osmanlı arşivinde yer alan…… tersanede yapılan harcamaları detaylı bir biçimde gösteriyor oluşu dolayısıyla tersanenin yapısı hakkında bilgi verici niteliktedirler. Yukarıdaki cümlede boş bırakılan yere aşağıdaki ifadelerden hangisi getirilmelidir?","o":{"a":"Düvel-i Ecnebiye Defterleri","b":"Muhasebe Defterleri","c":"Ruus Defterleri","d":"Şer'iyye Sicilleri","e":"Name-i Hümayun Defterleri"},"c":"b","ex":"Cevap : B) Muhasebe Defterleri Açıklama : Tersanede gemi inşası, onarım ve malzeme alımları gibi tüm mali harcamalar “Muhasebe Defterleri”nde detaylı olarak tutulurdu. Bu kayıtlar, tersanenin işleyişi ve mali kapasitesi hakkında en güvenilir verileri sunar."},
{"id":811,"d":"denizcilik","u":4,"n":112,"q":"Aşağıdakilerden hangisi 1701 tarihli Bahriye Kanunnamesi ile yapılan düzenlemelerden biridir?","o":{"a":"Donanmadaki kalyon sayısı en az kırk olarak belirlenmiştir.","b":"Cezayir-i Bahr-i Sefid eyaleti kaldırılmıştır.","c":"İmparatorlukta tek bir tersanenin bulunması kararlaştırılmıştır.","d":"Derya beylerine peksimet verilmesi uygulaması başlamıştır.","e":"Tüm vezirlere kaptan-ı derya olmanın yolu açılmıştır."},"c":"a","ex":"Cevap : A) Donanmadaki kalyon sayısı en az kırk olarak belirlenmiştir. Açıklama : 1701 Kanunnamesi ile Osmanlı donanmasının ana gücü kalyonlara dayandırılmış ve sürekli hazırda tutulması gereken kalyon sayısı kırk olarak tescil edilmiştir."},
{"id":812,"d":"denizcilik","u":4,"n":113,"q":"Osmanlı İmparatorluğu topraklarında ticaret yapma hakkı en eskiye uzanan devlet Venedik Cumhuriyeti idi. Önceleri bütün ecnebi devletler Venedik bayrağı altında ticaret yapabilme hakkına sahipken XVI. yüzyılda ilk defa ….. müstakil ticaret yapma müsaadesi aldı, onu daha sonra ….. izledi. Yukarıda yer alan cümledeki boşluklara sırasıyla aşağıdaki ifadelerden hangisi getirilmelidir?","o":{"a":"Avusturya - İngiltere","b":"Cenova - İspanya","c":"Fransa - İspanya","d":"Fransa - İngiltere","e":"Floransa - Fransa"},"c":"d","ex":"Cevap : D) Fransa – İngiltere Açıklama : XVI. yüzyılda Venedik tekelinden sonra Osmanlı’dan müstakil ticaret hakkı (kapitülasyon) alan ilk büyük devlet Fransa, onu takip eden ise İngiltere olmuştur."},

{"id":814,"d":"denizcilik","u":4,"n":115,"q":"Aşağıdakilerden hangisi 18. yüzyılda Osmanlı bahriyesinde yapılan yenileşme girişimleri kapsamında değerlendirilemez?","o":{"a":"Yeni tekniklerle gemi inşasına başlanması","b":"Bahriye Nezareti'nin kurulması","c":"Fransız gemi mimarlarının tersaneye davet edilmesi","d":"Tersane'de büyük havuzun inşası","e":"Hendesehane'nin açılması"},"c":"b","ex":"Cevap : B) Bahriye Nezareti’nin kurulması Açıklama : 18. yüzyılda Hendesehane ve kuru havuz inşası gibi teknik yenilikler yapılmıştır. Ancak Bahriye Nezareti’nin kurulması, Osmanlı bürokrasisindeki modernleşme süreci kapsamında 19. yüzyılda (1867) gerçekleşmiştir."},
{"id":815,"d":"denizcilik","u":4,"x":[6],"n":116,"q":"Kürekle hareket eden gemilerden hangisi en üst düzey deniz komutanlarının kullandığı savaş gemisidir?","o":{"a":"Burtun","b":"Mavna","c":"Palaşkerme","d":"Baştarda","e":"Kalyata"},"c":"d","ex":"Cevap : D) Baştarda Açıklama : Baştarda, kürekli gemiler (çektiriler) arasında en büyük olanıdır ve geleneksel olarak Kaptan-ı Derya ve diğer yüksek rütbeli amirallerin sancak gemisi olarak kullanılmıştır."},
{"id":816,"d":"denizcilik","u":4,"n":117,"q":"Aşağıdakilerden hangisi yelkenli gemi türleri arasında yer almaz?","o":{"a":"Karavele","b":"Kalyon","c":"Barça","d":"Burtun","e":"Kalyata"},"c":"e","ex":"Cevap : E) Kalyata Açıklama : Karavele, kalyon, barça ve burtun yelken gücüyle hareket eden büyük gemi türleridir. Kalyata ise hem kürek hem yelkenle hareket edebilen ancak esas olarak çektiri (kürekli gemi) sınıfına giren daha küçük bir gemidir."},
{"id":817,"d":"denizcilik","u":4,"n":118,"q":"Aşağıdakilerden hangisi Osmanlıların yelkenli gemilerle yaptıkları son büyük donanma savaşıdır?","o":{"a":"İnebahtı Savaşı","b":"Çeşme Savaşı","c":"Navarin Savaşı","d":"Mora Seferi","e":"Koyunadaları Muharebeleri"},"c":"c","ex":"Cevap : C) Navarin Savaşı Açıklama : 1827 yılındaki Navarin Savaşı, yelkenli ahşap gemilerin (kalyonların) yer aldığı son büyük çaplı deniz muharebesidir. Bu savaştan sonra dünya denizciliğinde ve Osmanlı bahriyesinde buharlı gemilere geçiş süreci hızlanmıştır."},
{"id":818,"d":"denizcilik","u":4,"n":119,"q":"Osmanlıların ilk çektirisi olan….. gemisi, daha sonraları nakliyede kullanılan bir buçuk direkli, sivri üçgen yelkenli, yarım güverteli küçük teknelerden ibaretti. Yukarıda verilen cümlede yer alan boşluğa aşağıdaki ifadelerden hangisi getirilmelidir?","o":{"a":"karamürsel","b":"pereme","c":"firkate","d":"baştarda","e":"şayka"},"c":"a","ex":"Cevap : A) karamürsel Açıklama : Karamürsel gemisi, Osmanlı denizciliğinin erken dönemlerinde inşa edilen hafif ve hızlı bir çektiri türüdür. Genellikle nakliye işlerinde kullanılan bu küçük tekneler, yarım güverteli ve sivri üçgen yelkenli yapılarıyla bilinir."},
{"id":819,"d":"denizcilik","u":4,"n":120,"q":"Osmanlı deniz tarihinde gemiciliğin gelişimini üç ayrı dönemde incelemek gerekmektedir: Birincisi, İmparatorluğun kuruluşundan XVII. yüzyılın ikinci yarısına kadar devam eden kürekli gemiler dönemi, ikincisi XIX. yüzyılın ortalarına kadar devam eden ….. dönemi, üçüncüsü de İmparatorluğun yıkılışına kadar süren buharlı gemiler dönemidir. Yukarıdaki cümlede boş bırakılan yere aşağıdaki ifadelerden hangisi getirilmelidir?","o":{"a":"direkli gemiler","b":"yelkenli gemiler","c":"ambarlı gemiler","d":"ahşap gemiler","e":"firkateler"},"c":"b","ex":"Cevap : B) yelkenli gemiler Açıklama : Osmanlı bahriyesi sırasıyla; kürekli gemiler (kadırga dönemi), yelkenli gemiler (kalyon dönemi) ve buharlı gemiler olmak üzere üç temel teknik safhadan geçmiştir."},
{"id":820,"d":"denizcilik","u":4,"n":121,"q":"Aynı zamanda Donanma-yı Hümâyun ricalinden olan ….. Kaptan-ı Derya’dan sonra Tersane’nin birinci hâkimidir. Yukarıdaki cümlede boş bırakılan yere aşağıdaki ifadelerden hangisi getirilmelidir?","o":{"a":"Derya Beyi","b":"Babüssaade Ağası","c":"Tersane Ağası","d":"Tersane Kethüdası","e":"Tersane Emini"},"c":"d","ex":"Cevap : D) Tersane Kethüdası Açıklama : Tersane Kethüdası, Kaptan-ı Derya’nın ardından tersanenin idari ve teknik yönetiminden sorumlu olan en yüksek kıdemli görevlidir. Tersane disiplini ve gemi inşasının takibinde birinci derecede yetkilidir."},
