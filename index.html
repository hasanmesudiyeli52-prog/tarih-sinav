{"id":2128,"d":"somurgecilik","u":5,"x":[3,4],"n":91,"q":"Aşağıdakilerden hangisi Kuzey Amerika’daki On Üç Koloni’nin İngiltere Krallığının uygulamaya koyduğu yeni vergilere yönelik itirazlarının gerekçelerinden biridir?","o":{"a":"İngiliz kralının meşru yönetici kabul edilmemesi","b":"İngilizlerin kolonilerde fazla asker bulundurmaları","c":"Kolonilerde eğitime yeterince önem verilmemesi","d":"İngiliz parlamentosunda temsil edilmemeleri","e":"İngiliz valisinin yetkisini aşması"},"c":"d","ex":"Cevap : D) İngiliz parlamentosunda temsil edilmemeleriAçıklama : Amerikan kolonistlerinin temel argümanı, kendilerini vergilendirme yetkisine sahip olan İngiliz Parlamentosu’nda seçilmiş temsilcilerinin bulunmamasıydı. Bu durum, “temsil olmadan vergi olmaz” (no taxation without representation) sloganıyla özetlenmiştir."},
{"id":2129,"d":"somurgecilik","u":5,"n":92,"q":"Afrika’da sömürge toprağı elde edilmesi yönünde kamuoyundan gelen talep ve faaliyetlerin ilk dönemde, çeşitli gerekçelerle hükûmet tarafından ihtiyatla karşılandığı ülke aşağıdakilerden hangisidir?","o":{"a":"Belçika","b":"Almanya","c":"ABD","d":"Rusya","e":"Japonya"},"c":"b","ex":"Cevap : B) AlmanyaAçıklama : Almanya Şansölyesi Otto von Bismarck, başlangıçta sömürgeciliğin Almanya için maliyetli bir macera olacağını ve Avrupa’daki dengeleri bozacağını düşünerek bu yöndeki taleplere uzun süre ihtiyatla yaklaşmıştır."},
{"id":2130,"d":"somurgecilik","u":5,"n":93,"q":"Bugünkü Nijerya’nın batısı ve kuzeyinde ortaya çıkan ve zamanla Batı Afrika’nın en büyük devletlerinden biri konumuna yükselen, 18. yüzyıldan itibaren hanedan çekişmesi nedeniyle zayıflayarak 1888’de İngiliz protektorasına dönüşmüş olan devlet aşağıdakilerden hangisidir?","o":{"a":"Ndongo Krallığı","b":"Kasanze Krallığı","c":"Dahomey İmparatorluğu","d":"Oyo İmparatorluğu","e":"Aşanti İmparatorluğu"},"c":"d","ex":"Cevap : D) Oyo İmparatorluğuAçıklama : Yoruba halkı tarafından kurulan Oyo İmparatorluğu, 17. ve 18. yüzyıllarda güçlü süvari ordusu sayesinde Batı Afrika’nın en egemen güçlerinden biri haline gelmiş, ancak iç çekişmelerle zayıflayarak İngiliz sömürgeciliğine boyun eğmiştir."},
{"id":2131,"d":"somurgecilik","u":5,"n":94,"q":"Sahip oldukları altın rezervlerini erken tarihlerde tamamen tüketen Avrupalılar altın konusunda, coğrafi keşifler sürecinde ilk önce hangi kıtaya yönelmişlerdir?","o":{"a":"Güney Amerika","b":"Avustralya","c":"Kuzey Amerika","d":"Asya","e":"Afrika"},"c":"e","ex":"Cevap : E) AfrikaAçıklama : Coğrafi keşiflerin ilk aşamasında, özellikle Portekizli denizciler, Afrika’nın batı kıyıları boyunca ilerleyerek buradaki krallıkların zengin altın kaynaklarına ulaşmayı ve bu ticareti kontrol etmeyi hedeflemişlerdir. “Altın Sahili” adı bu dönemin bir yansımasıdır."},
{"id":2132,"d":"somurgecilik","u":5,"x":[3,4],"n":95,"q":"Aşağıdakilerden hangisi 1857 Hindistan Bağımsızlık Savaşı’nın yakın sebebidir?","o":{"a":"Hintli sipahi askerlerine inek yağı kullanılan kartuşlar verilmesi","b":"İngiliz mallarının Hint pazarını istilası","c":"İngiliz idaresinin baskıcı tutumu","d":"İngiliz idaresinin dinî hayata yönelik kısıtlamaları","e":"Vergi toplamada kullanılan zimandari sistemi"},"c":"a","ex":"Cevap : A) Hintli sipahi askerlerine inek yağı kullanılan kartuşlar verilmesiAçıklama : Diğer seçenekler isyanın genel ve altta yatan nedenleri olsa da, isyanı ateşleyen en yakın olay, İngiliz Doğu Hindistan Şirketi ordusundaki Hintli askerlere (sipahiler) dağıtılan yeni Enfield tüfeği fişeklerinin, ısırılarak açılması gereken kağıtlarının domuz ve inek yağı ile yağlandığı söylentisidir. Bu durum hem Müslüman hem de Hindu askerlerin dini inançlarına büyük bir hakaret olarak algılanmıştır."},
{"id":2133,"d":"somurgecilik","u":5,"x":[3,4],"n":96,"q":"Aşağıdaki devletlerden hangisi Hindistan ve Doğu Asya ile ticaretini, kurduğu bir şirket üzerinden yürütmemiştir?","o":{"a":"Avusturya","b":"Danimarka","c":"İsveç","d":"İspanya","e":"İngiltere"},"c":"d","ex":"Cevap : D) İspanyaAçıklama : İngiltere, Hollanda, Fransa gibi ülkeler Doğu ile ticaretlerini Doğu Hindistan Şirketleri aracılığıyla yürütürken, İspanya sömürge ticaretini doğrudan kraliyete bağlı “Casa de Contratación” (Ticaret Evi) gibi kurumlar aracılığıyla tekelden yönetmiştir."},
{"id":2134,"d":"somurgecilik","u":5,"n":97,"q":"Sömürgecilerin 19. yüzyılda Afrika’nın içlerine yaptıkları seyahatler hakkında aşağıdakilerden hangisi söylenemez?","o":{"a":"Seyahatler büyük oranda at sırtında gerçekleştirilmekteydi.","b":"Rehberler yerel halktan seçilmekteydi.","c":"Kalabalık gruplar halinde seyahat edilmekteydi.","d":"Yükler deve, öküz ve eşeklerle taşınmaktaydı.","e":"Tropik hastalıklar seyahatleri güçleştirmekteydi."},"c":"a","ex":"Cevap : A) Seyahatler büyük oranda at sırtında gerçekleştirilmekteydi.Açıklama : Afrika’nın iç bölgelerinin büyük bir kısmında, atlar ve diğer büyükbaş hayvanlar için ölümcül olan çeçe sineğinin yaydığı uyku hastalığı nedeniyle at kullanımı imkansızdı. Bu nedenle seyahatler genellikle yaya olarak ve yükler yerli taşıyıcılar tarafından taşınarak yapılıyordu."},
{"id":2135,"d":"somurgecilik","u":5,"n":98,"q":"Aşağıdakilerden hangisi, 1876 Brüksel Coğrafya Konferansı’nda kurulması kararlaştırılan Uluslararası Afrika Birliği’nin kamuoyuna ilan edilmeyen amacıdır?","o":{"a":"Bölgede koloniler kurulması","b":"Bölgenin uygarlaştırılması","c":"Kongo Irmağı’na kadar olan bölgede bilimsel merkezler kurulması","d":"Köleliğin kaldırılması için çalışılması","e":"Bölgenin insan, arazi ve kaynak yönünden incelenerek analiz edilmesi"},"c":"a","ex":"Cevap : A) Bölgede koloniler kurulmasıAçıklama : Belçika Kralı II. Leopold’ün öncülüğünde toplanan konferansın kamuoyuna açıklanan amaçları bilimsel keşif ve insani yardım gibi konular olsa da, asıl ve gizli amaç, Kongo Havzası’nı ele geçirerek burayı kişisel bir sömürgeye dönüştürmekti."},
{"id":2136,"d":"somurgecilik","u":5,"n":99,"q":"1854 yılında İngiltere’de Kraliyet Coğrafya Derneği tarafından John Hanning Speke ile birlikte Afrika’nın büyük göllerini keşfetmek üzere görevlendirilmiş, daha sonra aynı kişiyle Afrika’ya diğer bir seyahat daha yapmış, bu ikinci seyahatte Speke ile yaşadığı anlaşmazlık nedeniyle arası açılmış kâşif, haritacı ve oryantalist kimdir?","o":{"a":"Samuel Baker","b":"Henry Morton Stanley","c":"James Augustus Grant","d":"David Livingstone","e":"Richard F. Burton"},"c":"e","ex":"Cevap : E) Richard F. BurtonAçıklama : Paragrafta anlatılan, Nil Nehri’nin kaynağını aramak üzere Speke ile birlikte meşhur keşif gezisini yapan, ancak daha sonra Nil’in kaynağının Victoria Gölü olduğu konusunda Speke ile şiddetli bir anlaşmazlığa düşen ünlü kaşif ve yazar Richard Francis Burton’dır."},
{"id":2137,"d":"somurgecilik","u":4,"n":100,"q":"“Afrika’ya üç keşif seyahati gerçekleştirmiştir. İlk iki seyahatini R. F. Burton’un liderliğinde üçüncü seyahati ise R. F. Burton ile aralarında çeşitli sebeplerden çıkan anlaşmazlıklardan kaynaklanan ve Nil Nehri’nin kaynağı üzerine yoğunlaşan tartışmalar arasında 1860 yılında müstakil olarak yapmıştır.” Yukarıdaki paragrafta bahsedilen İngiliz seyyah kimdir?","o":{"a":"David Livingstone","b":"Samuel Baker","c":"John Hanning Speke","d":"Henry Morton Stanley","e":"Verney Lovett Cameron"},"c":"c","ex":"Cevap : C) John Hanning Speke John Hanning Speke ve Afrika Keşifleri John Hanning Speke, 19. yüzyılda Afrika kıtasını keşfeden önemli İngiliz seyyahlardan biridir. En çok, Nil Nehri’nin kaynaklarını keşfetme çabalarıyla tanınır. Richard Francis Burton ile olan ilişkisi ve aralarındaki anlaşmazlıklar, Speke’nin Afrika keşiflerinde önemli bir rol oynamıştır"},
{"id":2138,"d":"somurgecilik","u":4,"n":101,"q":"Afrika’ya yönelik Hristiyan misyonerlik faaliyetleri hakkında aşağıdakilerden hangisi yanlıştır?","o":{"a":"Sömürgeci bazı devletler misyonerlik teşkilatlarından yararlanmak istemişlerdir.","b":"Bölgeye yönelik misyonerlik faaliyetleri 19. yüzyılda başlamıştır.","c":"Bölgedeki yöneticilerin Hristiyanlaştırılmasına önem verilmiştir.","d":"Misyoner örgütleri Afrika’ya yönelik keşif seyahatlerini desteklemişlerdir.","e":"Afrika kıtasının bazı yerlerinde olumlu karşılanmıştır."},"c":"b","ex":"Cevap : B) Bölgeye yönelik misyonerlik faaliyetleri 19. yüzyılda başlamıştır. Hristiyan Misyonerlik Faaliyetlerinin Yanılgısı: 19. Yüzyıl Başlangıcı Afrika’ya yönelik Hristiyan misyonerlik faaliyetlerinin 19. yüzyılda başladığına dair yaygın bir yanılgı vardır. Aslında, bu faaliyetler çok daha önceye, hatta 15. ve 16. yüzyıllara dayanır. Ancak, 19. yüzyılda Avrupa’nın sömürgeleştirme süreciyle birlikte misyonerlik faaliyetleri daha sistemli ve yoğun bir hale geldi. Bu dönemde, Hristiyan misyonerler hem dini yayma çabaları hem de Batılı güçlerin Afrika’da nüfuz ve kontrol kurma stratejileriyle ilişkilendirildi. Misyonerlerin eğitim ve sağlık hizmetleri sunması, bazı durumlarda yerel halk tarafından olumlu karşılansa da, bu faaliyetler genellikle Batılı emperyalizmin bir uzantısı olarak görüldü"},
{"id":2139,"d":"somurgecilik","u":4,"x":[7],"n":102,"q":"Hollandalı tüccarlar tarafından 1602’de kurulan Birleşik Doğu Hindistan Şirketi için aşağıdakilerden hangisi söylenemez?","o":{"a":"Mahalli hükümdarlarla antlaşma yapma yetkisine sahipti.","b":"Güney Amerika’dan Macellan Boğazı’na kadar olan bölgede ticaret yapma tekeli vardı.","c":"Hükümet adına savaş açma yetkisi vardı.","d":"Hollanda’ya bağlı özerk bir devlet gibi faaliyet göstermiştir.","e":"Askerî amaçlı müfrezeler kullanıp kaleler inşa etme hakkı vardı."},"c":"b","ex":"Cevap : B) Güney Amerika’dan Macellan Boğazı’na kadar olan bölgede ticaret yapma tekeli vardı. Birleşik Doğu Hindistan Şirketi’nin Özellikleri 1602’de kurulan Birleşik Doğu Hindistan Şirketi, Hollandalı tüccarlar tarafından yönetilmiş ve özerk devlet benzeri yetkilere sahip olmuştur. Ancak, Güney Amerika’dan Macellan Boğazı’na kadar olan bölgede ticaret yapma tekeli bu şirketin elinde değildi."},
{"id":2140,"d":"somurgecilik","u":4,"n":103,"q":"Amerika Birleşik Devletleri Filipinler, Küba ve Porto Riko’yu 19. yüzyılın sonunda aşağıdaki sömürgeci ülkelerden hangisiyle giriştiği savaşta ele geçirmiştir?","o":{"a":"Fransa","b":"İspanya","c":"İngiltere","d":"Almanya","e":"Hollanda"},"c":"b","ex":"Cevap : B) İspanya ABD’nin Sömürgeciliğe Adımı Amerika Birleşik Devletleri, 1898’deki İspanyol-Amerikan Savaşı sonucunda Filipinler, Küba ve Porto Riko’yu İspanya’dan ele geçirmiştir. Bu olay, ABD’nin sömürgecilik tarihinde önemli bir dönüm noktasını işaret eder ve ülkenin küresel politikada etkin bir güç olarak yükselişinin başlangıcını simgeler"},
{"id":2141,"d":"somurgecilik","u":4,"n":104,"q":"Paris merkezli Société de Géographie (Coğrafya Derneği) 1871 yılı sonrasında Fransa’nın koloni topraklarının genişletilmesi için çalışma kararını kamuoyuna aşağıdaki hangi ifadeyle takdim etmiştir?","o":{"a":"Sadece bilimsel değil ticari kaygılar da güdülmesi gerektiği","b":"Ekonomik çıkmazın daha fazla sömürgeyle aşılabileceği","c":"Barbarlık karşısında uygarlığın ilerlemesinin sağlanması","d":"Almanya karşısında alınan yenilgiden doğan maddi kayıpların telafi edilmesi","e":"Fransa’nın prestijinin artırılması"},"c":"c","ex":"Cevap : C) Barbarlık karşısında uygarlığın ilerlemesinin sağlanması Fransa’nın Koloni Politikası 1871 sonrasında, Fransa’nın koloni politikası, Société de Géographie tarafından “barbarlık karşısında uygarlığın ilerlemesi” olarak tanımlanmıştır. Bu, dönemin yaygın “medeniyet götürme” ideolojisinin bir parçası olarak görülmüştür"},
{"id":2142,"d":"somurgecilik","u":4,"n":105,"q":"Afrika’ya yönelik 19. yüzyılda gerçekleştirilen keşif seyahatlerini önceki dönemdeki benzerlerinden ayıran en önemli husus aşağıdakilerden hangisidir?","o":{"a":"Sistematik bir çalışmanın ürünü olmaları","b":"Seyahatler hakkında çok sayıda seyahatname kaleme alınması","c":"Yüksek başarı oranı","d":"Birçok yeni bölgenin keşfedilmesi","e":"Teknolojik birçok yeniliğin kullanılması"},"c":"a","ex":"Cevap : A) Sistematik bir çalışmanın ürünü olmaları Yüzyılın Keşif Seyahatleri yüzyılda gerçekleştirilen Afrika keşif seyahatleri, önceki dönemlerin keşiflerinden farklı olarak daha sistematik ve planlı yapılmıştır. Bu seyahatler, bilimsel araştırmalar ve coğrafi keşifler açısından önemli bilgiler sağlamış ve Afrika’nın daha önce bilinmeyen bölgelerine ışık tutmuştur"},
{"id":2143,"d":"somurgecilik","u":4,"n":106,"q":"Belçika Kralı II. Leopold’ün Henry Morton Stanley’i Kongo havzasına göndermesinin asıl amacı aşağıdakilerden hangisidir?","o":{"a":"Yerli halkların korunması için tedbirler almak","b":"Köle ticaretinin sona erdirilmesi için çalışmak","c":"Ticaretin geliştirilmesine çalışmak","d":"Kongo Nehri ve çevresinde hakimiyet tesis ettirmek","e":"Bölgede araştırma gezilerinde bulunmak"},"c":"d","ex":"Cevap : D) Kongo Nehri ve çevresinde hakimiyet tesis ettirmek Belçika Kralı II. Leopold ve Kongo Belçika Kralı II. Leopold, 19. yüzyıl sonlarında Henry Morton Stanley’i Kongo havzasına gönderdi. Bu hareketin gerçek amacı, Kongo Nehri ve çevresinde ekonomik ve siyasi hakimiyet kurmaktı. Bu süreç, Kongo’nun zengin doğal kaynaklarının sömürülmesine ve bölgenin kolonyal kontrol altına alınmasına yol açtı."},
{"id":2144,"d":"somurgecilik","u":4,"n":107,"q":"Daha önce Portekizlilerin müşterisi konumunda olup onlar adına ticaret yapmaktayken, bağımsızlığını elde ettikten sonra Portekiz’in sömürgelerini ele geçiren devlet aşağıdakilerden hangisidir?","o":{"a":"Almanya","b":"Hollanda","c":"İngiltere","d":"İtalya","e":"Fransa"},"c":"b","ex":"Cevap : B) Hollanda Hollanda’nın Sömürgecilik Yükselişi Hollanda, 17. yüzyılda bağımsızlığını kazandıktan sonra Portekiz’in öncülük ettiği ticaret yollarını ve sömürgelerini ele geçirmiştir. Bu, Hollanda’nın sömürgecilikte yükselişine ve özellikle deniz ticaretindeki hakimiyetine işaret eder ve Avrupa’nın sömürgecilik tarihinde önemli bir dönemi temsil eder"},
{"id":2145,"d":"somurgecilik","u":4,"n":108,"q":"“Hristiyanlık, ticaret ve uygarlık” sloganının savunucusu olan ve ismi Afrika’da köleliğe karşı çıkışıyla özdeşleşen seyyah kimdir?","o":{"a":"Henry Morton Stanley","b":"John Hanning Speke","c":"Richard F. Burton","d":"Carl Peters","e":"David Livingstone"},"c":"e","ex":"Cevap : E) David Livingstone David Livingstone ve Afrika David Livingstone, Afrika’da “Hristiyanlık, ticaret ve uygarlık” sloganının savunucusu olarak tanınır. Onun misyonerlik ve keşif çalışmaları, kıtada sömürgecilik karşıtı duruşuyla özdeşleşmiştir"},
{"id":2146,"d":"somurgecilik","u":4,"n":109,"q":"Almanya’nın Doğu Afrika’daki iki sömürgesi Ruanda ve Burundi I. Dünya Savaşı’nda aşağıdaki hangi ülkenin kontrolüne girmiştir?","o":{"a":"ABD","b":"İngiltere","c":"Belçika","d":"Fransa","e":"İtalya"},"c":"c","ex":"Cevap : C) Belçika Almanya’nın Doğu Afrika’daki iki sömürgesi Ruanda ve Burundi I. Dünya Savaşı’nda Belçika’nın kontrolüne geçti I. Dünya Savaşı sırasında, Almanya’nın Doğu Afrika’daki sömürgeleri Ruanda ve Burundi, savaşın sona ermesiyle Belçika’nın kontrolüne geçti. Bu durum, savaşın sonucunda imzalanan Versailles Antlaşması ve diğer barış anlaşmaları kapsamında gerçekleşti. Savaşın galip devletleri, Almanya’nın Afrika’daki sömürgelerini paylaştılar ve bu süreçte Ruanda ve Burundi, Belçika’nın manda yönetimi altına girdi. Bu, 20. yüzyıl Afrika tarihinde önemli bir dönüm noktasıydı ve bölgenin siyasi ve sosyal yapısını uzun vadede etkiledi"},
{"id":2147,"d":"somurgecilik","u":4,"n":110,"q":"Avrupalılarca uzun yıllar altınlarla dolu, zengin bir şehir olarak hayal edilen ancak Fransız seyyah René-uguste Caillié tarafından yapılan seyahat sonucunda şartlarının oldukça kötü olduğu anlaşılan Afrika şehri aşağıdakilerden hangisidir?","o":{"a":"Zengibar","b":"Gabon","c":"Tinbüktü","d":"Gondokoro","e":"Djenne"},"c":"c","ex":"Cevap : C) Tinbüktü Tinbüktü’nün Gerçek Yüzü Avrupa’da uzun yıllar boyunca zengin bir şehir olarak hayal edilen Tinbüktü, Fransız seyyah René-Auguste Caillié’nin 1828’de gerçekleştirdiği seyahat sonucunda gerçekte oldukça mütevazı bir yer olduğu ortaya çıkmıştır. Bu keşif, Afrika hakkındaki Avrupalı hayallerle gerçekler arasındaki büyük farkı gözler önüne sermiştir"},
{"id":2148,"d":"somurgecilik","u":4,"n":111,"q":"20. yüzyılın hemen başında Kongo’nun ihracatında ilk sırada yer alan ürün aşağıdakilerden hangisidir?","o":{"a":"Altın","b":"Fildişi","c":"Bakır","d":"Elmas","e":"Kauçuk"},"c":"e","ex":"Cevap : E) Kauçuk Kongo’nun Başlıca İhracat Ürünü 20. yüzyılın başlarında Kongo’nun ihracatında ilk sırayı kauçuk almıştır. Otomobil endüstrisinin yükselişiyle beraber kauçuk, uluslararası pazarda büyük bir talep gördü ve bu durum, Kongo’da yoğun sömürüye ve insan hakları ihlallerine yol açtı."},
{"id":2149,"d":"somurgecilik","u":7,"n":112,"q":"I- Bengale vali atanması II- Hindistan’da acentalar kurulması III- Kalküta ya İngiliz yargıçlar heyeti gönderilmesi IV- Hindistan’da vergi toplamaya başlanması Yukarıdaki ifadelere göre İngiliz dairesinin Hindistan’daki kurumsallaşma sürecini kronolojik olarak sıralayınız?","o":{"a":"II-IV-I-III","b":"III-I-II-IV","c":"IV-III-II-I","d":"IV-II-I-III","e":"II-I-III-IV"},"c":"a"},

/* ============ STATE ============ */
let course=COURSES[0].id, mode="test", unit=-1, idx=0, order=[], answers={}, answered={};
const ROUND=20;              // her test turu en çok 20 soru (sınav gibi)
const app=document.getElementById("app"), subEl=document.getElementById("sub");
const BYID={};QUESTIONS.forEach(q=>BYID[q.id]=q);
/* kalıcı kayıt: son ders + yanlışlar (telefonda kapatıp açınca kalır) */
const LS="tarih-sinav-v3";
let saved={course:null,wrong:{}};
try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s&&typeof s==="object")saved=Object.assign(saved,s);}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(saved));}catch(e){}}
if(saved.course&&COURSES.some(c=>c.id===saved.course))course=saved.course;

function C(){return COURSES.find(c=>c.id===course);}
function gname(u){const g=C().groups.find(g=>g[0]===u);return g?(g[2]||g[1]):"";}
function coursePool(){return QUESTIONS.filter(q=>q.d===course);}
function inUnit(q,u){if(u===0)return true;const gs=[q.u].concat(q.x||[]);const cb=(C().combos||{})[u];return cb?gs.some(g=>cb.includes(g)):gs.includes(u);}
function chipName(u){const ch=(C().chips||[]).find(x=>x[0]===u);return ch?ch[1]:gname(u);}
function pool(){const p=coursePool();return p.filter(q=>inUnit(q,unit));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* test turu: havuzdan karışık en çok 20 soru */
function startRound(){order=shuffle(pool().map(q=>q.id)).slice(0,ROUND);idx=0;order.forEach(id=>{delete answers[id];delete answered[id];});}
function answeredInRound(){return order.filter(id=>answered[id]).length;}
function roundRight(){return order.filter(id=>answers[id]===BYID[id].c).length;}
/* NET PUANLAMA: her doğru +5, 4 yanlış 1 doğruyu götürür, boş etkilemez */
function scoreInfo(){const right=roundRight();const wrong=answeredInRound()-right;const net=right-wrong/4;const puan=Math.max(0,net*5);return{right,wrong,net,puan};}
function fmt(x){return Number.isInteger(x)?String(x):x.toFixed(2).replace(/\.?0+$/,"");}
function wrongList(){return pool().filter(q=>saved.wrong[q.id]);}

/* header */
function renderHeader(){
  const c=C();
  document.getElementById("kicker").textContent=c.kicker;
  const w=c.name.split(" ");const last=w.pop();
  document.getElementById("title").innerHTML=(w.length?w.join(" ")+" ":"")+"<em>"+last+"</em>";
  document.title=c.name+" — "+c.kicker;
}
const courseEl=document.getElementById("course");
courseEl.innerHTML=COURSES.map(c=>`<option value="${c.id}">${c.name} · ${QUESTIONS.filter(q=>q.d===c.id).length} soru</option>`).join("");
courseEl.addEventListener("change",()=>{course=courseEl.value;saved.course=course;save();unit=-1;startRound();renderHeader();renderUnits();setMode("test");});

/* unit chips */
const unitsEl=document.getElementById("units");
function renderUnits(){
  const p=coursePool();
  const chips=C().chips||[[0,"Tümü"]].concat(C().groups.map(g=>[g[0],g[1]]));
  const defs=chips.filter(([v])=>v===0||p.some(q=>inUnit(q,v)));
  unitsEl.innerHTML=defs.length>2?defs.map(([v,l])=>`<button data-u="${v}" class="${v===unit?'on':''}">${l}</button>`).join(""):"";
  unitsEl.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{unit=+b.dataset.u;startRound();renderUnits();render();}));
}
/* Yenile: yeni karışık tur, baştan başla */
function yenile(){startRound();if(mode!=="test"){mode="test";document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.mode==="test"));}render();window.scrollTo({top:0,behavior:"smooth"});}

/* TEST */
function renderTest(){
  if(!order.length){app.innerHTML=`<div class="screen empty"><div class="big">✦</div><p>Bu bölümde soru yok.</p></div>`;return;}
  if(idx>=order.length)idx=order.length-1;
  const q=BYID[order[idx]];
  const isAns=answered[q.id], picked=answers[q.id];
  const s=scoreInfo();
  let opts="";
  for(const k of ["a","b","c","d","e"]){
    if(!q.o[k])continue;
    let cls="opt";
    if(isAns){if(k===q.c)cls+=" correct";else if(k===picked)cls+=" wrong";else cls+=" dim";}
    opts+=`<button class="${cls}" ${isAns?"disabled":""} onclick="pick('${k}')"><span class="lab">${k}</span><span>${q.o[k]}</span></button>`;
  }
  let explain="";
  if(isAns){const ok=picked===q.c;
    explain=`<div class="explain ${ok?"ok":"no"}"><div class="head">${ok?"✓ Doğru":"✕ Yanlış — Doğrusu: "+q.c.toUpperCase()}</div>${q.ex?`<div>${q.ex}</div>`:""}</div>`;}
  const last=idx===order.length-1;
  app.innerHTML=`<div class="screen">
    <div class="pbar-wrap"><div class="pbar"><i style="width:${(answeredInRound()/order.length)*100}%"></i></div><div class="pcount">${answeredInRound()}/${order.length}</div></div>
    <div class="qmeta"><span class="qnum">Soru ${idx+1} / ${order.length}</span><span class="utag">${gname(q.u)}</span><span class="lscore">${fmt(s.puan)} puan</span></div>
    <div class="card"><p class="qtext">${q.q}</p>${opts}${explain}</div>
    <div class="nav sticky"><button class="btn ghost" onclick="prev()" ${idx===0?"disabled":""}>‹</button>
    ${last?`<button class="btn primary" onclick="finish()">Sonucu Gör</button>`:`<button class="btn primary" onclick="next()">${isAns?"Sıradaki":"Atla"} ›</button>`}</div></div>`;
}
function pick(k){const q=BYID[order[idx]];if(answered[q.id])return;answers[q.id]=k;answered[q.id]=true;
  if(k!==q.c)saved.wrong[q.id]=1;else delete saved.wrong[q.id];save();
  renderTest();if(order.length&&order.every(id=>answered[id]))setTimeout(finish,700);}
function next(){if(idx<order.length-1){idx++;renderTest();}}
function prev(){if(idx>0){idx--;renderTest();}}

/* RESULT */
function finish(){
  const total=order.length,ans=answeredInRound();
  const {right,wrong,net,puan}=scoreInfo();
  const maxPuan=total*5;
  const pct=maxPuan?Math.round((puan/maxPuan)*100):0;
  const verdict=pct>=85?"Maşallah, hazırsın":pct>=65?"İyi gidiyor":pct>=45?"Biraz daha çalış":"Tekrar şart";
  const r=64,circ=2*Math.PI*r,off=circ-(Math.max(0,pct)/100)*circ;
  app.innerHTML=`<div class="screen result">
    <div class="ring"><svg width="148" height="148"><circle cx="74" cy="74" r="${r}" fill="none" style="stroke:var(--ring-track)" stroke-width="12"/>
    <circle cx="74" cy="74" r="${r}" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}" style="stroke:var(--gold);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/></svg>
    <div class="score"><b>${fmt(puan)}</b><span>/ ${maxPuan} puan</span></div></div>
    <div class="verdict">${verdict}</div>
    <div class="puanband">Net ${fmt(net)} doğru · her doğru +5, 4 yanlış 1 doğruyu götürür</div>
    <div class="rdetail">${C().name} · ${unit?chipName(unit)+" · ":""}${total} soruluk tur</div>
    <div class="rstats"><div class="stat g"><b>${right}</b><span>Doğru</span></div><div class="stat r"><b>${wrong}</b><span>Yanlış</span></div><div class="stat"><b>${total-ans}</b><span>Boş</span></div></div>
    <div class="nav"><button class="btn ghost" style="flex:1;width:auto" onclick="reviewWrong()">Yanlışları Gör</button><button class="btn primary" onclick="yenile()">Yeni Tur</button></div></div>`;
}
function reviewWrong(){setMode("review");}
let clearArmed=false;
function clearWrong(btn){if(!clearArmed){clearArmed=true;btn.textContent="Emin misin? Silmek için tekrar dokun";setTimeout(()=>{clearArmed=false;if(btn.isConnected)btn.textContent="Listeyi temizle";},3500);return;}
  clearArmed=false;pool().forEach(q=>delete saved.wrong[q.id]);save();render();}

/* LIST */
function renderList(list,emptyMsg,isReview){
  if(!list.length){app.innerHTML=`<div class="screen empty"><div class="big">✦</div><p>${emptyMsg}</p></div>`;return;}
  let html=`<div class="screen">`;
  if(isReview)html+=`<button class="clearw" onclick="clearWrong(this)">Listeyi temizle</button>`;
  list.forEach(q=>{html+=`<div class="study-item"><div class="qn">Soru ${q.n} · ${gname(q.u)}</div><div class="q">${q.q}</div>
    <div class="a"><span class="lab">${q.c}</span><span>${q.o[q.c]}</span></div>${q.ex?`<div class="ex">${q.ex}</div>`:""}</div>`;});
  html+=`</div>`;app.innerHTML=html;
}
function render(){
  if(mode==="test")renderTest();
  else if(mode==="study")renderList(pool(),"Bu bölümde soru yok.");
  else renderList(wrongList(),"Bu derste henüz yanlışın yok. Test modunda çöz.",true);
  updateSub();
}
function updateSub(){
  const n=pool().length;
  subEl.textContent = mode==="study"?`${n} soru · cevap anahtarı`:mode==="review"?`Yanlış cevapladıkların · ${wrongList().length} soru`:`${n} soru · ${unit?chipName(unit):C().scope}`;
}
function setMode(m){
  mode=m;
  if(m==="test"&&!order.length)startRound();
  if(m==="test")idx=0;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
  render();window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));

(function(){courseEl.value=course;renderHeader();renderUnits();startRound();setMode("test");})();

/* basit giriş şifresi (bir kez girilince bu cihaz hatırlar) */
(function(){
  const H=409678, gate=document.getElementById("gate");
  function h(s){let x=5381;for(const ch of s.toLowerCase().replace(/[^a-z0-9]/g,""))x=((x*33)^ch.codePointAt(0))>>>0;return x;}
  let ok=false;try{ok=localStorage.getItem(LS+"-giris")===String(H);}catch(e){}
  if(ok)return;
  gate.hidden=false;document.getElementById("pw").focus();
  document.getElementById("gateForm").addEventListener("submit",e=>{e.preventDefault();
    if(h(document.getElementById("pw").value)===H){try{localStorage.setItem(LS+"-giris",String(H));}catch(err){}gate.hidden=true;}
    else{document.getElementById("pwErr").textContent="Şifre yanlış, tekrar dene.";}});
})();
</script>
