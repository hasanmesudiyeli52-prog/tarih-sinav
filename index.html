  .course::after{content:"▾";position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:14px;pointer-events:none;}

  .tabs button{flex:1;border:0;background:transparent;font-family:inherit;font-weight:700;font-size:13px;color:var(--muted);padding:9px 4px;border-radius:10px;cursor:pointer;transition:.2s;}
  .tabs button.on{background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 4px 12px -6px rgba(27,36,64,.6);}
  .units{display:flex;gap:5px;overflow-x:auto;padding:2px 0 4px;-ms-overflow-style:none;scrollbar-width:none;}
  .units::-webkit-scrollbar{display:none;}
  .units button{flex:none;border:1px solid var(--line);background:var(--card);font-family:inherit;font-weight:700;font-size:12px;color:var(--ink-soft);padding:7px 13px;border-radius:99px;cursor:pointer;transition:.2s;white-space:nowrap;}
  .units button.on{background:var(--gold);color:#fff;border-color:var(--gold);}
  .screen{animation:fade .35s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .pbar-wrap{margin:12px 0 4px;display:flex;align-items:center;gap:10px;}
  .pbar{flex:1;height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden;border:1px solid var(--line);}
  .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#caa24b);transition:width .35s cubic-bezier(.2,.8,.2,1);}
  .pcount{font-size:12px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .qmeta{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px;gap:8px;}
  .qnum{font-family:'Fraunces',serif;font-style:italic;font-size:14px;color:var(--gold);font-weight:600;}
  .utag{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);padding:3px 9px;border-radius:99px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:19px 17px;box-shadow:var(--shadow);}
  .qtext{font-family:'Fraunces',serif;font-weight:500;font-size:18.5px;line-height:1.34;letter-spacing:-.01em;margin:0 0 15px;}
  .opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;font-family:inherit;font-size:14px;line-height:1.3;color:var(--ink);cursor:pointer;transition:transform .12s,border-color .2s,background .2s;}
  .opt:active{transform:scale(.985);}
  .opt .lab{flex:none;width:24px;height:24px;border-radius:8px;background:var(--paper-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--ink-soft);text-transform:uppercase;transition:.2s;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.correct .lab{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.wrong .lab{background:var(--red);color:#fff;border-color:var(--red);}
  .opt.dim{opacity:.5;}
  .opt[disabled]{cursor:default;}
  .explain{margin-top:4px;border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.5;animation:fade .3s both;}
  .explain.ok{background:var(--green-bg);border:1px solid var(--ok-line);}
  .explain.no{background:var(--red-bg);border:1px solid var(--no-line);}
  .explain b{font-weight:800;}
  .explain .head{display:flex;align-items:center;gap:7px;font-weight:800;margin-bottom:3px;font-size:12.5px;}
  .explain.ok .head{color:var(--green);}.explain.no .head{color:var(--red);}
  .nav{display:flex;gap:10px;margin-top:15px;}
  .nav.sticky{position:sticky;bottom:0;z-index:5;margin:15px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 72%,transparent);}
  .btn{flex:1;border:0;font-family:inherit;font-weight:800;font-size:15px;padding:14px;border-radius:13px;cursor:pointer;transition:transform .12s,opacity .2s;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--btn-bg);color:var(--btn-fg);box-shadow:var(--shadow);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);flex:none;width:52px;}
  .btn:disabled{opacity:.35;cursor:default;}
  .result{text-align:center;padding:26px 20px;}
  .ring{width:148px;height:148px;margin:4px auto 16px;position:relative;}
  .ring svg{transform:rotate(-90deg);}
  .ring .score{position:absolute;inset:0;display:grid;place-content:center;}
  .ring .score b{font-family:'Fraunces',serif;font-size:40px;font-weight:600;line-height:1;}
  .ring .score span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
  .verdict{font-family:'Fraunces',serif;font-style:italic;font-size:21px;margin:4px 0 6px;}
  .rdetail{color:var(--muted);font-size:14px;font-weight:500;margin-bottom:20px;}
  .rstats{display:flex;gap:9px;margin-bottom:20px;}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 6px;}
  .stat b{display:block;font-family:'Fraunces',serif;font-size:25px;line-height:1;}
  .stat span{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .stat.g b{color:var(--green);}.stat.r b{color:var(--red);}
  .study-item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:10px;}
  .study-item .qn{font-family:'Fraunces',serif;font-style:italic;color:var(--gold);font-size:12.5px;font-weight:600;margin-bottom:5px;}
  .study-item .q{font-family:'Fraunces',serif;font-weight:500;font-size:15.5px;line-height:1.32;margin-bottom:10px;}
  .study-item .a{display:flex;gap:9px;align-items:flex-start;background:var(--green-bg);border:1px solid var(--ok-line);border-radius:10px;padding:9px 11px;font-size:13.5px;line-height:1.35;}
  .study-item .a .lab{flex:none;width:21px;height:21px;border-radius:6px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px;text-transform:uppercase;}
  .study-item .ex{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-top:8px;padding-left:2px;}
  .clearw{display:block;margin:4px auto 14px;border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);font-family:inherit;font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:99px;cursor:pointer;}
  .gate{position:fixed;inset:0;z-index:50;background:var(--paper);display:grid;place-items:center;padding:24px 16px;}
  .gate[hidden]{display:none;}
  .gate form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow);text-align:center;}
  .gate h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;margin:6px 0 4px;}
  .gate h2 em{color:var(--gold);}
  .gate p{color:var(--muted);font-size:13px;margin:0 0 16px;}
  .gate input{width:100%;font-family:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);margin-bottom:10px;text-align:center;}
  .gate input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .gate .err{color:var(--red);font-size:12.5px;font-weight:700;min-height:18px;margin-bottom:6px;}
  .gate button{width:100%;}
  .empty{text-align:center;color:var(--muted);padding:46px 20px;}
  .empty .big{font-family:'Fraunces',serif;font-size:38px;color:var(--gold-soft);}

{"id":211,"d":"ilk-turk-islam","u":1,"x":[3],"n":16,"q":"Hz. Ömer’in şehit edilip yerine Hz. Osman’ın halife seçildiği tarihlerde Mâverâünnehir ile Hârezm’deki mahallî Türk hanedanlar bağımsızlıklarını ilan etmişlerdi. Bu duruma yol açan olay aşağıdakilerden hangisidir?","o":{"a":"Müslüman Arapların fetihleri","b":"Hazarların çöküşü ve Bulgarların yeni bir devlet kurması","c":"Sâsânîlerin yıkılması ve Göktürk nüfuzunun zayıflaması","d":"Sıffın Savaşı'nın yaşanması","e":"İslâmiyet’in doğuşu"},"c":"c"},

{"id":213,"d":"ilk-turk-islam","u":1,"x":[3,4],"n":18,"q":"Aşağıdaki olaylardan hangisi Türklerin Abbâsî halifeliğinde iktidarı tamamen ele geçirdiklerini ve kendilerine mâni olacak bir gücün bulunmadığını gösterir?","o":{"a":"Mu’tasım’ın yerine geçen oğlu Vâsık’ın da Türkleri desteklemesi","b":"Mütevekkil’in bir Türk olan Boğa el-Kebir’in müdahalesiyle öldürülmekten kurtulması","c":"Vâsık’ın veliaht tayin etmeden ölümü üzerine kardeşi Mütevekkil’in Abbasî devlet adamlarına rağmen Türklerin desteğiyle hilafet makamına geçmesi","d":"Mütevekkil’den sonra hilafet makamına yine Türklerin desteğiyle Muntasır’ın geçmesi","e":"Halîfe Mütevekkil’in Boğa es-Sağir, Musa b. Boğa el-Kebir, Hârun b. Suvartegin, Bagir et-Türkî gibi Türk kumandanlar tarafından katledilmesi"},"c":"e"},

{"id":215,"d":"ilk-turk-islam","u":1,"x":[3],"n":20,"q":"Halife Ebû Ca‛fer el-Mansûr döneminde, Kafkas Dağları’nı aşıp İslam hâkimiyetindeki topraklara giren, Suriye, el-Cezîre ve Musul’dan takviye birlikler gönderilmesine rağmen İslam ordusunu yenilgiye uğratan, hapishaneler tahliye edilip onlara karşı binlerce gönüllüden oluşan büyük bir ordu hazırlanan ve ayrıca sınırlarda kaleler inşa ettirilerek kendilerine karşı gerekli savunma tedbirleri alınan Türk devleti aşağıdakilerden hangisidir?","o":{"a":"Karluklar","b":"Uygurlar","c":"Göktürkler","d":"Karahıtaylar","e":"Hazarlar"},"c":"e"},

{"id":218,"d":"ilk-turk-islam","u":5,"n":23,"q":"\"Hindistan'dan Hârûnü'r-Reşîd'e gönderilen elçilik heyeti halifenin huzuruna çıkınca gözleri hariç her tarafı zırhla örtülü olan Türk askerleri saf tutmuş olarak saraydaki yerlerini almışlardı.\" Yukarıda verilen cümleye göre aşağıdakilerden hangisi söylenebilir?","o":{"a":"Hârûnü'r-Reşîd çok güçlü bir halifeydi.","b":"Türk askerleri cesur savaşçılardı.","c":"Halife Hindistan'dan elçileri yanına çağırmıştı.","d":"Türk askerleri Halife Hârûnü'r-Reşîd'e muhafızlık yapmaktaydı.","e":"Türk askerleri ellerinde kılıç tutmaktaydı."},"c":"d"},
{"id":219,"d":"ilk-turk-islam","u":5,"n":24,"q":"I. Emevîlerin Hazar hakanını yenilgiye uğratması II. Rus orduları karşısında tutunamayan Hazar hakanının Hârizmlilere sığınması III. Hz. Ömer zamanında Hazarlara karşı seferler düzenlenmesi IV. Hazar hakanı ile Hristiyanlar arasında sorunlar yaşanması V. Hazarlar ile İtil Bulgarları arasında ticârî ilişkilerin yaşanması Yukarıda maddeler hâlinde verilen gerekçelerden hangisi Hazarların İslâm dinini kabul etmelerinde etkili olmuştur?","o":{"a":"Yalnız IV","b":"Yalnız V","c":"Yalnız I","d":"Yalnız II","e":"Yalnız III"},"c":"d"},
{"id":220,"d":"ilk-turk-islam","u":5,"n":25,"q":"Türklerle Araplar arasında yaşanan ilişkiler bakımından aşağıdaki yargılardan hangisi yanlıştır?","o":{"a":"Türk-İslâm ve dünya tarihi açısından son derece önemli olan Talas Savaşı'nın sebepleri hakkında İslam ve Çin kaynaklarında verilen bilgiler aynıdır.","b":"Kuteybe b. Müslim'in Mâverâünnehir'i fethetmesi ve Batı Türkistan'a düzenlediği seferler bölgenin siyasi hayatında önemli değişikliklere sebep olmuştur.","c":"Talas Savaşı'ndan sonra İslâmiyet Türkler arasında yayılmaya başlamıştır.","d":"Abbâsîler devrinde Türklerin hâkimiyetindeki topraklara karşı düzenlenen fetih harekâtı hızını kaybetmiş ve Anadolu'ya yapılan gazalar dışında büyük seferler düzenlenmemiştir.","e":"Göktürklerin zayıflaması ve Mâverâünnehir'in İslâm hâkimiyeti altına alınması, Türgeş Hakanlığı'nın da Müslüman Araplar karşısında ciddi bir başarı kazanamaması üzerine Türkler Çin'den yardım istemek zorunda kalmışlardır."},"c":"a"},

{"id":224,"d":"ilk-turk-islam","u":5,"n":29,"q":"I. Karahanlılar dönemi imar faaliyetleri açısından parlak bir dönem oldu. II. Karahanlılar çok sayıda saray, camii, medrese, ribat ve köprü inşa ettiler. III. Karahanlılar devrinde türbe mimarisi büyük gelişme gösterdi. IV. Karahanlılar devrinde dikkat çeken mimarî eserlerden birisi de kervansaraylardı. V. Karahanlılar döneminin en önemli mimarî eserlerinden birisi de görkemli sur yapılarıydı. Yukarıda Karahanlı mimarisi hakkında verilen bilgilerden hangisi yanlıştır?","o":{"a":"Yalnız I","b":"Yalnız IV","c":"Yalnız III","d":"Yalnız II","e":"Yalnız V"},"c":"e"},

{"id":282,"d":"ilk-turk-islam","u":4,"n":87,"q":"Aşağıdakilerden hangisi Sultan Mahmud devri anıtlarının en ünlüsüdür?","o":{"a":"Gazne Camii","b":"Somnat Mabedi","c":"Sebük Tegin'‎in Mezarı","d":"Gazne Kalesi","e":"Sultan Mahmud Türbesi"},"c":"a","ex":"Cevap : A) Gazne Camii Açıklama : Sultan Mahmud’un en ünlü mimari eseri ve anıtı, Gazne’de inşa ettirdiği ve döneminin en görkemli yapılarından biri olan **Gazne Camii** (Arusü’l-Felek Camii) ve yanındaki saraylardır."},
{"id":283,"d":"ilk-turk-islam","u":4,"n":88,"q":"Aşağıdakilerden hangisi Batı Karahanlı Devleti döneminde gerçekleşen olaylardan değildir?","o":{"a":"Balasagunlu Yusuf Has Hacib'in Kutadgu Bilig adlı eserini Kaşgar kentinde yazması","b":"Sultan Alp Arslan'‎ın 1072 tarihinde Mâverâünnehr'‎e sefer düzenlemesi","c":"449 (1057-1058) tarihinde Buhara'da çok şiddetli bir veba salgınının meydana gelmesi","d":"Hârizmşahlar'‎ın 1212 yılında Batı Karahanlı Devletine son vermesi","e":"Melikşah'‎ın Buhara ve Semerkandı zapt ederek Ahmed Han'‎ı esir alıp Isfahan'‎a götürmesi"},"c":"a","ex":"Cevap : A) Balasagunlu Yusuf Has Hacib’in Kutadgu Bilig adlı eserini Kaşgar kentinde yazması Açıklama : **Kutadgu Bilig**, Karahanlı Devleti’nin henüz doğu ve batı olarak ayrılmadığı ve Yusuf Has Hacib’in Karahanlı Hükümdarı **Uluğ Kara Buğra Han’a** sunduğu bir eserdir. Bu eser, Karahanlıların **birleşik** döneminde (1069-1070) yazılmıştır. Batı Karahanlı Devleti’nin kurulmasından sonraki dönemde gerçekleşen olaylardan değildir."},
{"id":284,"d":"ilk-turk-islam","u":4,"n":89,"q":"Karahanlılar döneminde kullanılan edebî dil aşağıdakilerden hangisidir?","o":{"a":"Farsça","b":"Türkçe","c":"Soğdca","d":"Çince","e":"Arapça"},"c":"b","ex":"Cevap : B) Türkçe Açıklama : Karahanlılar Devleti, Türk tarihinde İslâmiyet’i kabul eden ilk büyük Türk devletidir. Bu dönemde Balasagunlu Yusuf Has Hacib’in **Kutadgu Bilig** ve Kaşgarlı Mahmud’un **Divanü Lugati’t-Türk** gibi eserleri, Karahanlıların resmî ve edebî dilinin **Türkçe** (Hakanî Türkçesi) olduğunu gösterir."},
{"id":285,"d":"ilk-turk-islam","u":4,"n":90,"q":"İtil Bulgarları bir cenazeleri olduğunda ölüyü hangi yöntemle uğurlarlardı?","o":{"a":"Irmağa atma","b":"Ağacın tepesine asma","c":"Toprağa gömme","d":"Denize atma","e":"Yakma"},"c":"c","ex":"Cevap : C) Toprağa gömme Açıklama : İtil Bulgarları, İslâmiyet’i kabul ettikten sonra, cenazeleri için eski Türk geleneklerini bırakarak, **İslâm usullerine uygun olarak ölüyü toprağa gömme** yöntemini uygulamaya başlamışlardır (İbn Fadlan’ın notlarında yer alır)."},
{"id":286,"d":"ilk-turk-islam","u":4,"n":91,"q":"“Bulgar Türkleri arasında 5.000 kadın ve erkekten müteşekkil ‘Barancer’ adıyla bilinen bir aile topluca İslâmiyet’‎e girdiler ve namaz kılmak için kendilerine ahşaptan bir cami yaptılar.” Bu ifade, aşağıdaki seyyahlardan hangisine aittir?","o":{"a":"İbn Hurdazbih","b":"İstahri","c":"Süleyman el-Tâcir","d":"Ebü'l-Fida","e":"İbn Fadlan"},"c":"e","ex":"Cevap : E) İbn Fadlan Açıklama : Bulgar Türklerinin İslâmiyet’i kabulü ve yaşamlarına dair detaylı bilgiler veren ve bizzat bu bölgelere seyahat eden ünlü Arap seyyah ve yazar **İbn Fadlan**’dır. Söz konusu ifade onun seyahatnamesinden alınmıştır."},

{"id":288,"d":"ilk-turk-islam","u":4,"n":93,"q":"Tolunoğulları ülkesinin zenginleşmesiyle isim yapmış şairlerin sayısı da bir hayli artmıştır. Tolunoğulları ilim adamları ve şairlere büyük ihsanlarda bulundukları için bu dönemde çok sayıda şair ön plana çıkmıştır. Bunlar arasında en meşhur olanı aşağıdakilerden hangisidir?","o":{"a":"Ahmed b. Yusuf b. İbrahim","b":"İbnü'd-Dâye","c":"Ahmed b. Cafer et-Dineverî","d":"el-Hüseyin b. Abdüsselâm","e":"el-Velid b. Muhammed et-Temîmî"},"c":"d","ex":"Cevap : D) el-Hüseyin b. Abdüsselâm Açıklama :"},
{"id":289,"d":"ilk-turk-islam","u":4,"n":94,"q":"Aşağıdakilerden hangisi Tolunoğlu Ahmed Camii’‎nde bulunuyordu?","o":{"a":"Çay ocağı","b":"Doktor","c":"Dershane","d":"Bakkal","e":"Han"},"c":"b","ex":"Cevap : B) Doktor Açıklama : Tolunoğlu Ahmed Camii, sadece bir ibadet yeri değil, aynı zamanda etrafında şifahaneler (hastaneler) ve ilim merkezleri de barındıran kompleks bir yapıydı. Bu yapının içinde hastalara bakan ve muayene yapan bir **Doktor** (tabip) bulunuyordu."},
{"id":290,"d":"ilk-turk-islam","u":4,"n":95,"q":"I. Abbâsî halifesi el-Kadir-Billâh adına hutbe okuttu. II. Horasan’‎a sahip oldu. III. Sistan, Cüzcan, Çağaniyan, Huttal ve Harizm’‎i hâkimiyeti altına aldı. IV. Gur bölgesini kontrol altına almaya çalıştı. V. 1032 yılında vefat etti. Yukarıda Gazneli Sultan Mahmud hakkında verilen bilgilerden hangisi yanlıştır?","o":{"a":"Yalnız IV","b":"Yalnız II","c":"Yalnız I","d":"Yalnız III","e":"Yalnız V"},"c":"e","ex":"Cevap : E) Yalnız V Açıklama : Gazneli Sultan Mahmud, 1030 yılında vefat etmiştir[cite: 614]. 1032 yılında vefat ettiği bilgisi (V) **yanlıştır**."},
{"id":291,"d":"ilk-turk-islam","u":4,"n":96,"q":"Aşağıdakilerden hangisi Gazneliler hükümdarı değildir?","o":{"a":"Şirzad","b":"III. Mesud","c":"H&amp;uuml;srevş&amp;acirc;h","d":"Ferruhş&amp;acirc;h","e":"Abd&amp;uuml;rreşid"},"c":"d","ex":"Cevap : D) FerruhşâhAçıklama :"},
{"id":292,"d":"ilk-turk-islam","u":4,"n":97,"q":"Sultan Mahmud 1030 yılında vefat ettiğinde Gazneliler Devleti batıda Azerbaycan sınırlarında, doğuda Hindistan’ın Yukarı Ganj Vadisi’ne, Orta Asya’da Hârizm’den Hint Okyanusu sahillerine kadar uzanan çok geniş bir sahayı kapsıyordu. Bu bilgilere göre aşağıdakilerden hangisine varılamaz?","o":{"a":"Sultan Mahmud'un ölüm tarihi bellidir.","b":"Gaznelilerin sınırı doğuda Hindistan toprakları içindedir.","c":"Gazneliler Devleti sınırları Hint Okyanusu kıyılarına uzanır.","d":"Gazneliler Devleti sınırları çok geniş bir yüz ölçümüne sahiptir.","e":"Azerbaycan, Gazneliler Devleti hâkimiyeti altındadır."},"c":"e","ex":"Cevap : E) Azerbaycan, Gazneliler Devleti hâkimiyeti altındadır. Açıklama : Verilen metinde, Gazneliler Devleti’nin sınırının batıda **Azerbaycan sınırlarına kadar uzandığı** belirtilmektedir. Bu ifade, sınırın Azerbaycan’da **sona erdiğini** gösterir ancak Azerbaycan’ın **tamamının veya bir kısmının** Gazneliler hâkimiyeti **altında** olduğu sonucuna net bir şekilde varılamaz. Diğer şıklar (Ölüm tarihi, genişlik, coğrafi sınırlar) metinden doğrudan anlaşılmaktadır."},
{"id":293,"d":"ilk-turk-islam","u":4,"n":98,"q":"Gazneli Sultan İbrahim ile Selçuklular arasında yapılan antlaşmaya göre Gazneliler ile Selçuklular arasındaki sınırı aşağıdakilerden hangisi oluşturmaktaydı?","o":{"a":"Nesa Ovası","b":"Ceyhun Irmağı","c":"Hindikuş Dağları","d":"Sistan Bölgesi","e":"Seyhun Irmağı"},"c":"c","ex":"Cevap : C) Hindikuş Dağları Açıklama : Gazneli Sultan İbrahim ile Selçuklular arasında yapılan antlaşmaya göre, iki devlet arasındaki sınırın **Hindikuş Dağları** olduğu kabul edilmiştir. Bu, Gaznelilerin Hindistan’a, Selçukluların ise Horasan ve batıya odaklanmasını sağlamıştır."},
{"id":294,"d":"ilk-turk-islam","u":4,"n":99,"q":"Bâbek İsyanı’‎nı bastırmayı başaran Türk kumandanı Afşin’‎i bu iş için hangi Abbâsî halifesi görevlendirmiştir?","o":{"a":"el-Kaim","b":"el-Mansûr","c":"Mu'tasım","d":"Me'‎mun","e":"el-Mütevekkil"},"c":"c","ex":"Cevap : C) Mu’tasım Açıklama : **Bâbek İsyanı**, 837 yılında, Abbâsî halifesi **Mu’tasım** döneminde, Türk kumandanı **Afşin Haydar b. Kâvûs** tarafından kesin olarak bastırılmıştır."},
{"id":295,"d":"ilk-turk-islam","u":4,"n":100,"q":"Tolunoğulları Devleti’‎nin kurucusu Ahmed b. Tolun’‎un asıl mesleği aşağıdakilerden hangisidir?","o":{"a":"Vezirlik","b":"Askerlik","c":"Demircilik","d":"Kâtiplik","e":"Muallimlik"},"c":"b","ex":"Cevap : B) Askerlik Açıklama : Tolunoğlu Ahmed, babası Tolun gibi Abbasi ordusunda görev yapan bir **asker** (Türk kumandanı) idi. Asıl mesleği askerliktir ve valiliğe bu askeri kimliğiyle yükselmiştir."},
{"id":296,"d":"ilk-turk-islam","u":4,"n":101,"q":"Hazarlar ile Abbâsîler arasındaki son askerî mücadele hangi Abbâsî halifesi döneminde yaşanmıştır?","o":{"a":"el-Mansûr","b":"Hârûn'ür Reşîd","c":"Me'‎mun","d":"Emin","e":"Saffâh"},"c":"b","ex":"Cevap : B) Hârûn’ür Reşîd Açıklama : Hazarlar ile Abbâsîler arasındaki son büyük askerî mücadele ve çatışmalar, ünlü Abbâsî halifesi **Hârûn’ür Reşîd** döneminde yaşanmıştır (özellikle 799 yılındaki Hazar seferi)."},

{"id":299,"d":"ilk-turk-islam","u":4,"n":104,"q":"“Hazarlar bölgesinde yapılan kazılarda atlara ait mezarlar ve bu mezarların içinde at iskeletlerinin yanında üzengiler, at koşum takımlarına ait halka ve gemler bulunmuştur.” Yukarıda verilen bilgiye göre Hazarlar hakkında hangisi söylenebilir?","o":{"a":"Hazarlar ölen yakınlarını at koşumları ve üzengiler ile birlikte gömerlerdi.","b":"Hazarlar at iskeletinden üzengi yaparlardı.","c":"Hazarlarda atın çok önemli bir yeri vardı.","d":"Hazarlar at kişnemesini uğurlu sayarlardı.","e":"Hazarlar ölülerini toprağa gömerlerdi."},"c":"c","ex":"Cevap : C) Hazarlarda atın çok önemli bir yeri vardı."},

{"id":301,"d":"ilk-turk-islam","u":4,"n":106,"q":"Sultan Melikşah 1090 yılında çıktığı II. Mâverâünnehr seferinde Ahmed Han’ı ülkesine iade etti. Ancak ulemâ onu katletti. Artık bu tarihten sonra Batı Karahanlı tahtına çıkacak olan hükümdarları Büyük Selçuklular tayin etmeye başladılar. Yukarıda verilen bilgilere göre aşağıdakilerden hangisine ulaşılamaz?","o":{"a":"Batı Karahanlıların Selçuklulara bağlı olduğu","b":"Batı Karahanlı ulemâsı ile hükümdar arasında anlaşmazlık olduğu","c":"Selçukluların, Batı Karahanlılara tahakküm ettiği","d":"Batı Karahanlı ulemâsının hükümdar seçiminde etkili olduğu","e":"Sultan Melikşâh'ın, II. Mâverâünnehr seferinin hangi tarihte yapıldığı"},"c":"d","ex":"Cevap : D) Batı Karahanlı ulemâsının hükümdar seçiminde etkili olduğu"},

{"id":309,"d":"ilk-turk-islam","u":4,"n":114,"q":"Gaznelilerin ekonomik faaliyetleri hakkında aşağıdaki ifadelerden hangisi yanlıştır?","o":{"a":"Gaznelilerde madencilik faaliyetleri çok zayıftı ve çıkarılan madenlerin sevkiyatı için yol hizmetleri yetersiz kalıyordu.","b":"Tüccarlar, güven içinde ticaretlerini yapabilmek ve adaletli bir yönetim için Gazneliler ülkesini tercih ediyorlardı.","c":"Sultan İbrahim zamanında Gazne'de 6000 fırıncı, 6000 zahire dükkânı faaliyet gösteriyordu.","d":"Sultan Mahmud 1009'da Narain seferini müteakip yapılan barışla Horasan-Hindistan arasındaki yolları ticarete açmış bulunuyordu.","e":"Gazne, Sultan Mahmud devrinde büyüklük ve gelişme bakımından dünyanın diğer büyük şehirlerinden daha ileri bulunuyordu."},"c":"a","ex":"Cevap : A) Gaznelilerde madencilik faaliyetleri çok zayıftı ve çıkarılan madenlerin sevkiyatı için yol hizmetleri yetersiz kalıyordu."},

/* ============ STATE ============ */
let course=COURSES[0].id, mode="test", unit=0, idx=0, order=[], answers={}, answered={};
const ROUND=20;              // her test turu en çok 20 soru (sınav gibi)
const app=document.getElementById("app"), subEl=document.getElementById("sub");
const BYID={};QUESTIONS.forEach(q=>BYID[q.id]=q);
/* kalıcı kayıt: son ders + yanlışlar (telefonda kapatıp açınca kalır) */
const LS="tarih-sinav-v3";
let saved={course:null,wrong:{}};
try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s&&typeof s==="object")saved=Object.assign(saved,s);}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(saved));}catch(e){}}
if(saved.course&&COURSES.some(c=>c.id===saved.course))course=saved.course;

function C(){return COURSES.find(c=>c.id===course);}
function gname(u){const g=C().groups.find(g=>g[0]===u);return g?(g[2]||g[1]):"";}
function coursePool(){return QUESTIONS.filter(q=>q.d===course);}
function inUnit(q,u){if(u===0)return true;const gs=[q.u].concat(q.x||[]);const cb=(C().combos||{})[u];return cb?gs.some(g=>cb.includes(g)):gs.includes(u);}
function chipName(u){const ch=(C().chips||[]).find(x=>x[0]===u);return ch?ch[1]:gname(u);}
function pool(){const p=coursePool();return p.filter(q=>inUnit(q,unit));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* test turu: havuzdan karışık en çok 20 soru */
function startRound(){order=shuffle(pool().map(q=>q.id)).slice(0,ROUND);idx=0;order.forEach(id=>{delete answers[id];delete answered[id];});}
function answeredInRound(){return order.filter(id=>answered[id]).length;}
function roundRight(){return order.filter(id=>answers[id]===BYID[id].c).length;}
/* NET PUANLAMA: her doğru +5, 4 yanlış 1 doğruyu götürür, boş etkilemez */
function scoreInfo(){const right=roundRight();const wrong=answeredInRound()-right;const net=right-wrong/4;const puan=Math.max(0,net*5);return{right,wrong,net,puan};}
function fmt(x){return Number.isInteger(x)?String(x):x.toFixed(2).replace(/\.?0+$/,"");}
function wrongList(){return pool().filter(q=>saved.wrong[q.id]);}

/* header */
function renderHeader(){
  const c=C();
  document.getElementById("kicker").textContent=c.kicker;
  const w=c.name.split(" ");const last=w.pop();
  document.getElementById("title").innerHTML=(w.length?w.join(" ")+" ":"")+"<em>"+last+"</em>";
  document.title=c.name+" — "+c.kicker;
}
const courseEl=document.getElementById("course");
courseEl.innerHTML=COURSES.map(c=>`<option value="${c.id}">${c.name} · ${QUESTIONS.filter(q=>q.d===c.id).length} soru</option>`).join("");
courseEl.addEventListener("change",()=>{course=courseEl.value;saved.course=course;save();unit=0;startRound();renderHeader();renderUnits();setMode("test");});

/* unit chips */
const unitsEl=document.getElementById("units");
function renderUnits(){
  const p=coursePool();
  const chips=C().chips||[[0,"Tümü"]].concat(C().groups.map(g=>[g[0],g[1]]));
  const defs=chips.filter(([v])=>v===0||p.some(q=>inUnit(q,v)));
  unitsEl.innerHTML=defs.length>2?defs.map(([v,l])=>`<button data-u="${v}" class="${v===unit?'on':''}">${l}</button>`).join(""):"";
  unitsEl.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{unit=+b.dataset.u;startRound();renderUnits();render();}));
}
/* Yenile: yeni karışık tur, baştan başla */
function yenile(){startRound();if(mode!=="test"){mode="test";document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.mode==="test"));}render();window.scrollTo({top:0,behavior:"smooth"});}

/* TEST */
function renderTest(){
  if(!order.length){app.innerHTML=`<div class="screen empty"><div class="big">✦</div><p>Bu bölümde soru yok.</p></div>`;return;}
  if(idx>=order.length)idx=order.length-1;
  const q=BYID[order[idx]];
  const isAns=answered[q.id], picked=answers[q.id];
  const s=scoreInfo();
  let opts="";
  for(const k of ["a","b","c","d","e"]){
    if(!q.o[k])continue;
    let cls="opt";
    if(isAns){if(k===q.c)cls+=" correct";else if(k===picked)cls+=" wrong";else cls+=" dim";}
    opts+=`<button class="${cls}" ${isAns?"disabled":""} onclick="pick('${k}')"><span class="lab">${k}</span><span>${q.o[k]}</span></button>`;
  }
  let explain="";
  if(isAns){const ok=picked===q.c;
    explain=`<div class="explain ${ok?"ok":"no"}"><div class="head">${ok?"✓ Doğru":"✕ Yanlış — Doğrusu: "+q.c.toUpperCase()}</div>${q.ex?`<div>${q.ex}</div>`:""}</div>`;}
  const last=idx===order.length-1;
  app.innerHTML=`<div class="screen">
    <div class="pbar-wrap"><div class="pbar"><i style="width:${(answeredInRound()/order.length)*100}%"></i></div><div class="pcount">${answeredInRound()}/${order.length}</div></div>
    <div class="qmeta"><span class="qnum">Soru ${idx+1} / ${order.length}</span><span class="utag">${gname(q.u)}</span><span class="lscore">${fmt(s.puan)} puan</span></div>
    <div class="card"><p class="qtext">${q.q}</p>${opts}${explain}</div>
    <div class="nav sticky"><button class="btn ghost" onclick="prev()" ${idx===0?"disabled":""}>‹</button>
    ${last?`<button class="btn primary" onclick="finish()">Sonucu Gör</button>`:`<button class="btn primary" onclick="next()">${isAns?"Sıradaki":"Atla"} ›</button>`}</div></div>`;
}
function pick(k){const q=BYID[order[idx]];if(answered[q.id])return;answers[q.id]=k;answered[q.id]=true;
  if(k!==q.c)saved.wrong[q.id]=1;else delete saved.wrong[q.id];save();
  renderTest();if(order.length&&order.every(id=>answered[id]))setTimeout(finish,700);}
function next(){if(idx<order.length-1){idx++;renderTest();}}
function prev(){if(idx>0){idx--;renderTest();}}

/* RESULT */
function finish(){
  const total=order.length,ans=answeredInRound();
  const {right,wrong,net,puan}=scoreInfo();
  const maxPuan=total*5;
  const pct=maxPuan?Math.round((puan/maxPuan)*100):0;
  const verdict=pct>=85?"Maşallah, hazırsın":pct>=65?"İyi gidiyor":pct>=45?"Biraz daha çalış":"Tekrar şart";
  const r=64,circ=2*Math.PI*r,off=circ-(Math.max(0,pct)/100)*circ;
  app.innerHTML=`<div class="screen result">
    <div class="ring"><svg width="148" height="148"><circle cx="74" cy="74" r="${r}" fill="none" style="stroke:var(--ring-track)" stroke-width="12"/>
    <circle cx="74" cy="74" r="${r}" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}" style="stroke:var(--gold);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/></svg>
    <div class="score"><b>${fmt(puan)}</b><span>/ ${maxPuan} puan</span></div></div>
    <div class="verdict">${verdict}</div>
    <div class="puanband">Net ${fmt(net)} doğru · her doğru +5, 4 yanlış 1 doğruyu götürür</div>
    <div class="rdetail">${C().name} · ${unit?chipName(unit)+" · ":""}${total} soruluk tur</div>
    <div class="rstats"><div class="stat g"><b>${right}</b><span>Doğru</span></div><div class="stat r"><b>${wrong}</b><span>Yanlış</span></div><div class="stat"><b>${total-ans}</b><span>Boş</span></div></div>
    <div class="nav"><button class="btn ghost" style="flex:1;width:auto" onclick="reviewWrong()">Yanlışları Gör</button><button class="btn primary" onclick="yenile()">Yeni Tur</button></div></div>`;
}
function reviewWrong(){setMode("review");}
let clearArmed=false;
function clearWrong(btn){if(!clearArmed){clearArmed=true;btn.textContent="Emin misin? Silmek için tekrar dokun";setTimeout(()=>{clearArmed=false;if(btn.isConnected)btn.textContent="Listeyi temizle";},3500);return;}
  clearArmed=false;pool().forEach(q=>delete saved.wrong[q.id]);save();render();}

/* LIST */
function renderList(list,emptyMsg,isReview){
  if(!list.length){app.innerHTML=`<div class="screen empty"><div class="big">✦</div><p>${emptyMsg}</p></div>`;return;}
  let html=`<div class="screen">`;
  if(isReview)html+=`<button class="clearw" onclick="clearWrong(this)">Listeyi temizle</button>`;
  list.forEach(q=>{html+=`<div class="study-item"><div class="qn">Soru ${q.n} · ${gname(q.u)}</div><div class="q">${q.q}</div>
    <div class="a"><span class="lab">${q.c}</span><span>${q.o[q.c]}</span></div>${q.ex?`<div class="ex">${q.ex}</div>`:""}</div>`;});
  html+=`</div>`;app.innerHTML=html;
}
function render(){
  if(mode==="test")renderTest();
  else if(mode==="study")renderList(pool(),"Bu bölümde soru yok.");
  else renderList(wrongList(),"Bu derste henüz yanlışın yok. Test modunda çöz.",true);
  updateSub();
}
function updateSub(){
  const n=pool().length;
  subEl.textContent = mode==="study"?`${n} soru · cevap anahtarı`:mode==="review"?`Yanlış cevapladıkların · ${wrongList().length} soru`:`${n} soru · ${unit?chipName(unit):C().scope}`;
}
function setMode(m){
  mode=m;
  if(m==="test"&&!order.length)startRound();
  if(m==="test")idx=0;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
  render();window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));

(function(){courseEl.value=course;renderHeader();renderUnits();startRound();setMode("test");})();

/* basit giriş şifresi (bir kez girilince bu cihaz hatırlar) */
(function(){
  const H=409678, gate=document.getElementById("gate");
  function h(s){let x=5381;for(const ch of s.toLowerCase().replace(/[^a-z0-9]/g,""))x=((x*33)^ch.codePointAt(0))>>>0;return x;}
  let ok=false;try{ok=localStorage.getItem(LS+"-giris")===String(H);}catch(e){}
  if(ok)return;
  gate.hidden=false;document.getElementById("pw").focus();
  document.getElementById("gateForm").addEventListener("submit",e=>{e.preventDefault();
    if(h(document.getElementById("pw").value)===H){try{localStorage.setItem(LS+"-giris",String(H));}catch(err){}gate.hidden=true;}
    else{document.getElementById("pwErr").textContent="Şifre yanlış, tekrar dene.";}});
})();
</script>
